<script>
const ROUNDS = [{"name":"Раунд 1 — Старт","categories":["Инфраструктурный комплекс","Подвижной состав","Люди и профессии","Разное"],"questions":[{"id":"R1_1_1","points":100,"question":"Какие основные задачи решает дистанция пути?","options":["Управляет процессом перевозок","Предупреждает и устраняет нарушения","Разрабатывает нормативные документы","Строит железные дороги"],"answer":"Б","explanation":"Дистанция пути - структурное подразделение, обеспечивающее техническое содержание и ремонт железнодорожного пути на участке протяжённостью десятки километров. Основные задачи: осмотр и содержание пути, стрелочных переводов, искусственных сооружений - мостов, тоннелей, путепроводов. Дистанция контролирует геометрические параметры рельсовой колеи, следит за состоянием шпал и балласта, проводит планово-предупредительный ремонт. На сети протяжённостью около 85 500 км работает более 796 300 сотрудников РЖД, значительная часть которых занята именно в путевом хозяйстве."},{"id":"R1_1_2","points":200,"question":"Что в путевом хозяйстве называют «нулевым местом»?","options":["Начало отсчёта километража пути","Вид поперечного профиля полотна","Границу между двумя дистанциями пути","Рабочее место монтёра пути"],"answer":"Б","explanation":"«Нулевое место» - это поперечный профиль земляного полотна, показывающий его конструкцию в разрезе: откосы насыпи, кюветы, обочины, основание и верхнее строение пути. По этому профилю определяют, как устроена насыпа или выемка, какие слои грунта используются, как организован отвод воды. Знание «нулевого места» критически важно для монтеров пути - по нему определяют, какие работы нужно проводить при ремонте земляного полотна. Каждый участок пути имеет свой паспорт с описанием нулевого места. Каждое «нулевое место» описывается в паспорте участка и регулярно проверяется. Современные технологии, включая спутниковый мониторинг и дроны, позволяют контролировать состояние земляного полотна в режиме реального времени."},{"id":"R1_1_3","points":300,"question":"Какого сигнала на железной дороге не существует?","options":["Жёлтый с белым","Два жёлтых сигнала","Один жёлтый","Три жёлтых сигнала"],"answer":"А","explanation":"Система железнодорожных сигналов была разработана более 150 лет назад и по сей день остаётся основой безопасности движения. Красный означает стоп, жёлтый - приготовиться, зелёный - путь свободен. Сочетание двух жёлтых означает следовать со скоростью, установленной для следования к следующему сигналу. Три жёлтых допускается в некоторых схемах. А вот сочетание жёлтого и белого не предусмотрено стандартом, так как белый цвет не является основным сигнальным цветом на железнодорожном транспорте. Благодаря строгой системе сигналов и автоматике показатель безопасности РЖД в 2025 году составил рекордные 0,397 события на миллион км - минимум за всю историю компании. По всей стране установлены тысячи светофоров и систем сигнализации."},{"id":"R1_1_4","points":400,"question":"Какой тип рельса наиболее распространён на железнодорожной сети РФ?","options":["Р 43","Р 50","Р 65","Р 75"],"answer":"В","explanation":"Рельс Р 65 (масса 65 кг/м) является основным типом рельса на магистральных железных дорогах России. Введён в эксплуатацию в 1950-х годах и до сих пор остаётся стандартом. Рельсы Р 65 изготавливают из специальной стали с повышенным содержанием хрома и ванадия, что обеспечивает высокую износостойкость. На линиях с особо тяжёлым движением, таких как БАМ и Восточный полигон, применяют более тяжёлые рельсы Р 75. Рельсы Р 43 и Р 50 используются на подъездных путях и малодеятельных линиях. По всей стране работают десятки тысяч стрелочных переводов, оснащённых рельсами разных марок."},{"id":"R1_1_5","points":500,"question":"Какой железнодорожный тоннель считается самым длинным в России?","options":["Байкальский","Кузнецовский тоннель","Северомуйский","Манский"],"answer":"В","explanation":"Северомуйский тоннель - самый длинный в России (15 343 м), расположен на БАМе в Бурятии. До его открытия в 2003 году тяжеловесные составы расцепляли и отправляли по крутому обходному пути. Строительство длилось 26 лет - с 1977 по 2003 год, строители столкнулись с 4 тектоническими разломами и горячими источниками температурой до 60 градусов. БАМ - ключевое звено Восточного полигона, и именно с появлением тоннеля по нему пошли полновесные составы: раньше тяжёлые поезда приходилось расцеплять и вести по обходному пути. Магистраль вошла в строй в 1977 году, а в 2024-м отметила своё 40-летие."},{"id":"R1_2_1","points":100,"question":"Как называется поезд, курсирующий по Московским центральным диаметрам?","options":["Сапсан","Иволга","Лебедь","Стриж"],"answer":"Б","explanation":"Электропоезд «Иволга» (ЭП2Д) - российский поезд, разработанный Тверским вагоностроительным заводом специально для МЦК и МЦД. Он отличается широкими дверями для быстрой посадки и высадки и отсутствием тамбуров между вагонами - это позволяет пассажирам свободно перемещаться по всему составу. Поезда комплектуются системами кондиционирования, USB-зарядками и бесплатным Wi-Fi.Поезда «Иволга» стали основой подвижного состава для Московских центральных диаметров и МЦК, обеспечивая высокую пропускную способность городского транспорта."},{"id":"R1_2_2","points":200,"question":"Какие поезда уже сегодня могут ездить без машиниста?","options":["Иволга-М","Ласточка","Сапсан","Стриж"],"answer":"Б","explanation":"Беспилотная «Ласточка» впервые была испытана на испытательном кольце в Щербинке в 2019 году. В 2023 году на МЦК машинист одновременно управлял двумя беспилотными «Ласточками», каждая следовала по своему маршруту. Система основана на компьютерном зрении и ИИ: камеры и лидары сканируют обстановку, алгоритмы принимают решения. Поезд способен самостоятельно останавливаться на станциях, реагировать на сигналы, обходить препятствия. Коммерческая эксплуатация планируется к 2030 году. Параллельно РЖД развивает технологию «Виртуальная сцепка»: в 2025 году по ней выполнено 88 800 отправок - рост 17,1 % к 2024 году."},{"id":"R1_2_3","points":300,"question":"Как называют вагон не того направления, случайно попавший в другой состав?","options":["Заяц","Косой","Зять","Чужак"],"answer":"Г","explanation":"«Чужак» - жаргонное название вагона, который по ошибке попал в состав, следующий не по тому направлению. Это происходит на сортировочных горках, где вагоны распределяются по маршрутам. Если вагон отправился не в ту колею, его называют «чужаком». Такой вагон необходимо отцепить и отправить правильным составом. На крупных станциях «чужаки» - серьёзная проблема: они задерживают отправление поездов и требуют дополнительных маневровых операций. Технология «Виртуальная сцепка» позволяет минимизировать подобные ошибки: в 2023 году по ней прошло 35 900 поездов, а 1 900+ локомотивов оснащены системами автоматизации, снижающими человеческий фактор."},{"id":"R1_2_4","points":400,"question":"Какой туристический проект Юго-Восточной магистрали стал визитной карточкой Воронежской области?","options":["Княжеский поезд","«Графский» поезд","Дворянский поезд","Баронский вагон"],"answer":"Б","explanation":"«Графский поезд» - ретросостав на паровозной тяге, курсирующий с августа 2021 года по маршруту Воронеж - Графская - Рамонь. Поезд оформлен в стиле начала XX века: проводники в костюмах той эпохи, вагоны с элементами декора, напоминающими о графских усадьбах Воронежской области. Маршрут проходит через живописные места - леса, реку Воронеж, усадьбу Рамонь. Проект стал частью стратегии РЖД по развитию внутрироссийского туризма. В 2025 году турпоезда РЖД перевезли рекордные 1,3 млн пассажиров - рост на 36% по сравнению с 2023 годом. Сегодня работает 112 туристических маршрутов в 48 регионах России, и «Графский поезд» - один из первых проектов, заложивших основу этого направления."},{"id":"R1_2_5","points":500,"question":"Какой туристический железнодорожный маршрут сегодня самый популярный у россиян?","options":["Карелия","Кавказ","Белоруссия","Камчатка"],"answer":"А","explanation":"Карелия стабильно является лидером по популярности среди железнодорожных туристических направлений. Туристические поезда отправляются из Москвы, Санкт-Петербурга и Петрозаводска. Маршруты включают посещение водопадов Кивач, горных озёр, деревянного зодчества и Кижей. Средняя продолжительность тура - 5-7 дней. Пассажиры размещаются в специальных вагонах-гостиницах с комфортными купе. РЖД активно развивает этот проект, увеличивая число поездов и маршрутов. В 2025 году турпоезда перевезли рекордные 1,3 млн пассажиров - на 36% больше, чем в 2023 году. Сегодня работает 112 туристических маршрутов в 48 регионах России, а Карелия остаётся безусловным лидером по числу заказов и пассажиропотоку."},{"id":"R1_3_1","points":100,"question":"В какой день в России впервые отметили День машиниста?","options":["31 марта 2023 года","23 августа 2022 года","1 сентября 2023 года","8 марта 2024 года"],"answer":"А","explanation":"31 марта 2023 года в России впервые отметили День машиниста. Эта профессия - самая старая на железной дороге: машинисты появились вместе с первыми поездами в 1837 году. Праздник был учреждён по инициативе РЖД и поддержан Минтрудом. Машинист - лицо железной дороги, от его профессионализма зависит жизнь и безопасность тысяч пассажиров. В компании работают более 50 000 машинистов и их помощников, каждый из них ежегодно проходит строгую аттестацию. Ответственность машинистов растёт вместе с объёмами перевозок и скоростью поездов."},{"id":"R1_3_2","points":200,"question":"Сколько в России детских железных дорог?","options":["10","16","26","48"],"answer":"В","explanation":"В России работает 26 детских железных дорог - уникальных учебно-производственных объектов, где школьники осваивают железнодорожные профессии. Старейшая - Красноярская, работает с 1936 года. Детские железные дороги расположены в крупнейших городах: Москва, Санкт-Петербург, Новосибирск, Екатеринбург и других. Учащиеся 10-15 лет проходят обучение по специальностям: машинист, дежурный по станции, составитель поездов, монтер пути. На дорогах используются уменьшенные копии настоящих локомотивов и вагонов. Многие выпускники затем связывают жизнь с РЖД. Помимо 26 детских дорог, в системе РЖД работают 6 учебных центров, а в образовательных мероприятиях компании приняли участие более 20 млн человек. Компания активно привлекает молодёжь к железнодорожным профессиям."},{"id":"R1_3_3","points":300,"question":"В каком году в РЖД появились первые женщины-машинисты?","options":["2003","2013","2018","2022"],"answer":"Г","explanation":"1 января 2021 года Минтруд России исключил профессию машиниста из перечня работ с тяжёлыми условиями труда, где запрещена женская занятость. Это открыло дорогу женщинам в кабину локомотива. 31 января 2022 года Алёна Миронова из Башкортостана первой из женщин-машинистов отправилась в рейс на пассажирском поезде. К 2025 году в РЖД работают более 100 женщин-машинистов. Все они прошли тот же курс обучения, что и мужчины, включая практику на учебном полигоне. В 2023 году отмечен первый День машиниста - профессиональный праздник, учреждённый по инициативе РЖД. В компании работают более 50 000 машинистов и их помощников."},{"id":"R1_3_4","points":400,"question":"Какой специалист отвечает за коммерческий осмотр вагонов?","options":["Коммерческий директор","Коммерческий коллектор","Осмотрщик поездов","Приёмщик поездов"],"answer":"Г","explanation":"Приёмщик поездов - специалист, который первым встречает прибывший поезд на сортировочной станции. Его задача - осмотреть состав и найти коммерческие неисправности: повреждённые замки, сорванные пломбы, негерметичные люки. Приёмщик проверяет состояние тентов, дверей крытых вагонов, исправность запорных устройств цистерн. По статистике около 2% вагонов прибывают с коммерческими неисправностями, и их своевременное обнаружение экономит миллионы рублей. По статистике около 2 % вагонов прибывают с коммерческими неисправностями, и их своевременное обнаружение экономит миллионы рублей."},{"id":"R1_3_5","points":500,"question":"Какой специалист отцепляет вагоны на станции?","options":["Дежурный по станции","Разборщик поездов","Составитель поездов","Сцепщик вагонов"],"answer":"В","explanation":"Составитель поездов - одна из ключевых профессий на железнодорожной станции. Именно составители расформировывают прибывшие составы и формируют новые по маршрутам назначения. На сортировочных горках за сутки разбирают и формируют до 5 500 вагонов. Составитель работает в условиях постоянного риска: он находится среди движущихся вагонов, управляет сцеплением и расцеплением. Профессия требует физической выносливости, внимательности и знания устройства вагонов. Такой результат невозможен без качествовой работы составителей на сортировочных станциях."},{"id":"R1_4_1","points":100,"question":"Какая американская звезда выступала перед строителями БАМа?","options":["Мик Джаггер","Элвис Пресли","Джон Леннон","Дин Рид"],"answer":"Г","explanation":"Дин Рид - американский певец и актёр, которого называли «красным Элвисом». В 1979 году он дал серию концертов для строителей БАМа. За 19 дней он выступил в крупных городах и отдалённых посёлках магистрали. Рид был горячим сторонником социалистических идей и одним из немногих западных деятелей культуры, который регулярно бывал в СССР. Его концерты на БАМе стали культурным событием: на выступления приходили тысячи людей. БАМ был грандиозным строительством длиной 5 600 км, для которого привлекли более 2 млн строителей. На пике работ в один день укладывали рекордные 8,1 км пути. В 2024 году БАМ отметил 40-летие, а сегодня магистраль является ключевым звеном Восточного полигона РЖД."},{"id":"R1_4_2","points":200,"question":"Сколько тоннелей и мостов оцифровано РЖД с помощью цифровых моделей и беспилотных систем?","options":["162 тоннеля и 22 моста","86 тоннелей и 14 мостов","240 тоннелей и 31 мост","45 тоннелей и 9 мостов"],"answer":"А","explanation":"РЖД переводит обследование железнодорожной инфраструктуры в цифровой формат: оцифрованы 162 тоннеля и 22 моста. Цифровые модели строятся по данным лазерного сканирования и съёмки с беспилотных летательных аппаратов, поэтому обследование объекта занимает в три раза меньше времени, чем привыезде специалистов на место с оборудованием. Цифровой двойник сооружения позволяет заранее просчитать его состояние, смоделировать нагрузку и запланировать ремонт до того, как появятся признаки повреждений. Подход особенно важен для тоннелей и мостов, где очное обследование требует специальных мер безопасности."},{"id":"R1_4_3","points":300,"question":"Какое историческое событие способствовало появлению аббревиатур на железной дороге?","options":["Революция 1905 года","Революция 1917 года","Картофельные бунты","Первая мировая война"],"answer":"Г","explanation":"Во время Первой мировой войны резко выросла нагрузка на телеграфные службы железных дорог. Телеграммы передавались вручную, и каждое слово стоило времени. Для ускорения связи начали использовать сокращения: Путь - П, Тяга - Т, Телеграф - Ш, Электрификация - Э. Эти аббревиатуры так прочно вошли в обиход, что используются по сей день. Например, ПЧ - путевая дистанция, ТЧЭ - тяговое электровозное депо, ДЦС - диспетчерский центр сигнализации. Сегодня на сети работает более 796 300 сотрудников РЖД, и сокращения остаются неотъемлемой частью железнодорожного языка. Аббревиатуры упрощают коммуникацию между множеством структурных подразделений компании."},{"id":"R1_4_4","points":400,"question":"В каком году в России появился первый железнодорожный музей?","options":["1813","1837","1896","1905"],"answer":"А","explanation":"Первый в России и один из старейших в мире железнодорожных музеев был открыт в 1813 году - за 24 года до запуска первой российской железной дороги! Музей находился при Институте корпуса инженеров путей сообщения в Санкт-Петербурге. Он собирал образцы рельсов, вагонов и механизмов из разных стран мира. Сегодня это Музей железных дорог России, расположенный в здании Финляндского вокзала. Коллекция насчитывает более 50 000 экспонатов. В музее представлены локомотивы разных эпох - от первых паровозов до современных электровозов. РЖД развивает квантовую коммуникационную сеть протяжённостью 7 858 км - одну из крупнейших в мире, обеспечивая защиту данных на железнодорожной инфраструктуре."},{"id":"R1_4_5","points":500,"question":"Какая фигура возвышается над шпилем Казанского вокзала?","options":["Красная звезда","Парящий феникс","Крылатый змей","Трёхголовый пёс"],"answer":"В","explanation":"Над шпилем Казанского вокзала в Москве возвышается флюгер в виде золотого дракона Зиланта - легендарного покровителя Казани. Впервые он появился на вокзале в 1913 году, когда был открыт новый корпус, спроектированный Алексеем Щусевым. Зилант - символ Татарстана, изображённый на гербе Казани. Флюгер весит около 50 кг и выполнен из меди с позолотой. Он вращается по ветру, указывая направление. Фигура Зиланта стала одним из узнаваемых символов Москвы. Казанский вокзал обслуживает маршруты, связывающие Москву с Поволжьем и Уралом."}]},{"name":"Раунд 2 — Глубина","categories":["Инфраструктура и тяга","Подвижной состав","Сортировка и движение","Разное"],"questions":[{"id":"R2_1_1","points":100,"question":"Какая ширина колеи российских железных дорог?","options":["1 435 мм","1 600 мм","1 668 мм","1 520 мм"],"answer":"Г","explanation":"Ширина колеи российских железных дорог - 1 520 мм. Это уникальный стандарт, принятый в 1942 году по предложению Николая Львова. Ширина 1 520 мм шире европейского стандарта 1 435 мм, но уже испанско-португальской 1 668 мм. По сравнению с европейской колеёй российская обеспечивает большую устойчивость состава и позволяет перевозить более тяжёлые грузы. Колею 1 520 мм сегодня применяют около 20 стран, близкую к ней 1 524 мм - ещё около полутора десятков. На сети РЖД протяжённостью около 85 500 км стандарт 1 520 мм обеспечивает перевозку тяжеловесных составов массой до 7 100 тонн на Восточном полигоне."},{"id":"R2_1_2","points":200,"question":"Какое инженерное сооружение считается самой красивой точкой БАМа?","options":["Байкальский тоннель","Мост через Амур","Северомуйский тоннель","Чёртов мост"],"answer":"Г","explanation":"«Чёртов мост» - полукруглый виадук через реку Итыкит на БАМе, построенный в 1986 году. Высота моста - 36 метров, длина - более 300 метров. Он назван так потому, что при тяжёлом составе конструкция раскачивалась, и машинисты боялись по нему проезжать. Мост стал одним из символов БАМа и популярным местом для фотографий. Сегодня он является объектом туристического внимания - к нему организуются экскурсии. БАМ длиной 5 600 км был построен более 2 млн строителей, а в 2024 году магистраль отметила 40-летие."},{"id":"R2_1_3","points":300,"question":"На каком вокзале перроны на втором этаже?","options":["Курский","Рижский","Витебский","Ладожский"],"answer":"В","explanation":"Витебский вокзал в Москве - единственный вокзал в России с перронами на втором этаже. Строительство началось в 1902 году по проекту инженера Ивана Рерберга. Вокзал был первым в мире с лифтами для подъёма багажа к перронам. Пассажиры поднимаются на платформу по лестницам и эскалаторам. Витебский вокзал обслуживает пригородные поезда в направлении Тулы, Воронежа, Курска. Здание вокзала является памятником архитектуры и объектом культурного наследия."},{"id":"R2_1_4","points":400,"question":"Какие два типа тягового тока используются на железных дорогах России?","options":["Постоянный 1 500 В и переменный 10 000 В","Только переменный 25 000 В","Постоянный 5 000 В и переменный 50 000 В","Постоянный 3 000 В и переменный 25 000 В"],"answer":"Г","explanation":"Российские железные дороги используют два типа тягового тока: постоянный 3 000 В и переменный 25 000 В, 50 Гц. Это уникальное инженерное решение, сложившееся исторически. Переменный ток более эффективен на длинных перегонах, постоянный - проще в оборудовании. Электровозы одной серии, например ВЛ80, могут работать на обоих типах тока благодаря системе двойного питания. В мире аналогичная ситуация только в Испании и Португалии. По всей стране работают 13 152 локомотива, включая локомотивы двойного питания."},{"id":"R2_1_5","points":500,"question":"С каким чудом природы столкнулись бамовцы при строительстве Северомуйского тоннеля?","options":["Гейзеры","Миражи","Шаровая молния","Полярное сияние"],"answer":"А","explanation":"При бурении Северомуйского тоннеля строители обнаружили 4 тектонических разлома с горячими источниками. Температура воды достигала 60 градусов, пар заполнял забой. Рабочие трудились в одном белье при невыносимой жаре и влажности. Геологическая обстановка была настолько сложной, что строительство приостанавливалось несколько раз. Инженерам удалось обуздать стихию, создав систему водоотлива и термозащиты. Строительство тоннеля заняло 26 лет - с 1977 по 2003 год. Тоннель длиной 15 343 м стал самым длинным в России и расположен на БАМе - магистрали, проходящей через Бурятию. С открытием тоннеля путь через Ангараканский перевал сократился с 57 до 23 км, а время в пути — с двух часов до 25 минут."},{"id":"R2_2_1","points":100,"question":"Сколько локомотивов находится в парке ОАО «РЖД»?","options":["До 5 000","Примерно 8 500","13 152","Более 20 000"],"answer":"В","explanation":"Парк локомотивов ОАО «РЖД» насчитывает 13 152 единицы подвижного состава по данным на 2025 год. В него входят грузовые электровозы - основная часть, пассажирские электровозы - около 1 500, тепловозы - более 5 000, маневровые локомотивы и промышленные. Парк постоянно обновляется: в 2025 году РЖД получили 399 новых локомотивов. Инвестиции в подвижной состав составили 253,7 млрд рублей. Самые массовые серии: грузовой электровоз ВЛ80, пассажирский ЭП1, тепловоз 2ТЭ25А. Новые модели включают двухсистемный ЭС105 «Финист» и грузовой 2ЭС11 «Орлиный взлёт» на 42% мощнее предшественника. Запланирован водородный поезд для Сахалина на 2026-2027 годы."},{"id":"R2_2_2","points":200,"question":"Какая серия обозначает пассажирский электровоз переменного тока?","options":["ТЭМ18","ВЛ80","ЭП1","2ТЭ10"],"answer":"В","explanation":"ЭП1 - самый распространённый пассажирский электровоз переменного тока на сети РЖД. Расшифровка: Э - электровоз, П - пассажирский, 1 - первая модель в серии. Выпускается с 1999 года на Новочеркасском электровозостроительном заводе. Мощность - 4 800 кВт, максимальная скорость - 140 км/ч. ЭП1 способен вести поезд массой до 1 100 тонн на подъёме. В парке РЖД более 1 200 таких локомотивов. В 2025 году в парк поступило 399 новых локомотивов, а инвестиции в подвижной состав составили 253,7 млрд рублей."},{"id":"R2_2_3","points":300,"question":"Какой вид транспорта стал основой для создания первого в СССР скоростного поезда?","options":["Самолёт","Пароход","Вертолёт","Автомобиль"],"answer":"А","explanation":"В конце 1960-х годов в СССР был создан экспериментальный скоростной вагон, на который установили реактивный двигатель от самолёта ЯК-40. Испытания проводились на полигоне в подмосковной Щербинке. Вагон развил скорость более 250 км/ч, но проект был закрыт из-за высокой стоимости и сложности эксплуатации. Тем не менее, этот эксперимент заложил основу для создания отечественных скоростных поездов. Впоследствии в 2009 году был запущен «Сапсан» - скоростной поезд на базе немецкого ICE. Сегодня РЖД строит высокоскоростную магистраль Москва - Санкт-Петербург (ВСМ), а в декабре 2024 года запущен скоростной поезд «Аврора». В 2025 году высокоскоростными поездами перевезено 19,4 млн пассажиров."},{"id":"R2_2_4","points":400,"question":"Кто на железной дороге сопровождает тяжеловесные составы и контролирует допуск поездов повышенной массы?","options":["Проводник","Слесарь по ремонту подвижного состава","Начальник железнодорожной станции","Специальный представитель РЖД"],"answer":"Г","explanation":"Специальный представитель ОАО «РЖД» - специалист, который сопровождает тяжеловесные поезда и даёт разрешение на их отправление по маршруту. Он проверяет соответствие состава и локомотива допустимым параметрам, согласовывает режим движения по особо сложным и опасным участкам, контролирует работу сцепных устройств и тормозов. На тяжеловесных маршрутах Восточного полигона составы массой свыше 7 000 тонн идут по особому расписанию, и ответственность за их допуск несёт именно специальный представитель компании. Работа требует знания норм технической эксплуатации и опыта обращения с конкретными типами подвижного состава."},{"id":"R2_2_5","points":500,"question":"Что такое «Виртуальная сцепка»?","options":["Автоматическое соединение вагонов","Управление двумя и более поездами как единой системой","Магнитные сцепки","Централизованное управление из диспетчерского центра"],"answer":"Б","explanation":"«Виртуальная сцепка» - передовая технология РЖД, позволяющая управлять двумя и более поездами как единой системой без физического соединения. Поезда следуют один за другим с минимальной дистанцией, координируясь через цифровую платформу. Система автоматически регулирует скорость, торможение и ускорение каждого поезда. Технология значительно увеличивает пропускную способность линии. В 2025 году по технологии «Виртуальной сцепки» выполнено 88 800 отправок - рост 17,1 % к 2024 году. Технология испытывается в пассажирском сегменте, на участке Россошь - Лихая протяжённостью 276 км, и готовится к коммерческой эксплуатации."},{"id":"R2_3_1","points":100,"question":"Какой важнейший показатель работы железнодорожного транспорта измеряется в тонно-километрах?","options":["Погрузка","Выгрузка","Грузооборот","Производительность"],"answer":"В","explanation":"Грузооборот - суммарная работа по перевозке грузов, измеряемая в тонно-километрах. Один тонно-километр - это перевозка одного тонны груза на расстояние одного километра. Это главный показатель работы грузового транспорта. По грузообороту РЖД занимают ведущие позиции в мире. Показатель зависит от массы перевезённых грузов и дальности перевозки. В 2025 году РЖД загрузили 1 115,8 млн тонн грузов, а средняя скорость поездов достигла 494,5 км/сутки - на 21,9% выше уровня предыдущего года. Это обеспечило эффективное функционирование Восточного полигона."},{"id":"R2_3_2","points":200,"question":"Что называют плохим бегуном и хорошим бегуном?","options":["Безбилетника","Грузовой вагон","Рельсошпальную решётку","Спортсмена"],"answer":"Б","explanation":"«Бегун» - грузовой вагон, скатывающийся с сортировочной горки под действием силы тяжести. «Плохой бегун» - крытый 4-осный вагон массой около 25 тонн: он легко останавливается из-за малого веса и трения. «Хороший бегун» - полувагон массой до 70 тонн: он набирает скорость и проезжает большие расстояния. От того, какой вагон используется как «бегун», зависит эффективность сортировки. На горках специально подбирают вагоны нужного веса для обеспечения точной остановки."},{"id":"R2_3_3","points":300,"question":"Что железнодорожники называют «Ниткой»?","options":["Поездной маршрут","Спецодежду машиниста","Контактный провод","Пломбировочное устройство"],"answer":"А","explanation":"«Нитка» - жаргонное название поезда, используемое железнодорожниками. Термин происходит от графического отображения маршрута поезда на графике движения: поезд изображается в виде линии - «нитки» - с указанием номера и времени проследования станций. Диспетчеры работают с «нитками» на графиках, где каждая линия - это отдельный поезд. Выражение «поймать нитку» означает вписать поезд в график. На вокзалах графики движения поездов традиционно показываются в виде пересекающихся «ниток»."},{"id":"R2_3_4","points":400,"question":"Какая профессия на железной дороге отвечает за прогноз погоды на участке?","options":["Синоптик","Сейсмолог","Гляциолог","Скульптор"],"answer":"А","explanation":"Синоптик - метеоролог, работающий на железной дороге. Железнодорожный транспорт крайне чувствителен к погодным условиям: метель может остановить движение, гололёд - нарушить контактную сеть, жара - вызвать деформацию рельсов. Синоптики РЖД составляют прогнозы на сутки и перспективу, предупреждают об опасных явлениях. Их прогнозы помогают быть готовыми к катаклизмам: сколько снега выпадет, будет ли ледяной дождь, какой ветер ожидается. На крупных узлах синоптики работают круглосуточно."},{"id":"R2_3_5","points":500,"question":"Что на железной дороге имеет «горб»?","options":["Грузовой вагон","Пассажирская платформа","Подъездной путь станции","Сортировочная горка"],"answer":"Г","explanation":"Сортировочная горка - инженерное сооружение для автоматической сортировки вагонов по станциям назначения. Состоит из надвижной части, вершины - «горба» - и спускной части. Вагоны подаются на горку, где автоматически расцепляются и скатываются по наклонным путям в нужные колеи. Первая в России горка была построена в 1899 году на станции Ртищево. Крупнейшие горки перерабатывают до 5 500 вагонов в сутки. «Горб» - это точка, где вагон переходит от подъёма к спуску. На сети РЖД протяжённостью около 85 500 км действуют десятки сортировочных горок, обеспечивающих обработку 1 115,8 млн тонн грузов в год."},{"id":"R2_4_1","points":100,"question":"Какой ретропоезд впервые отправился в рейс в новогодние праздники 2023 года?","options":["«Дворцовый»","«Императорский»","«Лахта»","«Орёл»"],"answer":"В","explanation":"Ретропоезд «Лахта» - проект Октябрьской железной дороги, впервые отправившийся в рейс в новогодние праздники 2023 года. Название происходит от карельского слова «лахта» - залив. Поезд оформлен в стиле русского модерна: вагоны украшены лепниной, хрустальными люстрами, мебелью из натурального дерева. В одном из вагонов установлены восковые фигуры героев фильма «Москва слезам не верит». Маршрут пролегает через Карелию - один из самых живописных регионов России. В 2025 году турпоезда РЖД перевезли рекордные 1,3 млн пассажиров - на 36% больше, чем в 2023 году. Сегодня работает 112 туристических маршрутов в 48 регионах."},{"id":"R2_4_2","points":200,"question":"Под каким названием известна Дуровская железная дорога?","options":["Звериная","Мышиная","Гусиная","Тюленья"],"answer":"Б","explanation":"«Мышиная железная дорога» - знаменитый аттракцион на ВДНХ в Москве, которому более 130 лет. Начало было положено в 1886 году, когда Владимир Дуров выступал с мышами на цирковой арене. Постепенно аттракцион превратился в полноценную миниатюрную железную дорогу, где мыши тянули вагончики. За историю аттракциона в нём участвовало более 100 животных - не только мыши, но и ёжики, белки, хорьки. «Мышиная железная дорога» стала одной из визитных карточек ВДНХ. Железнодорожная тематика глубоко укоренена в российской культуре, а 26 детских железных дорог продолжают традицию воспитания будущих железнодорожников."},{"id":"R2_4_3","points":300,"question":"Как называется станция, расположенная в самой середине Транссибирской магистрали?","options":["Золотая","Половина","Середина","Центральная"],"answer":"Б","explanation":"Станция Половина - географический центр Транссибирской магистрали, расположена на 3 512-м километре от Москвы. Построена в 1902 году. Интересно, что ранее «Серединой» называлась станция на ледовой переправе через озеро Байкал, но после постройки Байкальского тоннеля геометрический центр сместился. Станция находится в Красноярском крае. На станции установлен памятный знак, и многие путешественники специально останавливаются здесь, чтобы сфотографироваться на фоне таблички «Половина пути»."},{"id":"R2_4_4","points":400,"question":"Что было главным развлечением для пассажиров «Ориентал Экспресс» в начале XX века?","options":["Телевизор","Пылесос","Самовар","Кофеварка"],"answer":"Б","explanation":"Легендарный поезд «Ориентал Экспресс» - один из самых роскошных поездов в истории. В начале XX века среди пассажиров была мода испытывать новинки цивилизации. Электрический пылесос, изобретённый за пару лет до запуска поезда, стал одним из главных развлечений. Пассажиры с удовольствием пробовали новое устройство для уборки купе. «Ориентал Экспресс» связывал Париж со Стамбулом, проходя через Швейцарию, Австрию и Сербию. Поезд стал символом золотой эпохи железнодорожных путешествий. Сегодня РЖД возрождает традицию роскошных путешествий: в 2025 году турпоезда перевезли 1,3 млн пассажиров по 112 маршрутам в 48 регионах."},{"id":"R2_4_5","points":500,"question":"Какой город стал родоначальником «Лыжной стрелки»?","options":["Ленинград","Свердловск","Хабаровск","Горький"],"answer":"А","explanation":"В январе 1948 года в Ленинграде впервые запустили «Лыжную стрелку» - бесплатный пригородный поезд для любителей лыжных прогулок. Поезд доставлял лыжников из города в пригородные лесопарковые зоны и обратно. Проект стал символом заботы о здоровье горожан и был чрезвычайно популярен. Впоследствии аналогичные проекты появились и в других городах Советского Союза. Сегодня РЖД возрождает традицию бесплатных пригородных поездов для различных категорий граждан. Только по линии МЦД-1 в 2025 году перевезено 93,5 млн пассажиров."}]},{"name":"Раунд 3 — Масштаб","categories":["Инфраструктурный комплекс","Подвижной состав","Управление и профессии","Разное"],"questions":[{"id":"R3_1_1","points":100,"question":"Как называют перекрёстный стрелочный перевод на четыре направления?","options":["Глухарь","Осьминог","Англичанка","Трёхгранник"],"answer":"В","explanation":"«Англичанка» - перекрёстный стрелочный перевод, ведущий крест-накрест с двух путей на четыре направления. Название происходит от того, что первые такие переводы были разработаны английскими производителями. Конструкция «англичанки» позволяет поездам с любого из двух путей следовать на четыре направления. Это сложное инженерное сооружение применяется на крупных узловых станциях, где требуется максимальная гибкость маршрутов. Техническое обслуживание «англичанки» требует высокой квалификации. Десятки тысяч стрелочных переводов, включая уникальные «англичанки», обеспечивают маневренность и пропускную способность."},{"id":"R3_1_2","points":200,"question":"Какой специалист дважды в год борется с изменением размеров стыков между рельсами?","options":["Машинист","Монтер пути","Поездной диспетчер","Рельсоукладчик"],"answer":"Б","explanation":"Монтер пути - специалист, который следит за состоянием железнодорожного полотна. Дважды в год, летом и зимой, он борется с изменением размеров стыков между рельсами. Летом при нагреве рельсы удлиняются и могут «выбросить» - выгнуться в стороны. Зимой при охлаждении рельсы укорачиваются и образуются опасные ямы - зазоры между стыками. Монтеры пути регулируют зазоры, затягивают болты, следят за состоянием стыковых балок. Это одна из самых тяжёлых и ответственных профессий на железной дороге. По всей стране работают тысячи монтеров пути."},{"id":"R3_1_3","points":300,"question":"Что обязательно должно присутствовать в гардеробе сигналиста?","options":["Резиновые сапоги","Сигнальная шапка","Сигнальные рукава","Резиновые перчатки"],"answer":"В","explanation":"Сигнальные рукава - обязательный элемент экипировки сигналиста на железнодорожной дороге. Они изготовлены из флуоресцентной ткани, отражающей свет, и видны на расстоянии более 1000 метров. Без рукавов и сигнального жилета на путь выходить категорически запрещено - это вопрос безопасности. Сигналист подаёт рукавами сигналы машинистам: «стоп», «приготовиться к отправлению», «проход разрешён». В ночное время используются фонарики с красным и зелёным светом."},{"id":"R3_1_4","points":400,"question":"Какая железнодорожная станция считается самой крупной в России?","options":["Инская","Лужская","Тайшет","Юдино"],"answer":"Б","explanation":"Станция Лужская - самая крупная по площади железнодорожная станция в России. Её сортировочная система занимает около 270 гектаров, а протяжённость путей всего Усть-Лужского узла превышает 300 километров. Станция расположена на Октябрьской железной дороге в Ленинградской области. Это настоящий железнодорожный город с сортировочными путями, припортовыми грузовыми парками и промышленными подъездами. Лужская является ключевым узлом на пути из Санкт-Петербурга в Москву. На станции работают тысячи железнодорожников. Станция Лужская является примером масштаба инфраструктуры РЖД: сеть компании включает десятки крупных узловых станций."},{"id":"R3_1_5","points":500,"question":"На какой линии в России участок с левосторонним движением?","options":["Казань — Тверь","Тайшет — Канск","Ульяновск — Пенза","Москва — Рязань"],"answer":"Г","explanation":"Участок Москва - Рязань - единственная линия в России с левосторонним движением поездов. Магистраль строили англичане в середине XIX века и, следуя своей традиции, организовали движение по левой стороне. На этом участке светофоры расположены по левую руку от машиниста, а пассажиры выходят из поездов с непривычной стороны. Перейти на правостороннее движение не удалось из-за высокой плотности движения и технической сложности перехода. Участок является уникальным явлением российской железнодорожной истории. На сети компании приходится множество таких исторических особенностей, каждая из которых связана с уникальной историей строительства."},{"id":"R3_2_1","points":100,"question":"Как называются грузовые вагоны-самосвалы?","options":["Гондола","Хоппер","Думпкар","Бункер"],"answer":"В","explanation":"Думпкар - специализированный грузовой вагон-самосвал для перевозки сыпучих грузов. Главная особенность - способность наклоняться на 45 градусов вправо и влево, обеспечивая выгрузку на любую сторону. Грузоподъёмность - до 80 тонн. Думпкары используются для перевозки щебня, гравия, песка, минеральных удобрений. Они незаменимы при строительстве и ремонте железных дорог - позволяют быстро разгружать материалы прямо на месте работ. Думпкары играют важную роль в обеспечении строительных работ на сети компании."},{"id":"R3_2_2","points":200,"question":"Какая ресурсосберегающая технология на сети самая распространённая?","options":["Плановая замена элементов ВСП","Очистка кюветов","Повторная укладка старогодных материалов","Укладка безбалластного мостового полотна"],"answer":"В","explanation":"Повторная укладка старогодных материалов - самая распространённая ресурсосберегающая технология на сети РЖД. Суть метода: отработавшие свойства рельсы и шпалы снимают с малодеятельных путей и укладывают на ветках с более интенсивным движением. Это позволяет значительно сэкономить на закупке новых материалов. По оценкам РЖД, повторная укладка экономит до 40% стоимости ремонта пути. Технология особенно востребована на подъездных путях промышленных предприятий, где нагрузка ниже, чем на магистралях. Ресурсосбережение на сети компании является приоритетом: стоимость ежегодных инвестиций в инфраструктуру исчисляется сотнями миллиардов рублей."},{"id":"R3_2_3","points":300,"question":"Как на БАМе называют машинистов-новичков?","options":["Чайник","Второгодник","Студент","Первозимник"],"answer":"Г","explanation":"«Первозимник» - так на БАМе называют машинистов-новичков, впервые отправляющихся на линию в зимний период. Вчерашние студенты и опытные машинисты из тёплых регионов приезжают на БАМ и учатся работать с автотормозами при низких температурах, когда морозы достигают минус 50 градусов. Зима на БАМе - суровое испытание: стекла замерзают, смазка густеет, металл становится хрупким. «Первозимник» должен научиться чувствовать поезд в экстремальных условиях. Программа стажировки длится несколько месяцев. БАМ длиной 5 600 км входит в состав Восточного полигона - одного из ключевых маршрутов грузового сообщения с Азией."},{"id":"R3_2_4","points":400,"question":"Когда в Москве появилась первая пригородная электричка?","options":["1905","1918","1946","1929"],"answer":"Г","explanation":"3 августа 1929 года по маршруту Москва - Мытищи впервые отправилась пригородная электричка. Это было революционное событие: электропоезд в два раза сократил время в пути по сравнению с паровым поездом. Маршрут Москва - Мытищи стал первым электрифицированным пригородным направлением в СССР. Инициатором проекта был нарком путей сообщения Лазарь Каганович. Электрификация пригородных линий позволила резко увеличить пропускную способность и обеспечить массовые перевозки работающих москвичей. Сегодня только по МЦД-1 перевозится 93,5 млн пассажиров в год."},{"id":"R3_2_5","points":500,"question":"Сколько вагонов в самом длинном грузовом составе СССР?","options":["250","380","510","440"],"answer":"Г","explanation":"В 1986 году на станции Экибастуз в Казахстане был сформирован рекордный грузовой состав из 440 вагонов. Общая длина состава составила 6,5 километра, а вес превышал 43 000 тонн. Поезд тянули несколько электровозов серии ВЛ80. Рекорд был установлен на Целинной железной дороге, в рамках эксперимента по увеличению веса поездов. Сегодня на Восточном полигоне РЖД работают составы массой до 7 100 тонн - это самые тяжёлые регулярные поезда в мире. В 2025 году грузооборот РЖД составил 3 075,3 млрд тонно-километров, а загрузка достигла 1 115,8 млн тонн грузов."},{"id":"R3_3_1","points":100,"question":"Какая профессия наиболее близка осмотрщику вагонов?","options":["Дирижёр","Музыкант","Стоматолог","Бухгалтер"],"answer":"Б","explanation":"Основной инструмент осмотрщика вагонов - молоток. По звуку удара молотком по деталям вагона осмотрщик определяет трещины, открутившиеся болты, деформации. Это точно так же, как музыкант определяет ноту по звуку удара. Осмотрщик стучит по колёсам, рамам, автосцепке и прислушивается. Глухой звук говорит о трещине, звонкий - о нормальном состоянии. Профессия требует идеального слуха и большого опыта. Осмотрщики проходят специальную аттестацию и ежегодно подтверждают квалификацию. По всей стране работают сотни осмотрщиков."},{"id":"R3_3_2","points":200,"question":"Как называется время прекращения движения поездов для работ на линии?","options":["Окно","Створ","Стойло","Ворота"],"answer":"А","explanation":"«Окно» - метафорическое название времени, когда движение поездов приостанавливается для проведения ремонтных и строительных работ на линии. За это время бригады ремонтируют рельсы, шпалы, мосты, тоннели, контактные сети. «Окно» планируется заранее и может длиться от нескольких минут до нескольких часов. Чем больше «окно», тем масштабнее работы. На загруженных магистралях «окна» дают ночью, когда движение минимально. Понятие «окно» широко используется и в IT - как время, свободное от процессов. За «окна» по всей стране проводятся масштабные работы по обслуживанию инфраструктуры."},{"id":"R3_3_3","points":300,"question":"Кто является руководителем движения на перегоне?","options":["Дежурный по станции","Поездной диспетчер","Начальник участка","Начальник станции"],"answer":"Б","explanation":"Поездной диспетчер - руководитель движения поездов на перегоне или группе перегонов. Он отвечает за соблюдение графика, организует движение, обеспечивает безопасность. Диспетчер видит каждый поезд на экране, положение стрелок, показания светофоров. Он принимает решение о направлении поездов на обгон, встречу, пропуск. В случае задержки поезда диспетчер корректирует график и уведомляет все станции. Поездной диспетчер работает круглосуточно в диспетчерском центре, имея полную картину обстановки на участке."},{"id":"R3_3_4","points":400,"question":"Кто в 2007 году был принят на должность смотрителя станции Киши в Японии?","options":["Пенсионер","Школьник","Кошка","Собака"],"answer":"В","explanation":"Кошка Тама была назначена смотрителем станции Киши в японском городе Кинокава в 2007 году, когда станцию грозило закрытие из-за убытков. Тама стала символом станции: тысячи туристов приезжали фотографировать пушистую «смотрительницу». Благодаря Таме доходы станции выросли в несколько раз, а кошка была повышена до директора станции. Тама работала в специальной шляпе-форме и даже имела собственный кабинет. После её смерти в 2015 году пост смотрителя заняла её преемница - кошка Нитама. В России железнодорожные станции тоже могут быть необычными: 26 детских железных дорог воспитывают будущих железнодорожников."},{"id":"R3_3_5","points":500,"question":"Кто на железной дороге отвечает за безопасность движения поездов и принимает решение о пропуске состава?","options":["Диспетчер","Дежурный по станции","Монтер пути","Строитель"],"answer":"А","explanation":"Поездной диспетчер - специалист, который ведёт поезд по графику движения и отвечает за безопасность движения на участке. Он регулирует интервалы между поездами, снимает и даёт разрешение на проезд, перекрывает неисправные участки и организует движение при нештатных ситуациях. Контроль за движением ведёт Центральная дирекция управления движением - круглосуточный центр, работающий в режиме 24/7. Круглосуточную вахту несут и диспетчеры районных центров, отвечающие за конкретные участки сети. Именно благодаря их работе обеспечиваются точность движения пассажирских поездов и безопасность грузового движения - показатели, по которым РЖД входит в число мировых лидеров отрасли."},{"id":"R3_4_1","points":100,"question":"Какой билет покупали пассажиры первой железной дороги в России?","options":["Бумажный","Картонный","Медный","Латунный"],"answer":"Г","explanation":"На первой российской железной дороге Санкт-Петербург - Царское Село, открытой в 1837 году, билеты были латунными жетонами. На каждом жетоне выдавливалась информация: название станции, время отправления, номер кареты. Пассажиры сдавали жетон кондуктору при входе в вагон. Латунные жетоны были прочными и удобными - их невозможно было порвать или смазать. Музей железных дорог России хранит экземпляры таких жетонов. Позже билеты стали бумагными, но традиция жетонов сохранилась в московском метрополитене. Сегодня каждый пассажир получает электронный билет - от латунных жетонов прошло почти 190 лет."},{"id":"R3_4_2","points":200,"question":"В каком виде спорта РЖД помогает устанавливать рекорды?","options":["Силовой экстрим","Скалолазание","Трейлраннинг","Бейсджампинг"],"answer":"А","explanation":"РЖД является генеральным спонсором силового экстрима - вида спорта, где атлеты голыми руками сдвигают с места тяжёлые объекты. Богатыри сдвигали электровозы, электрички и целые поезда. Рекорды устанавливаются в нескольких категориях: сдвинуть локомотив на максимальное расстояние, за минимальное время, с наибольшим количеством пассажиров. Соревнования проводятся на крупных железнодорожных станциях и привлекают тысячи зрителей. Спортсмены тренируются годами, чтобы развить достаточную силу для работы с составами массой в сотни тонн. РЖД поддерживает этот вид спорта, демонстрируя мощь и надёжность железнодорожного транспорта."},{"id":"R3_4_3","points":300,"question":"У вокзала какого города стоит скульптура человека на дрезине?","options":["Йошкар-Ола","Сыктывкар","Екатеринбург","Новосибирск"],"answer":"А","explanation":"У вокзала города Йошкар-Ола стоит скульптура Мустафы - героя фильма «Путевка в жизнь» 1931 года. В фильме молодой татарин Мустафа строит железную дорогу и ценой своей жизни предотвращает крушение поезда. Скульптура изображает его на дрезине - ручном железнодорожном транспорте. Фильм стал классикой советского кинематографа, а история Мустафы - симвом самоотверженности железнодорожников. Памятник стал одной из достопримечательностей города и обязательным местом для фотографий туристов. Железнодорожная тематика глубоко укоренена в российской культуре: детские железные дороги в разных городах продолжают традицию воспитания будущих железнодорожников."},{"id":"R3_4_4","points":400,"question":"Название какой железнодорожной станции придумали строители Мурманской магистрали?","options":["Полярные Зори","Африканда","Выходной","Лапландия"],"answer":"Б","explanation":"Станция Африканда на Мурманской магистрали получила своё имя в 1934 году благодаря иронии строителей. Образована она была в 1930 году как разъезд № 1. Магистраль строилась в условиях суровой арктической зимы, когда температура опускалась ниже минус 50 градусов. Рабочие шутили, что им так жарко, что они будто в Африке. Отсюда и пошло название - Африканда. Мурманская магистраль - одна из самых сложных в строительстве: она проходит через вечную мерзлоту, болота и тундру. Станция Африканда расположена на участке Пинозеро - Кола, в 230 км от Мурманска, вблизи Полярных Зорь. Магистраль является частью сети компании, связывающей крайние регионы страны."},{"id":"R3_4_5","points":500,"question":"Какое сооружение защищает горный железнодорожный путь от камнепадов и селевых потоков?","options":["Галерея","Виадук","Эстакада","Путепровод"],"answer":"А","explanation":"Галерея - искусственное сооружение, которое устраивают в горном склоне для защиты железнодорожного пути от осыпей, камнепадов и селевых потоков. Она принимает на себя удар селевого потока и служит надёжным укрытием для полотна. Рядом с ней нередко сооружают подпорные стенки и водопропускные трубы, отводящие воду. Выбор между галереей, тоннелем, виадуком, эстакадой и путепроводом определяется геологией склона и экономикой проекта: в горах тоннель или галерея часто дешевле глубокой выемки и длинного обходного пути. Цифровые модели РЖД позволяют заранее оценить риск для каждого сооружения."}]},{"name":"Раунд 4 — Будущее","categories":["Взгляд за горизонт","Локомотивы углублённо","Управление углублённо","Технологии будущего"],"questions":[{"question":"Как называется концепция полной цифровой копии транспортного процесса, способной в реальном времени просчитывать последствия любых изменений в сети?","options":["Цифровой двойник","Алгоритм автономного управления","Система предиктивного анализа","Модель цифровой логистики"],"answer":"А","explanation":"Цифровой двойник - это полная виртуальная копия транспортного процесса, воспроизводящая ключевые параметры реальной инфраструктуры: рельсовый путь, подвижной состав, системы сигнализации, пассажиропотоки и грузовые потоки. В таком «двойнике» можно смоделировать ремонт отдельного участка или запуск нового маршрута и заранее увидеть последствия. К 2025 году в компании работают более 30 промышленных решений на базе цифровых двойников, охватывающих ключевые бизнес-процессы, а полноценный двойник транспортного процесса отнесён к третьему горизонту стратегии и рассчитан на период 2041–2050 годов. Технологической основой служит платформа «Цифровая среда», интеграция данных АСУ ТП, интернет вещей и методы искусственного интеллекта.","id":"R4_1_1","points":100},{"question":"Какие три горизонта технологического развития выделены в стратегии ОАО «РЖД»?","options":["Автоматизация — цифровое пространство — цифровой двойник","Цифровизация — роботизация — автономность","Развитие ИИ — квантовые вычисления — сингулярность","Модернизация — инновации — трансформация"],"answer":"А","explanation":"Стратегия разбивает развитие на три последовательных горизонта. Первый - до 2030 года - это автоматизированное управление перевозочным процессом: ВСМ, мультимодальные транспортно-логистические хабы, BIM-технологии. Второй, 2031–2040 годы, - единое цифровое транспортное пространство с платформенной интеграцией, высокоскоростным подвижным составом свыше 320 км/ч и автономным управлением. Третий, 2041–2050 годы, - цифровой двойник перевозочного процесса, новые транспортные системы с использованием магнитной левитации и цифровые двойники подвижного состава. Такая структура позволяет заранее связывать конкретные технологии с горизонтами инфраструктурных изменений.","id":"R4_1_2","points":200},{"question":"Какую максимальную скорость будет развивать первая российская высокоскоростная магистраль Москва — Санкт-Петербург?","options":["Более 250 км/ч","Более 300 км/ч","Более 320 км/ч","Более 350 км/ч"],"answer":"В","explanation":"Первая российская высокоскоростная магистраль Москва — Санкт-Петербург рассчитана на эксплуатацию со скоростью более 320 километров в час. Это делает её одной из самых быстрых действующих железных дорог мира и первым в России проектом высокоскоростного сообщения между двумя крупнейшими агломерациями. Линия потребует принципиально нового пути, контактной сети и системы сигнализации, рассчитанных на скорость, недостижимую для обычной сети. Для пассажиров предусмотрены вагоны с схемой 8+8, четырьмя классами обслуживания и комфортом городского скоростного поезда. Разработкой занимаются более 500 инженеров и 150 российских компаний.","id":"R4_1_3","points":300},{"question":"Какая российская компания разрабатывает первый высокоскоростный поезд для ВСМ?","options":["«Уральские локомотивы»","«Трансмашхолдинг»","«Балаковский вагоностроительный завод»","«Окская скоростная компания»"],"answer":"А","explanation":"Первый российский высокоскоростный поезд для линии Москва — Санкт-Петербург разрабатывает завод «Уральские локомотивов». В проекте участвуют более 500 инженеров и 150 российских компаний. Сам поезд будет состоять из 8 вагонов и рассчитан на 452 пассажира: компоновка по схеме «8+8» рассчитана на скоростной режим и обеспечивает устойчивость состава. Предусмотрены четыре класса обслуживания, что позволит одновременно перевозить пассажиров с разными потребностями - от деловых поездок до туризма. Магистраль будет эксплуатироваться со скоростью более 320 километров в час, а создание для неё инфраструктуры и подвижного состава потребует принципиально новых технических решений.","id":"R4_1_4","points":400},{"question":"Какие альтернативные источники энергии рассматриваются в стратегии РЖД для подвижного состава?","options":["Солнечные батареи и ветрогенераторы","Геотермальная энергия и приливы","Водород, аккумуляторы и гибриды","Пьезоэлектрики и суперконденсаторы"],"answer":"В","explanation":"В стратегии развития РЖД в качестве альтернативных источников энергии для подвижного состава рассматриваются три основных направления: водородные технологии, аккумуляторные батареи и гибридные установки. Водородный подвижной состав уже прорабатывается для эксплуатации на Сахалине - там, где электрификация линий пока нецелесообразна. Переход на новые источники энергии напрямую связан с целями компании по снижению воздействия на окружающую среду: РЖД входит в число мировых лидеров по экологичности грузовых перевозок. Развитие альтернативной тяги сопровождается совершенствованием тягового подвижного состава, интеллектуальными системами мониторинга ресурса и цифровыми двойниками.","id":"R4_1_5","points":500},{"question":"Что означает буквенное обозначение «ВЛ» в маркировке электровозов серии ВЛ80?","options":["Высоковольтный локомотив","Владимир Ленин","Всесоюзный локомотив","Высокоскоростной локомотив"],"answer":"Б","explanation":"Буквенное обозначение «ВЛ» расшифровывается как «Владимир Ленин». Эта традиция именования серий локомотивов пошла с советского времени, когда многие серии получали имена в честь политических и государственных деятелей. ВЛ80 - одна из самых массовых серий грузовых электровозов в парке компании, она работает на постоянном токе и используется на самых напряжённых направлениях, включая Восточный полигон. Поскольку тяговый парк постоянно обновляется, классические серии ВЛ постепенно вытесняются более экономичными и мощными новичками, однако они остаются рабочей лошадкой на участках, где не требуется двойное питание.","id":"R4_2_1","points":100},{"question":"Какой тип тяги характерен для маневровых тепловозов серии ТЭМ?","options":["Электрическая тяга от контактной сети","Тепловозная тяга с гидравлической передачей","Дизельная тяга с механической передачей","Дизельная тяга с электрической передачей"],"answer":"Г","explanation":"Локомотивы серии ТЭМ относятся к классу маневровых тепловозов и используют дизельную тягу с электрической передачей. Дизельный двигатель приводит в действие генератор, а уже он питает тяговые электродвигатели. Такая схема даёт плавное регулирование тяги и позволяет маневровому составу точно перемещать тяжёлые вагоны на коротких расстояниях - на сортировочных станциях, в депо и на подъездных путях промышленных предприятий. Электрическая передача вместо механической повышает общую надёжность и упрощает обслуживание. ТЭМы не требуют контактной сети, поэтому их можно использовать там, где электрификация отсутствует или нецелесообразна.","id":"R4_2_2","points":200},{"question":"Как называется система, позволяющая управлять несколькими локомотивами из одной кабины машиниста?","options":["Система дистанционного управления","Автоматизированная система управления","Система множественных единиц","Система параллельного вождения"],"answer":"В","explanation":"Система множественных единиц (СМЕ) объединяет несколько локомотивов в единый тяговый комплекс, которым управляют из одной кабины машиниста. Она применяется на тяжёлых составах, где одного локомотива недостаточно, и на маневровых работах, где нужно точно следовать за составом. Приборы СМЕ в кабине первого локомотива позволяют видеть показания приборов второго и управлять им, а тормоза работают как единая система. Контроллеры мощности при этом согласуются автоматически: тяга распределяется между локомотивами пропорционально их состоянию. СМЕ позволяет сократить число экипажей на тяжёлых поездах и повысить гибкость использования парка.","id":"R4_2_3","points":300},{"question":"Какой вид ремонта локомотива выполняется при пробеге 1 800 тысяч километров?","options":["Текущий ремонт","Средний ремонт","Капитальный ремонт","Периодический ремонт"],"answer":"Б","explanation":"Средний ремонт (СР) выполняется при достижении локомотивом пробега 1 800 тысяч километров. Это промежуточный вид технического обслуживания между текущим ремонтом (ТР) и капитальным ремонтом (КР), направленный на замену изношенных узлов и восстановление основных технических характеристик машины. В ходе среднего ремонта проводят полную разборку основных агрегатов: дизельного двигателя для тепловозов, тяговых электродвигателей, вспомогательных машин, тормозного оборудования и системы управления. После дефектации деталей изношенные элементы заменяют или восстанавливают. Ремонтные заводы РЖД выполняют также и капитальный ремонт, после которого локомотив получает новый ресурс до следующего цикла.","id":"R4_2_4","points":400},{"question":"Что такое аддитивное производство в контексте железнодорожного транспорта?","options":["Метод изготовления композитных материалов для вагонов","Технология 3D-печати деталей прямо в депо","Система автоматической сборки вагонов на конвейере","Процесс нанесения защитных покрытий на рельсы"],"answer":"Б","explanation":"Аддитивное производство - это изготовление деталей методом послойного наращивания материала, то есть 3D-печать. В железнодорожной отрасли технология позволяет печатать запасные части прямо в депо, без доставки с завода и длительного хранения на складе. Это особенно выгодно для редких и нестандартных деталей, которые в традиционной схеме производятся малыми партиями или восстанавливаются вручную. Аддитивные технологии экономят время простоя подвижного состава и сокращают складские запасы. Направление входит в число приоритетов стратегии развития холдинга до 2050 года наряду с интеллектуальными системами мониторинга ресурса и цифровыми двойниками.","id":"R4_2_5","points":500},{"question":"Как называется график движения поездов, который является основным планом работы всей сети?","options":["Суточный график движения","Эксплуатационный план сети","Технический график движения","График движения поездов"],"answer":"Г","explanation":"График движения поездов (ГДП) - это поездной распорядок всей сети, в котором для каждого поезда заданы нитки движения по времени. ГДП увязывает работу локомотивов, бригад и станций и является главным документом, по которому работает вся железнодорожная сеть. Каждый поезд на графике - это «нитка», показывающая время отправления, прибытия и проследования каждого раздельного пункта. График строится так, чтобы пропускная способность и скорость движения были сбалансированы. Это не просто расписание: ГДП - результат сложнейшей оптимизационной задачи, в которой учитываются возможности инфраструктуры, мощность тяги, потребности грузоотправителей и пассажиров, а также ресурс подвижного состава.","id":"R4_3_1","points":100},{"question":"Какой уровень управления отвечает за сетевое планирование перевозок?","options":["ДС — линейный уровень, отвечает за станцию","Д — дорожный уровень, отвечает за одну дорогу","П — полигонный уровень, отвечает за смежные дороги","ЦД — сетевой уровень, отвечает за всю сеть"],"answer":"Г","explanation":"Центральная дирекция управления движением (ЦД) - это сетевой уровень управления перевозками. Здесь принимаются решения, которые касаются работы всей сети компании, а не отдельного участка или дороги. Уровни управления распределены иерархически: ДС (станция) решает задачи по расстановке поездов на путях, Д (дорога) координирует движение в пределах одной железной дороги, П (полигон) управляет смежными дорогами, а ЦД отвечает за весь масштаб сети. Текущее планирование ведётся в трёхчасовых периодах с прогнозом на шесть часов, сменно-суточное планирование охватывает двенадцатичасовые периоды.","id":"R4_3_2","points":200},{"question":"Что такое оборот вагона и почему это ключевой показатель эффективности грузовых перевозок?","options":["Время, за которое вагон проходит один круг по маршруту","Количество вагонов, прошедших через станцию за сутки","Время полного цикла от погрузки до следующей погрузки","Стоимость содержания одного вагона в год"],"answer":"В","explanation":"Оборот вагона - это время полного цикла от погрузки до следующей погрузки. Это базовый показатель эффективности грузовых перевозок: чем короче оборот, тем больше груза может перевезти один вагон за единицу времени, а значит, тем меньше вагонов нужно парку для того же объёма перевозок. Поэтому снижение оборота напрямую влияет на потребность в вагонном парке и на себестоимость перевозки. Показатель зависит от целого ряда факторов: времени в пути, простоев на промежуточных станциях, скорости обработки на погрузочных площадках и от того, насколько равномерно распределён грузопоток по направлениям.","id":"R4_3_3","points":300},{"question":"Какие показатели определяют качество работы грузового железнодорожного транспорта?","options":["Только средняя скорость поезда","Скорость, пробег и производительность","Количество поездов, отправленных со станции за сутки","Только стоимость перевозки тонны"],"answer":"Б","explanation":"Качество работы грузового транспорта определяется комплексом показателей: оборот вагона, участковая и техническая скорость, рейс вагона, среднесуточный пробег, производительность вагона и локомотива, коэффициент порожнего пробега. Участковая скорость - средняя скорость поезда на участке с учётом остановок, техническая - средняя скорость без учёта стоянок. Разница между ними показывает, сколько времени поезд теряет на ожиданиях. Комплексная оценка позволяет видеть, где именно в цепочке «грузоотправитель - станция - тяга - путь» накапливается потеря времени, и направлять усилия на устранение именно этого узкого места.","id":"R4_3_4","points":400},{"question":"Какой уровень управления отвечает за координацию движения поездов в пределах одной железной дороги?","options":["Д — дорожный уровень","ДС — станционный уровень","П — полигонный уровень","ЦД — сетевой уровень"],"answer":"А","explanation":"Дорожный уровень (Д) отвечает за координацию движения поездов в пределах одной железной дороги. Выше него стоит полигонный уровень (П), управляющий смежными дорогами, а на вершине иерархии - Центральная дирекция управления движением (ЦД), отвечающая за всю сеть. Ниже дорожного уровня работает станционный уровень (ДС), который решает задачи по расстановке поездов на путях в пределах станции. Такая трёхступенчатая структура позволяет принимать решения на том уровне, где есть вся необходимая информация: от пути до сети. Дорожный уровень связывает станции в единый рабочий ритм и отвечает за выполнение графика движения поездов в границах дороги.","id":"R4_3_5","points":500},{"question":"Что означает уровень автоматизации УА4 в беспилотном вежении поездов?","options":["Полностью автоматическое движение без машиниста","Движение с машинистом в кабине и автоматикой в движении","Автоматизация только маневровой работы","Полностью ручное управление с телематическим контролем"],"answer":"Б","explanation":"Уровень УА4 означает автоматизацию движения поезда при сохранении машиниста в кабине: система сама ведёт состав по маршруту, соблюдает сигналы, останавливается на станциях, но человек остаётся в кабине и контролирует процесс. Беспилотные электропоезда такого уровня уже работают на Московском центральном кольце, где используются компьютерное зрение и лидары. Полностью безлюдные технологии (УА5) пока остаются предметом испытаний: переход к ним требует дополнительной проработки вопросов безопасности и нормативного регулирования. Снижение роли человеческого фактора - одна из ключевых задач стратегии развития компании.","id":"R4_4_1","points":100},{"question":"Что предусматривает роботизация технического обслуживания и ремонта инфраструктуры?","options":["Полный отказ от обслуживания людьми","Перенос всей отрасли в виртуальную реальность","Роботизированные системы типовых операций","Замена пути сортировочными устройствами"],"answer":"В","explanation":"Роботизированные системы технического обслуживания и ремонта берут на себя выполнение типовых и опасных операций: диагностику пути, геодезические работы, замену элементов и инспекцию сооружений. Человек при этом остаётся в контуре управления, но избавлен от работы в опасных условиях. Направление входит в число приоритетов будущего развития инфраструктурного комплекса РЖД до 2050 года. Развитие роботизации тесно связано с цифровыми двойниками инфраструктуры и BIM-технологиями проектирования: цифровая мель позволяет заранее знать, какие работы нужны конкретному объекту и с какой точностью. Это снижает долю аварийных вмешательств и продлевает срок службы сооружений.","id":"R4_4_2","points":200},{"question":"Какие пути рассматриваются как перспективные для железнодорожной инфраструктуры будущего?","options":["Только безбалластный путь на бетонных плитах","Стальные трубы вместо рельсов на скоростных линиях","Только деревянные шпалы с усиленной пропускной способностью","Безбалластный путь, композиты и «умные» материалы"],"answer":"Г","explanation":"Перспективным направлением считается безбалластный путь, а также применение композитов, керамики и «умных» материалов с самовосстановлением. Безбалластный путь устраняет балластный слой, а значит и целый класс работ по его подсыпке и очистке, повышая при этом ремонтную технологичность и точность геометрии. Композитные материалы позволяют снизить массу конструкций и продлить их ресурс, а «умные» материалы способны частично восстанавливать повреждения. Вместе с этим развивается мониторинг всех объектов в реальном времени и обязательные цифровые двойники при проектировании.","id":"R4_4_3","points":300},{"question":"Какие транспортные системы рассматриваются как перспектива развития на горизонте 2041–2050 годов?","options":["Магнитная левитация и вакуумные трубы","Конные повозки и паровые тракты","Подводные тоннели и канатные дороги","Гидравлические лифты и пневматическая почта"],"answer":"А","explanation":"На третьем горизонте стратегии, в период 2041–2050 годов, в числе перспективных транспортных систем названы магнитолевитационные и вакуумно-левитационные. Маглев исключает контакт между составом и путевой структурой, а вакуумный поезд движется в трубе с разреженным воздухом. Обе технологии обещают принципиально иную скорость и энергоэффективность, но требуют полностью новой инфраструктуры и потому относятся к самому дальнему горизонту. Развитие этого направления связано с цифровыми двойниками подвижного состава, которые позволят моделировать поведение новых систем до их создания.","id":"R4_4_4","points":400},{"question":"Какая плановая нагрузка на ось рассматривается для перспективного тяжеловесного подвижного состава?","options":["Свыше 45 тонн на ось","Свыше 21 тонну на ось","Свыше 35 тонн на ось","Свыше 27 тонн на ось"],"answer":"Г","explanation":"Развитие тяжеловесного подвижного состава с нагрузкой на ось свыше 27 тонн названо одним из приоритетов будущего подвижного состава РЖД. Сегодня средняя нагрузка на ось у перевозимых тяжеловесных составов ниже этого порога, и выход на новый уровень потребует усиления пути, мостов и переходов, а также пересмотра нормативов. При этом эффект масштабный: чем выше масса поезда, тем меньше рейсов нужно для перевозки того же объёма груза, а значит, ниже нагрузка на инфраструктуру в пересчёте на тонну продукции. Работа ведётся в связке с развитием цифровых двойников пути и роботизации обслуживания.","id":"R4_4_5","points":500}]}];
