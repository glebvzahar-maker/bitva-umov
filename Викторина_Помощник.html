<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Викторина — Битва умов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17;--card:#141a2a;--gold:#d4a843;--gold2:#f0d68a;
  --text:#e8ecf2;--muted:#6b7a94;--green:#3ecf7a;--red:#e05555;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(20,26,42,.95);border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;z-index:10;}
.header h1{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold);}
.header .score-toggle{background:var(--gold);color:var(--bg);border:none;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.header .score-toggle:active{transform:scale(.95);}

.screen{display:none;flex:1;overflow-y:auto;flex-direction:column;}
.screen.active{display:flex;}

.lock-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:30px 16px;gap:16px;}
.lock-screen.active{display:flex;}
.lock-icon{font-size:48px;margin-bottom:8px;}
.lock-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);text-align:center;}
.lock-sub{font-size:13px;color:var(--muted);text-align:center;max-width:300px;}
.lock-input-wrap{display:flex;align-items:center;gap:8px;width:100%;max-width:300px;}
.lock-input{flex:1;background:var(--card);border:1px solid rgba(212,168,67,.3);border-radius:8px;color:var(--text);font-size:18px;font-weight:600;padding:12px 16px;text-align:center;font-family:'Inter',sans-serif;letter-spacing:4px;outline:none;}
.lock-input:focus{border-color:var(--gold);}
.lock-btn{background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.lock-btn:active{transform:scale(.96);}
.lock-error{font-size:13px;color:var(--red);text-align:center;min-height:20px;}

.rounds-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 16px;max-width:600px;margin:0 auto;width:100%;}
.round-card{background:var(--card);border:1px solid rgba(212,168,67,.2);border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.round-card:active{transform:scale(.97);}
.round-card .num{font-family:'Playfair Display',serif;font-size:56px;font-weight:900;color:var(--gold);line-height:1;}
.round-card .label{font-size:18px;font-weight:700;margin-top:8px;}
.round-card .sub{font-size:13px;color:var(--muted);margin-top:6px;}
.round-card .progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.05);}
.round-card .progress-fill{height:100%;background:var(--gold);transition:width .3s;width:0%;}

.board-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-shrink:0;}
.board-header .back-btn{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:4px 8px;}
.board-header h2{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);text-align:center;}

.board-grid{display:grid;grid-template-columns:1.8fr repeat(5,1fr);gap:5px;padding:8px 12px;flex:1;align-content:stretch;}
.team-row-label{background:var(--gold);color:var(--bg);border-radius:6px;padding:8px 6px;text-align:center;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px;}
.team-cell{background:linear-gradient(135deg,#1a2240,#162038);border:2px solid rgba(212,168,67,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--muted);cursor:pointer;transition:all .25s;min-height:44px;user-select:none;}
.team-cell:active{transform:scale(.93);}
.team-cell.active{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.12);box-shadow:0 0 12px rgba(212,168,67,.25);}
.q-cell.no-team{opacity:.45;cursor:not-allowed;}
.cat-label{background:var(--card);border:1px solid rgba(212,168,67,.2);border-radius:6px;padding:10px 8px;text-align:center;font-size:15px;font-weight:700;color:var(--gold);display:flex;align-items:center;justify-content:center;line-height:1.3;}
.q-cell{background:linear-gradient(135deg,#1a2240,#162038);border:1px solid rgba(212,168,67,.18);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--gold2);cursor:pointer;transition:all .25s;min-height:54px;position:relative;}
.q-cell:active{transform:scale(.93);}
.q-cell.used{background:rgba(20,26,42,.4);border-color:rgba(80,80,80,.2);color:rgba(80,80,80,.35);cursor:default;pointer-events:none;text-decoration:line-through;}
.q-cell.used::after{content:"";position:absolute;inset:0;background:rgba(10,14,23,.6);border-radius:6px;}

.team-select-grid{display:flex;flex-direction:column;gap:10px;padding:20px 16px;max-width:600px;margin:0 auto;width:100%;}
.team-card{background:var(--card);border:1px solid rgba(212,168,67,.2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;}
.team-card:active{transform:scale(.97);border-color:var(--gold);}
.team-card .team-card-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.team-card .team-card-score{font-size:13px;color:var(--muted);}

.question-screen{display:none;flex-direction:column;height:100dvh;position:relative;}
.question-screen.active{display:flex;}
.q-top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(20,26,42,.95);border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;}
.q-top-bar .back-btn{background:none;border:none;color:var(--gold);font-size:20px;cursor:pointer;}
.q-top-bar .q-badge{background:var(--gold);color:var(--bg);font-weight:700;padding:4px 12px;border-radius:16px;font-size:11px;}
.q-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px;display:flex;flex-direction:column;gap:14px;}
.q-text{font-size:16px;font-weight:600;line-height:1.5;background:var(--card);border-radius:10px;padding:16px;border-left:3px solid var(--gold);}
.q-options{display:flex;flex-direction:column;gap:8px;}
.q-option{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.4;transition:all .3s;}
.q-option.correct{border-color:var(--green);background:rgba(62,207,122,.08);}
.q-option .letter{display:inline-block;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.07);text-align:center;line-height:22px;font-weight:700;font-size:12px;margin-right:8px;}
.q-option.correct .letter{background:var(--green);color:var(--bg);}
.q-answer-label{font-size:13px;font-weight:700;color:var(--green);padding:10px 14px;background:rgba(62,207,122,.06);border-radius:8px;text-align:center;}
.q-explanation{background:var(--card);border-radius:10px;padding:14px;font-size:13px;line-height:1.7;color:var(--muted);border:1px solid rgba(255,255,255,.04);}
.q-explanation p{margin-bottom:8px;}
.q-explanation strong{color:var(--text);}

.q-actions{display:flex;gap:12px;padding:14px 16px;flex-shrink:0;background:rgba(20,26,42,.98);border-top:1px solid rgba(212,168,67,.2);position:absolute;bottom:0;left:0;right:0;z-index:10;}
.q-action-btn{flex:1;padding:20px 10px;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;}
.q-action-btn:active{transform:scale(.96);}
.q-action-btn.accept{background:var(--green);color:var(--bg);}
.q-action-btn.reject{background:var(--red);color:#fff;}

.scoreboard{display:none;flex-direction:column;position:fixed;inset:0;z-index:100;background:rgba(10,14,23,.97);}
.scoreboard.open{display:flex;}
.score-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;}
.score-header h2{font-family:'Playfair Display',serif;color:var(--gold);font-size:18px;}
.score-header .close-btn{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;}
.score-teams{display:flex;flex-direction:column;gap:10px;padding:16px;flex:1;overflow-y:auto;}
.score-team{background:var(--card);border-radius:10px;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.team-position{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--gold);width:50px;text-align:center;flex-shrink:0;}
.team-name{font-weight:700;font-size:14px;width:90px;flex-shrink:0;color:var(--gold);}
.team-score{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;width:70px;text-align:center;flex-shrink:0;}
.team-history{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.history-plaque{display:inline-block;padding:3px 6px;border-radius:4px;font-size:9px;font-weight:600;line-height:1;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:all .2s;}
.history-plaque:active{transform:scale(.92);}
.history-plaque.correct{background:rgba(62,207,122,.15);color:var(--green);}
.history-plaque.incorrect{background:rgba(224,85,85,.15);color:var(--red);}

.setup-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:30px 16px;gap:16px;}
.setup-screen.active{display:flex;}
.setup-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);text-align:center;margin-bottom:10px;}
.setup-team{display:flex;align-items:center;gap:10px;width:100%;max-width:400px;background:var(--card);border-radius:10px;padding:12px 16px;}
.setup-team .num{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--gold);width:30px;text-align:center;flex-shrink:0;}
.setup-team input{flex:1;background:none;border:none;border-bottom:1px solid rgba(212,168,67,.3);color:var(--text);font-size:15px;font-weight:600;padding:6px 0;font-family:'Inter',sans-serif;outline:none;}
.setup-team input:focus{border-bottom-color:var(--gold);}
.setup-team input::placeholder{color:var(--muted);font-weight:400;}
.setup-start-btn{margin-top:16px;background:var(--gold);color:var(--bg);border:none;border-radius:10px;padding:14px 40px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;}
.setup-start-btn:active{transform:scale(.96);}

.review-overlay{display:none;flex-direction:column;position:fixed;inset:0;z-index:200;background:rgba(10,14,23,.98);overflow-y:auto;}
.review-overlay.open{display:flex;}
.review-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;}
.review-header h2{font-family:'Playfair Display',serif;color:var(--gold);font-size:16px;}
.review-header .close-btn{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;}
.review-body{padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
.review-badge{background:var(--gold);color:var(--bg);font-weight:700;padding:4px 12px;border-radius:16px;font-size:11px;align-self:flex-start;}
.review-team{font-size:14px;color:var(--muted);font-weight:600;}
.review-result{font-size:14px;font-weight:700;padding:6px 12px;border-radius:6px;align-self:flex-start;}
.review-result.correct{background:rgba(62,207,122,.12);color:var(--green);}
.review-result.incorrect{background:rgba(224,85,85,.12);color:var(--red);}
.review-q{font-size:16px;font-weight:600;line-height:1.5;background:var(--card);border-radius:10px;padding:16px;border-left:3px solid var(--gold);}
.review-options{display:flex;flex-direction:column;gap:6px;}
.review-option{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.4;}
.review-option.correct{border-color:var(--green);background:rgba(62,207,122,.08);}
.review-answer{font-size:13px;font-weight:700;color:var(--green);padding:8px 14px;background:rgba(62,207,122,.06);border-radius:8px;text-align:center;}
.review-expl{background:var(--card);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;color:var(--muted);border:1px solid rgba(255,255,255,.04);}
.review-expl p{margin-bottom:8px;}
.review-expl strong{color:var(--text);}

@media(max-width:600px){
  .rounds-grid{grid-template-columns:1fr;gap:14px;padding:16px 12px;}
  .round-card{padding:36px 16px;}
  .round-card .num{font-size:64px;}
  .round-card .label{font-size:20px;}
  .round-card .sub{font-size:14px;}
}
@media(min-width:768px){
  .board-grid{gap:6px;padding:12px 20px;}
  .q-cell{font-size:24px;min-height:60px;}
  .cat-label{font-size:16px;}
  .q-text{font-size:18px;}
  .q-explanation{font-size:14px;}
  .team-card{padding:28px;}
  .team-card .team-card-name{font-size:24px;}
}
</style>
</head>
<body>
<div class="header" id="app-header" style="display:none"><h1>Битва умов</h1><button class="score-toggle" onclick="toggleScore()">Результат Викторины</button></div>

<div class="lock-screen active" id="screen-lock">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">Битва умов</div>
  <div class="lock-sub">Введите пароль для доступа к викторине</div>
  <div class="lock-input-wrap">
    <input type="password" class="lock-input" id="lock-password" maxlength="10" placeholder="····" inputmode="numeric">
    <button class="lock-btn" onclick="checkPassword()">→</button>
  </div>
  <div class="lock-error" id="lock-error"></div>
</div>

<div class="setup-screen" id="screen-setup">
  <div class="setup-title">Назовите команды</div>
  <div id="setup-teams"></div>
  <button class="setup-start-btn" onclick="finishSetup()">Начать игру</button>
</div>

<div class="screen" id="screen-rounds"><div class="rounds-grid" id="rounds-grid"></div></div>
<div class="screen" id="screen-board"><div class="board-header"><button class="back-btn" onclick="goToRounds()">←</button><h2 id="board-title"></h2><div></div></div><div class="board-grid" id="board-grid"></div></div>
<div class="screen" id="screen-team-select"><div class="board-header"><button class="back-btn" onclick="goToBoard()">←</button><h2>Какая команда отвечает?</h2><div></div></div><div class="team-select-grid" id="team-select-grid"></div></div>
<div class="question-screen" id="screen-question"><div class="q-top-bar"><button class="back-btn" onclick="goToBoard()">←</button><div class="q-badge" id="q-badge"></div><div></div></div><div class="q-body" id="q-body"></div><div class="q-actions" id="q-actions"></div></div>
<div class="scoreboard" id="scoreboard"><div class="score-header"><h2>Результат Викторины</h2><button class="close-btn" onclick="toggleScore()">×</button></div><div class="score-teams" id="score-teams"></div></div>
<div class="review-overlay" id="review-overlay"><div class="review-header"><h2>Просмотр вопроса</h2><button class="close-btn" onclick="closeReview()">×</button></div><div class="review-body" id="review-body"></div></div>

<script>
const ROUNDS = [{"name":"Раунд 1","categories":["Инфраструктурный комплекс","Подвижной состав","Управление движением","Интересное"],"questions":[{"id":"1.1","points":100,"question":"Какой железнодорожный тоннель считается самым длинным в России?","options":["А) Байкальский","Б) Кузнецовский","В) Северомуйский","Г) Манский"],"answer":"В) Северомуйский**","explanation":"Северомуйский тоннель - самый длинный в России (15 343 м), расположен на БАМе в Бурятии. До его открытия в 2014 году тяжеловесные составы расцепляли и отправляли по крутому обходному пути. Строительство длилось 37 лет - с 1977 по 2014 год, строители столкнулись с 4 тектоническими разломами и горячими источниками температурой до 60 градусов. БАМ является ключевым звеном Восточного полигона РЖД, грузооборот которого в 2025 году составил 3 075,3 млрд тонно-километров, а средняя скорость поездов достигла рекордных 494,5 км/сутки (+21,9% к 2024 году). В 2024 году БАМ отметил своё 40-летие, а при его строительстве в один день укладывали рекордные 8,1 км пути."},{"id":"1.2","points":200,"question":"Какие основные задачи решает дистанция пути?","options":["А) Управляет процессом перевозок","Б) Разрабатывает нормативные документы","В) Предупреждает и устраняет нарушения","Г) Строит железные дороги"],"answer":"В) Предупреждает и устраняет нарушения**","explanation":"Дистанция пути - структурное подразделение, обеспечивающее техническое содержание и ремонт железнодорожного пути на участке протяжённостью десятки километров. Основные задачи: осмотр и содержание пути, стрелочных  переводов, искусственных сооружений - мостов, тоннелей, путепроводов. Дистанция контролирует геометрические параметры рельсовой колеи, следит за состоянием шпал и балласта, проводит планово-предупредительный ремонт. На сети протяжённостью около 86 000 км (3-я в мире по длине) работает более 796 300 сотрудников РЖД, значительная часть которых занята именно в путевом хозяйстве. Благодаря их труду показатель безопасности в 2025 году достиг исторического минимума - 0,397 события на миллион км (-6,1% от 2024 года)."},{"id":"1.3","points":300,"question":"Что в путевом хозяйстве называют «нулевым местом»?","options":["А) Начало отсчёта километража","Б) Вид поперечного профиля земляного полотна","В) Границу двух дистанций пути","Г) Рабочее место новичка"],"answer":"Б) Вид поперечного профиля земляного полотна**","explanation":"«Нулевое место» - это поперечный профиль земляного полотна, показывающий его конструкцию в разрезе: откосы насыпи, кюветы, обочины, основание и верхнее строение пути. По этому профилю определяют, как устроена насыпа или выемка, какие слои грунта используются, как организован отвод воды. Знание «нулевого места» критически важно для монтеров пути - по нему определяют, какие работы нужно проводить при ремонте земляного полотна. Каждый участок пути имеет свой паспорт с описанием нулевого места. На сети протяжённостью около 86 000 км каждое «нулевое место» документируется и регулярно проверяется. Современные технологии, включая спутниковый мониторинг и дроны, позволяют контролировать состояние земляного полотна в режиме реального времени."},{"id":"1.4","points":400,"question":"Какой тип рельса наиболее распространён на железнодорожной сети РФ?","options":["А) Р 43","Б) Р 50","В) Р 65","Г) Р 75"],"answer":"В) Р 65**","explanation":"Рельс Р 65 (масса 65 кг/м) является основным типом рельса на магистральных железных дорогах России. Введён в эксплуатацию в 1950-х годах и до сих пор остаётся стандартом. Рельсы Р 65 изготавливают из специальной стали с повышенным содержанием хрома и ванадия, что обеспечивает высокую износостойкость. На линиях с особо тяжёлым движением, таких как БАМ и Восточный полигон, применяют более тяжёлые рельсы Р 75. Рельсы Р 43 и Р 50 используются на подъездных путях и малодеятельных линиях. На сети протяжённостью около 86 000 км (3-я в мире) работают десятки тысяч стрелочных переводов, оснащённых рельсами разных марок. Инвестиции РЖД в инфраструктуру в 2025 году составили сотни миллиардов рублей, включая обновление рельсового пути."},{"id":"1.5","points":500,"question":"Какого сигнала на железной дороге не существует?","options":["А) Три жёлтых","Б) Два жёлтых","В) Один жёлтый","Г) Жёлтый и белый"],"answer":"Г) Жёлтый и белый**","explanation":"Система железнодорожных сигналов была разработана более 150 лет назад и по сей день остаётся основой безопасности движения. Красный означает стоп, жёлтый - приготовиться, зелёный - путь свободен. Сочетание двух жёлтых означает следовать со скоростью, установленной для следования к следующему сигналу. Три жёлтых допускается в некоторых схемах. А вот сочетание жёлтого и белого не предусмотрено стандартом, так как белый цвет не является основным сигнальным цветом на железнодорожном транспорте. Благодаря строгой системе сигналов и автоматике показатель безопасности РЖД в 2025 году составил рекордные 0,397 события на миллион км - минимум за всю историю компании. На сети протяжённостью около 86 000 км установлены тысячи светофоров и систем сигнализации."},{"id":"2.1","points":100,"question":"Какой туристический проект Юго-Восточной магистрали стал визитной карточкой Воронежской области?","options":["А) Княжеский поезд","Б) Графский поезд","В) Дворянский поезд","Г) Баронский вагон"],"answer":"Б) Графский поезд**","explanation":"«Графский поезд» - ретросостав на паровозной тяге, курсирующий с августа 2021 года по маршруту Воронеж - Графская - Рамонь. Поезд оформлен в стиле начала XX века: проводники в костюмах той эпохи, вагоны с элементами декора, напоминающими о графских усадьбах Воронежской области. Маршрут проходит через живописные места - леса, реку Воронеж, усадьбу Рамонь. Проект стал частью стратегии РЖД по развитию внутрироссийского туризма. В 2025 году турпоезда РЖД перевезли рекордные 1,3 млн пассажиров - рост на 36% по сравнению с 2023 годом. Сегодня работает 112 туристических маршрутов в 48 регионах России, и «Графский поезд» - один из первых проектов, заложивших основу этого направления."},{"id":"2.2","points":200,"question":"Как называется поезд, курсирующий по Московским центральным диаметрам?","options":["А) Сапсан","Б) Иволга","В) Лебедь","Г) Стриж"],"answer":"Б) Иволга**","explanation":"Электропоезд «Иволга» (ЭП2Д) - российский поезд, разработанный Тверским вагоностроительным заводом специально для МЦК и МЦД. Он отличается широкими дверями для быстрой посадки и высадки и отсутствием тамбуров между вагонами - это позволяет пассажирам свободно перемещаться по всему составу. Поезда комплектуются системами кондиционирования, USB-зарядками и бесплатным Wi-Fi. Только по линии МЦД-1 в 2025 году перевезено 93,5 млн пассажиров. Поезда «Иволга» стали основой подвижного состава для Московских центральных диаметров и МЦК, обеспечивая высокую пропускную способность городского транспорта. Общий пассажиропоток РЖД в 2025 году составил 1 311,1 млн человек."},{"id":"2.3","points":300,"question":"В каком году в РЖД появились первые женщины-машинисты?","options":["А) 2003","Б) 2013","В) 2018","Г) 2022"],"answer":"Г) 2022**","explanation":"1 января 2021 года Минтруд России исключил профессию машиниста из перечня работ с тяжёлыми условиями труда, где запрещена женская занятость. Это открыло дорогу женщинам в кабину локомотива. 31 января 2022 года Алёна Миронова из Башкортостана первой из женщин-машинистов отправилась в рейс на пассажирском поезде. К 2025 году в РЖД работают более 100 женщин-машинистов. Все они прошли тот же курс обучения, что и мужчины, включая практику на учебном полигоне. В 2023 году отмечен первый День машиниста - профессиональный праздник, учреждённый по инициативе РЖД. В компании работают более 50 000 машинистов и их помощников, обеспечивающих перевозку 1 311,1 млн пассажиров в год."},{"id":"2.4","points":400,"question":"Какой туристический железнодорожный маршрут сегодня самый популярный у россиян?","options":["А) Карелия","Б) Кавказ","В) Белоруссия","Г) Камчатка"],"answer":"А) Карелия**","explanation":"Карелия стабильно является лидером по популярности среди железнодорожных туристических направлений. Туристические поезда отправляются из Москвы, Санкт-Петербурга и Петрозаводска. Маршруты включают посещение водопадов Кивач, горных озёр, деревянного зодчества и Кижей. Средняя продолжительность тура - 5-7 дней. Пассажиры размещаются в специальных вагонах-гостиницах с комфортными купе. РЖД активно развивает этот проект, увеличивая число поездов и маршрутов. В 2025 году турпоезда перевезли рекордные 1,3 млн пассажиров - на 36% больше, чем в 2023 году. Сегодня работает 112 туристических маршрутов в 48 регионах России, а Карелия остаётся безусловным лидером по числу заказов и пассажиропотоку."},{"id":"2.5","points":500,"question":"Какие поезда уже сегодня могут ездить без машиниста?","options":["А) Иволга","Б) Ласточка","В) Сапсан","Г) Стриж"],"answer":"Б) Ласточка**","explanation":"Беспилотная «Ласточка» впервые была испытана на испытательном кольце в Щербинке в 2019 году. В 2023 году на МЦК машинист одновременно управлял двумя беспилотными «Ласточками», каждая следовала по своему маршруту. Система основана на компьютерном зрении и ИИ: камеры и лидары сканируют обстановку, алгоритмы принимают решения. Поезд способен самостоятельно останавливаться на станциях, реагировать на сигналы, обходить препятствия. Коммерческая эксплуатация планируется к 2030 году. Параллельно РЖД развивает технологию «Виртуальная сцепка»: в 2023 году 35 900 поездов прошли по этой технологии (рост 2,9 раза), а 1 900+ локомотивов оснащены соответствующим оборудованием."},{"id":"3.1","points":100,"question":"Какой специалист отвечает за коммерческий осмотр вагонов?","options":["А) Коммерческий директор","Б) Коммерческий коллектор","В) Осмотрщик поездов","Г) Приёмщик поездов"],"answer":"Г) Приёмщик поездов**","explanation":"Приёмщик поездов - специалист, который первым встречает прибывший поезд на сортировочной станции. Его задача - осмотреть состав и найти коммерческие неисправности: повреждённые замки, сорванные пломбы, негерметичные люки. Приёмщик проверяет состояние тентов, дверей крытых вагонов, исправность запорных устройств цистерн. По статистике около 2% вагонов прибывают с коммерческими неисправностями, и их своевременное обнаружение экономит миллионы рублей. В 2025 году РЖД загрузили 1 115,8 млн тонн грузов, что потребовало бесперебойной работы коммерческих служб на всех узловых станциях сети протяжённостью около 86 000 км."},{"id":"3.2","points":200,"question":"Какой специалист отцепляет вагоны на станции?","options":["А) Дежурный по станции","Б) Разборщик поездов","В) Составитель поездов","Г) Сцепщик вагонов"],"answer":"В) Составитель поездов**","explanation":"Составитель поездов - одна из ключевых профессий на железнодорожной станции. Именно составители расформировывают прибывшие составы и формируют новые по маршрутам назначения. На сортировочных горках за сутки разбирают и формируют до 5 500 вагонов. Составитель работает в условиях постоянного риска: он находится среди движущихся вагонов, управляет сцеплением и расцеплением. Профессия требует физической выносливости, внимательности и знания устройства вагонов. В 2025 году грузооборот РЖД составил 3 075,3 млрд тонно-километров, а средняя скорость поездов достигла 494,5 км/сутки - на 21,9% выше уровня предыдущего года. Такой результат невозможен без качествовой работы составителей на сортировочных станциях."},{"id":"3.3","points":300,"question":"Как называют вагон не того направления, случайно попавший в другой состав?","options":["А) Заяц","Б) Косой","В) Зять","Г) Чужак"],"answer":"Г) Чужак**","explanation":"«Чужак» - жаргонное название вагона, который по ошибке попал в состав, следующий не по тому направлению. Это происходит на сортировочных горках, где вагоны распределяются по маршрутам. Если вагон отправился не в ту колею, его называют «чужаком». Такой вагон необходимо отцепить и отправить правильным составом. На крупных станциях «чужаки» - серьёзная проблема: они задерживают отправление поездов и требуют дополнительных маневровых операций. Технология «Виртуальная сцепка» позволяет минимизировать подобные ошибки: в 2023 году по ней прошло 35 900 поездов, а 1 900+ локомотивов оснащены системами автоматизации, снижающими человеческий фактор."},{"id":"3.4","points":400,"question":"Какой железнодорожный праздник появился в 2023 году?","options":["А) День крановщика","Б) День диспетчера","В) День машиниста","Г) День стрелочника"],"answer":"В) День машиниста**","explanation":"31 марта 2023 года в России впервые отметили День машиниста. Эта профессия - самая старая на железной дороге: машинисты появились вместе с первыми поездами в 1837 году. Праздник был учреждён по инициативе РЖД и поддержан Минтрудом. Машинист - лицо железной дороги, от его профессионализма зависит жизнь и безопасность тысяч пассажиров. В РЖД работает более 50 000 машинистов и их помощников. Каждый из них ежегодно проходит строгую аттестацию. В 2025 году на железных дорогах перевезено 1 311,1 млн пассажиров, из которых 126,7 млн - дальнего следования. Ответственность машинистов растёт вместе с объёмами перевозок и скоростью поездов."},{"id":"3.5","points":500,"question":"Сколько в России детских железных дорог?","options":["А) 10","Б) 16","В) 26","Г) 48"],"answer":"В) 26**","explanation":"В России работает 26 детских железных дорог - уникальных учебно-производственных объектов, где школьники осваивают железнодорожные профессии. Старейшая - Красноярская, работает с 1936 года. Детские железные дороги расположены в крупнейших городах: Москва, Санкт-Петербург, Новосибирск, Екатеринбург и других. Учащиеся 10-15 лет проходят обучение по специальностям: машинист, дежурный по станции, составитель поездов, монтер пути. На дорогах используются уменьшенные копии настоящих локомотивов и вагонов. Многие выпускники затем связывают жизнь с РЖД. Помимо 26 детских дорог, в системе РЖД работают 6 учебных центров, а в образовательных мероприятиях компании приняли участие более 20 млн человек. Компания активно привлекает молодёжь к железнодорожным профессиям."},{"id":"4.1","points":100,"question":"Какая американская звезда выступала перед строителями БАМа?","options":["А) Мик Джаггер","Б) Элвис Пресли","В) Джон Леннон","Г) Дин Рид"],"answer":"Г) Дин Рид**","explanation":"Дин Рид - американский певец и актёр, которого называли «красным Элвисом». В 1979 году он дал серию концертов для строителей БАМа. За 19 дней он выступил в крупных городах и отдалённых посёлках магистрали. Рид был горячим сторонником социалистических идей и одним из немногих западных деятелей культуры, который регулярно бывал в СССР. Его концерты на БАМе стали культурным событием: на выступления приходили тысячи людей. БАМ был грандиозным строительством длиной 5 600 км, для которого привлекли более 2 млн строителей. На пике работ в один день укладывали рекордные 8,1 км пути. В 2024 году БАМ отметил 40-летие, а сегодня магистраль является ключевым звеном Восточного полигона РЖД."},{"id":"4.2","points":200,"question":"Какая фигура возвышается над шпилем Казанского вокзала?","options":["А) Красная звезда","Б) Парящий феникс","В) Крылатый змей","Г) Трёхголовый пёс"],"answer":"В) Крылатый змей**","explanation":"Над шпилем Казанского вокзала в Москве возвышается флюгер в виде золотого дракона Зиланта - легендарного покровителя Казани. Впервые он появился на вокзале в 1913 году, когда был открыт новый корпус, спроектированный Алексеем Щусевым. Зилант - символ Татарстана, изображённый на гербе Казани. Флюгер весит около 50 кг и выполнен из меди с позолотой. Он вращается по ветру, указывая направление. Фигура Зиланта стала одним из узнаваемых символов Москвы. Казанский вокзал обслуживает маршруты, связывающие Москву с Поволжьем и Уралом - регионами, через которые проходит сеть протяжённостью около 86 000 км (3-я в мире)."},{"id":"4.3","points":300,"question":"Какое историческое событие способствовало появлению аббревиатур на железной дороге?","options":["А) Революция 1905 года","Б) Революция 1917 года","В) Картофельные бунты","Г) Первая мировая война"],"answer":"Г) Первая мировая война**","explanation":"Во время Первой мировой войны резко выросла нагрузка на телеграфные службы железных дорог. Телеграммы передавались вручную, и каждое слово стоило времени. Для ускорения связи начали использовать сокращения: Путь - П, Тяга - Т, Телеграф - Ш, Электрификация - Э. Эти аббревиатуры так прочно вошли в обиход, что используются по сей день. Например, ПЧ - путевая дистанция, ТЧЭ - тяговое электровозное депо, ДЦС - диспетчерский центр сигнализации. Сегодня на сети работает более 796 300 сотрудников РЖД, и сокращения остаются неотъемлемой частью железнодорожного языка. Компания управляет сетью протяжённостью около 86 000 км, и аббревиатуры упрощают коммуникацию между множеством структурных подразделений."},{"id":"4.4","points":400,"question":"В каком году в России появился первый железнодорожный музей?","options":["А) 1813","Б) 1837","В) 1896","Г) 1905"],"answer":"А) 1813**","explanation":"Первый в России и один из старейших в мире железнодорожных музеев был открыт в 1813 году - за 24 года до запуска первой российской железной дороги! Музей находился при Институте корпуса инженеров путей сообщения в Санкт-Петербурге. Он собирал образцы рельсов, вагонов и механизмов из разных стран мира. Сегодня это Музей железных дорог России, расположенный в здании Финляндского вокзала. Коллекция насчитывает более 50 000 экспонатов. В музее представлены локомотивы разных эпох - от первых паровозов до современных электровозов. РЖД развивает квантовую коммуникационную сеть протяжённостью 7 858 км - одну из крупнейших в мире, обеспечивая защиту данных на железнодорожной инфраструктуре."},{"id":"4.5","points":500,"question":"Какой город стал родоначальником запуска бесплатных туристических электричек?","options":["А) Москва","Б) Ленинград","В) Горький","Г) Свердловск"],"answer":"Б) Ленинград**","explanation":"В январе 1948 года в Ленинграде впервые запустили «Лыжную стрелку» - бесплатный пригородный поезд для любителей лыжных прогулок. Поезд доставлял лыжников из города в пригородные лесопарковые зоны и обратно. Проект стал символом заботы о здоровье горожан и был очень популярен. Впоследствии аналогичные проекты появились и в других городах. Сегодня РЖД возрождает традицию: в ряде регионов работают бесплатные пригородные поезда для студентов и льготных категорий граждан. Только по линии МЦД-1 в 2025 году перевезено 93,5 млн пассажиров. Компания обслуживает 1 311,1 млн пассажиров ежегодно, развивая как массовые, так и премиальные маршруты."}]},{"name":"Раунд 2","categories":["Инфраструктурный комплекс","Подвижной состав","Управление движением","Интересное"],"questions":[{"id":"1.1","points":100,"question":"Какая ширина колеи российских железных дорог?","options":["А) 1 435 мм","Б) 1 520 мм","В) 1 668 мм","Г) 1 600 мм"],"answer":"Б) 1 520 мм**","explanation":"Ширина колеи российских железных дорог - 1 520 мм. Это уникальный стандарт, принятый в 1942 году по предложению Николая Львова. Ширина 1 520 мм шире европейского стандарта 1 435 мм, но уже испанско-португальской 1 668 мм. По сравнению с европейской колеёй российская обеспечивает большую устойчивость состава и позволяет перевозить более тяжёлые грузы. Всего в мире 55 стран используют колею 1 520-1 524 мм. На сети РЖД протяжённостью около 86 000 км (3-я в мире) стандарт 1 520 мм обеспечивает перевозку тяжеловесных составов массой до 7 100 тонн на Восточном полигоне. В 2025 году грузооборот составил 3 075,3 млрд тонно-километров."},{"id":"1.2","points":200,"question":"Какие два типа тягового тока используются на железных дорогах России?","options":["А) Постоянный 1 500 В и переменный 10 000 В","Б) Постоянный 3 000 В и переменный 25 000 В","В) Постоянный 5 000 В и переменный 50 000 В","Г) Только переменный 25 000 В"],"answer":"Б) Постоянный 3 000 В и переменный 25 000 В**","explanation":"Российские железные дороги используют два типа тягового тока: постоянный 3 000 В на 40% сети и переменный 25 000 В, 50 Гц на 60% сети. Это уникальное инженерное решение, сложившееся исторически. Переменный ток более эффективен на длинных перегонах, постоянный - проще в оборудовании. Электровозы одной серии, например ВЛ80, могут работать на обоих типах тока благодаря системе двойного питания. В мире аналогичная ситуация только в Испании и Португалии. На сети протяжённостью около 86 000 км работают 13 152 локомотива, включая локомотивы двойного питания. В 2025 году в парк поступило 399 новых локомотивов на сумму инвестиций 137,5 млрд рублей."},{"id":"1.3","points":300,"question":"Какое инженерное сооружение считается самой красивой точкой БАМа?","options":["А) Байкальский тоннель","Б) Мост через Амур","В) Северомуйский тоннель","Г) Чёртов мост"],"answer":"Г) Чёртов мост**","explanation":"«Чёртов мост» - полукруглый виадук через реку Итыкит на БАМе, построенный в 1986 году. Высота моста - 36 метров, длина - более 300 метров. Он назван так потому, что при тяжёлом составе конструкция раскачивалась, и машинисты боялись по нему проезжать. Мост стал одним из символов БАМа и популярным местом для фотографий. Сегодня он является объектом туристического внимания - к нему организуются экскурсии. БАМ длиной 5 600 км был построен более 2 млн строителей, а в 2024 году магистраль отметила 40-летие. Сегодня БАМ - ключевое звено Восточного полигона, где грузооборот в 2025 году составил 3 075,3 млрд тонно-километров."},{"id":"1.4","points":400,"question":"С каким чудом природы столкнулись бамовцы при строительстве Северомуйского тоннеля?","options":["А) Гейзеры","Б) Миражи","В) Шаровая молния","Г) Полярное сияние"],"answer":"А) Гейзеры**","explanation":"При бурении Северомуйского тоннеля строители обнаружили 4 тектонических разлома с горячими источниками. Температура воды достигала 60 градусов, пар заполнял забой. Рабочие трудились в одном белье при невыносимой жаре и влажности. Геологическая обстановка была настолько сложной, что строительство приостанавливалось несколько раз. Инженерам удалось обуздать стихию, создав систему водоотлива и термозащиты. Строительство тоннеля заняло 37 лет - с 1977 по 2014 год. Тоннель длиной 15 343 м стал самым длинным в России и расположен на БАМе - магистрали, проходящей через Бурятию. С открытием тоннеля время прохождения участка сократилось с 1,5 часов до 15 минут."},{"id":"1.5","points":500,"question":"Как называется станция, расположенная в самой середине Транссибирской магистрали?","options":["А) Золотая","Б) Половина","В) Середина","Г) Центральная"],"answer":"Б) Половина**","explanation":"Станция Половина - географический центр Транссибирской магистрали, расположена на 3 512-м километре от Москвы. Построена в 1902 году. Интересно, что ранее «Серединой» называлась станция на ледовой переправе через озеро Байкал, но после постройки Байкальского тоннеля геометрический центр сместился. Станция находится в Красноярском крае. На станции установлен памятный знак, и многие путешественники специально останавливаются здесь, чтобы сфотографироваться на фоне таблички «Половина пути». Транссибирская магистраль - часть сети РЖД протяжённостью около 86 000 км (3-я в мире), по которой в 2025 году перевезено 1 311,1 млн пассажиров."},{"id":"2.1","points":100,"question":"Какой ретропоезд впервые отправился в рейс в новогодние праздники 2023 года?","options":["А) Дворцовый","Б) Императорский","В) Лахта","Г) Орёл"],"answer":"В) Лахта**","explanation":"Ретропоезд «Лахта» - проект Октябрьской железной дороги, впервые отправившийся в рейс в новогодние праздники 2023 года. Название происходит от карельского слова «лахта» - залив. Поезд оформлен в стиле русского модерна: вагоны украшены лепниной, хрустальными люстрами, мебелью из натурального дерева. В одном из вагонов установлены восковые фигуры героев фильма «Москва слезам не верит». Маршрут пролегает через Карелию - один из самых живописных регионов России. В 2025 году турпоезда РЖД перевезли рекордные 1,3 млн пассажиров - на 36% больше, чем в 2023 году. Сегодня работает 112 туристических маршрутов в 48 регионах."},{"id":"2.2","points":200,"question":"Какая серия обозначает пассажирский электровоз переменного тока?","options":["А) ТЭМ18","Б) ВЛ80","В) ЭП1","Г) 2ТЭ10"],"answer":"В) ЭП1**","explanation":"ЭП1 - самый распространённый пассажирский электровоз переменного тока на сети РЖД. Расшифровка: Э - электровоз, П - пассажирский, 1 - первая модель в серии. Выпускается с 1999 года на Новочеркасском электровозостроительном заводе. Мощность - 4 800 кВт, максимальная скорость - 140 км/ч. ЭП1 способен вести поезд массой до 1 100 тонн на подъёме. В парке РЖД более 1 200 таких локомотивов. В 2025 году в парк поступило 399 новых локомотивов, а инвестиции в подвижной состав составили 137,5 млрд рублей. Парк компании насчитывает 13 152 локомотива, обеспечивающих перевозку 1 311,1 млн пассажиров в год."},{"id":"2.3","points":300,"question":"Какой вид транспорта стал основой для создания первого в СССР скоростного поезда?","options":["А) Самолёт","Б) Пароход","В) Вертолёт","Г) Автомобиль"],"answer":"А) Самолёт**","explanation":"В конце 1960-х годов в СССР был создан экспериментальный скоростной вагон, на который установили реактивный двигатель от самолёта ЯК-40. Испытания проводились на полигоне в подмосковной Щербинке. Вагон развил скорость более 250 км/ч, но проект был закрыт из-за высокой стоимости и сложности эксплуатации. Тем не менее, этот эксперимент заложил основу для создания отечественных скоростных поездов. Впоследствии в 2009 году был запущен «Сапсан» - скоростной поезд на базе немецкого ICE. Сегодня РЖД строит высокоскоростную магистраль Москва - Санкт-Петербург (ВСМ), а в декабре 2024 года запущен скоростной поезд «Аврора». В 2025 году высокоскоростными поездами перевезено 19,4 млн пассажиров."},{"id":"2.4","points":400,"question":"Сколько локомотивов находится в парке ОАО «РЖД»?","options":["А) До 5 000","Б) Примерно 8 500","В) 11 058","Г) Более 20 000"],"answer":"Г) Более 20 000**","explanation":"Парк локомотивов ОАО «РЖД» насчитывает 13 152 единицы подвижного состава по данным на 2025 год. В него входят грузовые электровозы - основная часть, пассажирские электровозы - около 1 500, тепловозы - более 5 000, маневровые локомотивы и промышленные. Парк постоянно обновляется: в 2025 году РЖД получили 399 новых локомотивов. Инвестиции в подвижной состав составили 137,5 млрд рублей. Самые массовые серии: грузовой электровоз ВЛ80, пассажирский ЭП1, тепловоз 2ТЭ25А. Новые модели включают двухсистемный ЭС105 «Финист» и грузовой 2ЭС11 «Орлиный взлёт» на 42% мощнее предшественника. Запланирован водородный поезд для Сахалина на 2026-2027 годы."},{"id":"2.5","points":500,"question":"Что такое «Виртуальная сцепка»?","options":["А) Автоматическое соединение вагонов","Б) Управление двумя и более поездами как единой системой","В) Магнитные сцепки","Г) Централизованное управление из диспетчерского центра"],"answer":"Б) Управление двумя и более поездами как единой системой**","explanation":"«Виртуальная сцепка» - передовая технология РЖД, позволяющая управлять двумя и более поездами как единой системой без физического соединения. Поезда следуют один за другим с минимальной дистанцией, координируясь через цифровую платформу. Система автоматически регулирует скорость, торможение и ускорение каждого поезда. Технология значительно увеличивает пропускную способность линии. В 2023 году по технологии «Виртуальной сцепки» прошло 35 900 поездов - рост в 2,9 раза по сравнению с предыдущим периодом. 1 900+ локомотивов оснащены соответствующим оборудованием. Технология проходит испытания на Восточном полигоне и планируется к коммерческой эксплуатации к 2030 году."},{"id":"3.1","points":100,"question":"Что железнодорожники называют «Ниткой»?","options":["А) Поезд","Б) Спецодежду","В) Контактный провод","Г) Пломбировочное устройство"],"answer":"А) Поезд**","explanation":"«Нитка» - жаргонное название поезда, используемое железнодорожниками. Термин происходит от графического отображения маршрута поезда на графике движения: поезд изображается в виде линии - «нитки» - с указанием номера и времени проследования станций. Диспетчеры работают с «нитками» на графиках, где каждая линия - это отдельный поезд. Выражение «поймать нитку» означает вписать поезд в график. На вокзалах графики движения поездов традиционно показываются в виде пересекающихся «ниток». По этим «ниткам» в 2025 году перевезено 1 311,1 млн пассажиров и 1 115,8 млн тонн грузов на сети протяжённостью около 86 000 км."},{"id":"3.2","points":200,"question":"Что называют плохим бегуном и хорошим бегуном?","options":["А) Безбилетника","Б) Вагон","В) Рельсошпальную решётку","Г) Спортсмена"],"answer":"Б) Вагон**","explanation":"«Бегун» - вагон, скатывающийся с сортировочной горки под действием силы тяжести. «Плохой бегун» - крытый 4-осный вагон массой около 25 тонн: он легко останавливается из-за малого веса и трения. «Хороший бегун» - полувагон массой до 70 тонн: он набирает скорость и проезжает большие расстояния. От того, какой вагон используется как «бегун», зависит эффективность сортировки. На горках специально подбирают вагоны нужного веса для обеспечения точной остановки. Сортировочные горки играют ключевую роль в обработке грузопотоков РЖД: в 2025 году загружено 1 115,8 млн тонн грузов, а грузооборот составил 3 075,3 млрд тонно-километров."},{"id":"3.3","points":300,"question":"Какой важнейший показатель работы железнодорожного транспорта измеряется в тонно-километрах?","options":["А) Погрузка","Б) Выгрузка","В) Грузооборот","Г) Производительность локомотива"],"answer":"В) Грузооборот**","explanation":"Грузооборот - суммарная работа по перевозке грузов, измеряемая в тонно-километрах. Один тонно-километр - это перевозка одного тонны груза на расстояние одного километра. Это главный показатель работы грузового транспорта. По грузообороту РЖД занимают ведущие позиции в мире. В 2025 году грузооборот составил 3 075,3 млрд тонно-километров. Показатель зависит от массы перевезённых грузов и дальности перевозки. В 2025 году РЖД загрузили 1 115,8 млн тонн грузов, а средняя скорость поездов достигла 494,5 км/сутки - на 21,9% выше уровня предыдущего года. Это обеспечило эффективное функционирование Восточного полигона."},{"id":"3.4","points":400,"question":"Что на железной дороге имеет «горб»?","options":["А) Вагон","Б) Платформа","В) Сортировочная горка","Г) Подъездной путь"],"answer":"В) Сортировочная горка**","explanation":"Сортировочная горка - инженерное сооружение для автоматической сортировки вагонов по станциям назначения. Состоит из надвижной части, вершины - «горба» - и спускной части. Вагоны подаются на горку, где автоматически расцепляются и скатываются по наклонным путям в нужные колеи. Первая в России горка была построена в 1899 году на станции Ртищево. Крупнейшие горки перерабатывают до 5 500 вагонов в сутки. «Горб» - это точка, где вагон переходит от подъёма к спуску. На сети РЖД протяжённостью около 86 000 км действуют десятки сортировочных горок, обеспечивающих обработку 1 115,8 млн тонн грузов в год."},{"id":"3.5","points":500,"question":"Какая из этих профессий есть на железной дороге?","options":["А) Гляциолог","Б) Сейсмолог","В) Синоптик","Г) Скульптор"],"answer":"В) Синоптик**","explanation":"Синоптик - метеоролог, работающий на железной дороге. Железнодорожный транспорт крайне чувствителен к погодным условиям: метель может остановить движение, гололёд - нарушить контактную сеть, жара - вызвать деформацию рельсов. Синоптики РЖД составляют прогнозы на сутки и перспективу, предупреждают об опасных явлениях. Их прогнозы помогают быть готовыми к катаклизмам: сколько снега выпадет, будет ли ледяной дождь, какой ветер ожидается. На крупных узлах синоптики работают круглосуточно. Благодаря работе синоптиков и других специалистов показатель безопасности РЖД в 2025 году составил рекордные 0,397 события на миллион км - на 6,1% лучше показателя 2024 года."},{"id":"4.1","points":100,"question":"Какая из этих профессий есть на железной дороге?","options":["А) Космонавт","Б) Дрессировщик","В) Вулканолог","Г) Лётчик-испытатель"],"answer":"Б) Дрессировщик**","explanation":"На некоторых детских железных дорогах работают дрессировщики животных. В Советском Союзе существовала традиция использовать животных в железнодорожной тематике. Самый известный пример - «Мышиная железная дорога» на ВДНХ, аттракциону которой более 130 лет. Мыши тянули миниатюрные вагончики по微型 дорожке. На детских железных дорогах воспитанники иногда ухаживают за животными, участвуют в спектаклях и конкурсах. Это часть воспитательной работы. В системе РЖД работают 26 детских железных дорог и 6 учебных центров, а в образовательных мероприятиях компании приняли участие более 20 млн человек."},{"id":"4.2","points":200,"question":"На каком вокзале перроны на втором этаже?","options":["А) Курский","Б) Рижский","В) Витебский","Г) Ладожский"],"answer":"В) Витебский**","explanation":"Витебский вокзал в Москве - единственный вокзал в России с перронами на втором этаже. Строительство началось в 1902 году по проекту инженера Ивана Рерберга. Вокзал был первым в мире с лифтами для подъёма багажа к перронам. Пассажиры поднимаются на платформу по лестницам и эскалаторам. Витебский вокзал обслуживает пригородные поезда в направлении Тулы, Воронежа, Курска. Здание вокзала является памятником архитектуры и объектом культурного наследия. В 2025 году пригородные поезда РЖД перевезли десятки миллионов пассажиров, а общая сеть компании протяжённостью около 86 000 км обслуживает 1 311,1 млн пассажиров в год."},{"id":"4.3","points":300,"question":"Под каким названием известна Дуровская железная дорога?","options":["А) Звериная","Б) Мышиная","В) Гусиная","Г) Тюленья"],"answer":"Б) Мышиная**","explanation":"«Мышиная железная дорога» - знаменитый аттракцион на ВДНХ в Москве, которому более 130 лет. Начало было положено в 1886 году, когда Владимир Дуров выступал с мышами на цирковой арене. Постепенно аттракцион превратился в полноценную миниатюрную железную дорогу, где мыши тянули вагончики. За историю аттракциона в нём участвовало более 100 животных - не только мыши, но и ёжики, белки, хорьки. «Мышиная железная дорога» стала одной из визитных карточек ВДНХ. Железнодорожная тематика глубоко укоренена в российской культуре, а 26 детских железных дорог продолжают традицию воспитания будущих железнодорожников."},{"id":"4.4","points":400,"question":"Что было главным развлечением для пассажиров «Ориентал Лимитед» в начале XX века?","options":["А) Телевизор","Б) Пылесос","В) Самовар","Г) Кофеварка"],"answer":"Б) Пылесос**","explanation":"Легендарный поезд «Ориентал Экспресс» - один из самых роскошных поездов в истории. В начале XX века среди пассажиров была мода испытывать новинки цивилизации. Электрический пылесос, изобретённый за пару лет до запуска поезда, стал одним из главных развлечений. Пассажиры с удовольствием пробовали новое устройство для уборки купе. «Ориентал Экспресс» связывал Париж со Стамбулом, проходя через Швейцарию, Австрию и Сербию. Поезд стал символом золотой эпохи железнодорожных путешествий. Сегодня РЖД возрождает традицию роскошных путешествий: в 2025 году турпоезда перевезли 1,3 млн пассажиров по 112 маршрутам в 48 регионах."},{"id":"4.5","points":500,"question":"Какой город стал родоначальником «Лыжной стрелки»?","options":["А) Ленинград","Б) Свердловск","В) Хабаровск","Г) Горький"],"answer":"А) Ленинград**","explanation":"В январе 1948 года в Ленинграде впервые запустили «Лыжную стрелку» - бесплатный пригородный поезд для любителей лыжных прогулок. Поезд доставлял лыжников из города в пригородные лесопарковые зоны и обратно. Проект стал символом заботы о здоровье горожан и был чрезвычайно популярен. Впоследствии аналогичные проекты появились и в других городах Советского Союза. Сегодня РЖД возрождает традицию бесплатных пригородных поездов для различных категорий граждан. Только по линии МЦД-1 в 2025 году перевезено 93,5 млн пассажиров. Общий пассажиропоток компании составил 1 311,1 млн человек в год."}]},{"name":"Раунд 3","categories":["Инфраструктурный комплекс","Подвижной состав","Управление движением","Интересное"],"questions":[{"id":"1.1","points":100,"question":"Какой специалист дважды в год борется с изменением размеров стыков между рельсами?","options":["А) Машинист","Б) Монтер пути","В) Поездной диспетчер","Г) Рельсоукладчик"],"answer":"Б) Монтер пути**","explanation":"Монтер пути - специалист, который следит за состоянием железнодорожного полотна. Дважды в год, летом и зимой, он борется с изменением размеров стыков между рельсами. Летом при нагреве рельсы удлиняются и могут «выбросить» - выгнуться в стороны. Зимой при охлаждении рельсы укорачиваются и образуются опасные ямы - зазоры между стыками. Монтеры пути регулируют зазоры, затягивают болты, следят за состоянием стыковых балок. Это одна из самых тяжёлых и ответственных профессий на железной дороге. На сети протяжённостью около 86 000 км (3-я в мире) работают тысячи монтеров пути. Благодаря их труду показатель безопасности в 2025 году составил рекордные 0,397 события на миллион км."},{"id":"1.2","points":200,"question":"Что обязательно должно присутствовать в гардеробе сигналиста?","options":["А) Сигнальные рукава","Б) Сигнальная шапка","В) Резиновые сапоги","Г) Резиновые перчатки"],"answer":"А) Сигнальные рукава**","explanation":"Сигнальные рукава - обязательный элемент экипировки сигналиста на железнодорожной дороге. Они изготовлены из флуоресцентной ткани, отражающей свет, и видны на расстоянии более 1000 метров. Без рукавов и сигнального жилета на путь выходить категорически запрещено - это вопрос безопасности. Сигналист подаёт рукавами сигналы машинистам: «стоп», «приготовиться к отправлению», «проход разрешён». В ночное время используются фонарики с красным и зелёным светом. Строгие нормы безопасности РЖД позволяют поддерживать рекордные показатели: в 2025 году зафиксировано всего 0,397 события на миллион километров, что на 6,1% лучше показателя предыдущего года."},{"id":"1.3","points":300,"question":"Как называют перекрёстный стрелочный перевод на четыре направления?","options":["А) Глухарь","Б) Англичанка","В) Осьминог","Г) Трёхгранник"],"answer":"Б) Англичанка**","explanation":"«Англичанка» - перекрёстный стрелочный перевод, ведущий крест-накрест с двух путей на четыре направления. Название происходит от того, что первые такие переводы были разработаны английскими производителями. Конструкция «англичанки» позволяет поездам с любого из двух путей следовать на четыре направления. Это сложное инженерное сооружение применяется на крупных узловых станциях, где требуется максимальная гибкость маршрутов. Техническое обслуживание «англичанки» требует высокой квалификации. На сети РЖД протяжённостью около 86 000 км десятки тысяч стрелочных переводов, включая уникальные «англичанки», обеспечивают маневренность и пропускную способность."},{"id":"1.4","points":400,"question":"На какой линии в России участок с левосторонним движением?","options":["А) Казань — Тверь","Б) Тайшет — Канск","В) Москва — Рязань","Г) Самара — Пенза"],"answer":"В) Москва — Рязань**","explanation":"Участок Москва - Рязань - единственная линия в России с левосторонним движением поездов. Магистраль строили англичане в середине XIX века и, следуя своей традиции, организовали движение по левой стороне. На этом участке светофоры расположены по левую руку от машиниста, а пассажиры выходят из поездов с непривычной стороны. Перейти на правостороннее движение не удалось из-за высокой плотности движения и технической сложности перехода. Участок является уникальным явлением российской железнодорожной истории. На сеть протяжённостью около 86 000 км (3-я в мире) приходится множество таких исторических особенностей, каждая из которых связана с уникальной историей строительства."},{"id":"1.5","points":500,"question":"Какая ресурсосберегающая технология на сети самая распространённая?","options":["А) Повторная укладка старогодных материалов","Б) Очистка кюветов","В) Плановая замена элементов ВСП","Г) Укладка безбалластного мостового полотна"],"answer":"А) Повторная укладка старогодных материалов**","explanation":"Повторная укладка старогодных материалов - самая распространённая ресурсосберегающая технология на сети РЖД. Суть метода: отработавшие свойства рельсы и шпалы снимают с малодеятельных путей и укладывают на ветках с более интенсивным движением. Это позволяет значительно сэкономить на закупке новых материалов. По оценкам РЖД, повторная укладка экономит до 40% стоимости ремонта пути. Технология особенно востребована на подъездных путях промышленных предприятий, где нагрузка ниже, чем на магистралях. На сети протяжённостью около 86 000 км ресурсосбережение является приоритетом, поскольку стоимость ежегодных инвестиций в инфраструктуру исчисляется сотнями миллиардов рублей."},{"id":"2.1","points":100,"question":"Как называются грузовые вагоны-самосвалы?","options":["А) Гондола","Б) Хоппер","В) Думпкар","Г) Бункер"],"answer":"В) Думпкар**","explanation":"Думпкар - специализированный грузовой вагон-самосвал для перевозки сыпучих грузов. Главная особенность - способность наклоняться на 45 градусов вправо и влево, обеспечивая выгрузку на любую сторону. Грузоподъёмность - до 80 тонн. Думпкары используются для перевозки щебня, гравия, песка, минеральных удобрений. Они незаменимы при строительстве и ремонте железных дорог - позволяют быстро разгружать материалы прямо на месте работ. В 2025 году РЖД загрузили 1 115,8 млн тонн грузов, и думпкары играют важную роль в обеспечении строительных работ на сети протяжённостью около 86 000 км. Грузооборот компании составил 3 075,3 млрд тонно-километров."},{"id":"2.2","points":200,"question":"Какая профессия наиболее близка осмотрщику вагонов?","options":["А) Актёр","Б) Музыкант","В) Физик","Г) Юрист"],"answer":"Б) Музыкант**","explanation":"Основной инструмент осмотрщика вагонов - молоток. По звуку удара молотком по деталям вагона осмотрщик определяет трещины, открутившиеся болты, деформации. Это точно так же, как музыкант определяет ноту по звуку удара. Осмотрщик стучит по колёсам, рамам, автосцепке и прислушивается. Глухой звук говорит о трещине, звонкий - о нормальном состоянии. Профессия требует идеального слуха и большого опыта. Осмотрщики проходят специальную аттестацию и ежегодно подтверждают квалификацию. На сети РЖД протяжённостью около 86 000 км (3-я в мире) работают сотни осмотрщиков. В 2025 году парк локомотивов пополнился 399 новыми единицами, а инвестиции в подвижной состав составили 137,5 млрд рублей."},{"id":"2.3","points":300,"question":"Какой железнодорожный праздник появился в 2023 году?","options":["А) День крановщика","Б) День диспетчера","В) День машиниста","Г) День стрелочника"],"answer":"В) День машиниста**","explanation":"31 марта 2023 года в России впервые отметили День машиниста. Эта профессия - самая старая на железной дороге: машинисты появились вместе с первыми поездами в 1837 году. Праздник был учреждён по инициативе РЖД и поддержан Минтрудом. Машинист - лицо железной дороги, от его профессионализма зависит жизнь и безопасность тысяч пассажиров. В РЖД работает более 50 000 машинистов и их помощников. Каждый из них ежегодно проходит строгую аттестацию. В 2025 году на железных дорогах перевезено 1 311,1 млн пассажиров. В парке компании 13 152 локомотива, из которых 399 новых поступили в 2025 году."},{"id":"2.4","points":400,"question":"Когда в Москве появилась первая пригородная электричка?","options":["А) 1905","Б) 1918","В) 1929","Г) 1946"],"answer":"В) 1929**","explanation":"3 августа 1929 года по маршруту Москва - Мытищи впервые отправилась пригородная электричка. Это было революционное событие: электропоезд в два раза сократил время в пути по сравнению с паровым поездом. Маршрут Москва - Мытищи стал первым электрифицированным пригородным направлением в СССР. Инициатором проекта был нарком путей сообщения Лазарь Каганович. Электрификация пригородных линий позволила резко увеличить пропускную способность и обеспечить массовые перевозки работающих москвичей. Сегодня только по МЦД-1 перевозится 93,5 млн пассажиров в год. Общий пассажиропоток РЖД в 2025 году составил 1 311,1 млн человек."},{"id":"2.5","points":500,"question":"Как на БАМе называют машинистов-новичков?","options":["А) Первозимник","Б) Второгодник","В) Студент","Г) Чайник"],"answer":"А) Первозимник**","explanation":"«Первозимник» - так на БАМе называют машинистов-новичков, впервые отправляющихся на линию в зимний период. Вчерашние студенты и опытные машинисты из тёплых регионов приезжают на БАМ и учатся работать с автотормозами при низких температурах, когда морозы достигают минус 50 градусов. Зима на БАМе - суровое испытание: стекла замерзают, смазка густеет, металл становится хрупким. «Первозимник» должен научиться чувствовать поезд в экстремальных условиях. Программа стажировки длится несколько месяцев. БАМ длиной 5 600 км является частью Восточного полигона, где грузооборот в 2025 году составил 3 075,3 млрд тонно-километров."},{"id":"3.1","points":100,"question":"Кто является руководителем движения на перегоне?","options":["А) Дежурный по станции","Б) Поездной диспетчер","В) Начальник участка","Г) Начальник станции"],"answer":"Б) Поездной диспетчер**","explanation":"Поездной диспетчер - руководитель движения поездов на перегоне или группе перегонов. Он отвечает за соблюдение графика, организует движение, обеспечивает безопасность. Диспетчер видит каждый поезд на экране, положение стрелок, показания светофоров. Он принимает решение о направлении поездов на обгон, встречу, пропуск. В случае задержки поезда диспетчер корректирует график и уведомляет все станции. Поездной диспетчер работает круглосуточно в диспетчерском центре, имея полную картину обстановки на участке. На сети протяжённостью около 86 000 км (3-я в мире) десятки диспетчерских центров обеспечивают безопасность 1 311,1 млн перевезённых пассажиров и 1 115,8 млн тонн грузов."},{"id":"3.2","points":200,"question":"Какая железнодорожная станция считается самой крупной в России?","options":["А) Лужская","Б) Инская","В) Тайшет","Г) Юдино"],"answer":"А) Лужская**","explanation":"Станция Лужская - самая крупная по площади железнодорожная станция в России. Её площадь превышает 900 гектаров, протяжённость путей - более 320 километров. Станция расположена на Октябрьской железной дороге в Ленинградской области. Это настоящий железнодорожный город с сортировочными путями, припортовыми грузовыми парками и промышленными подъездами. Лужская является ключевым узлом на пути из Санкт-Петербурга в Москву. На станции работают тысячи железнодорожников. Станция Лужская является примером масштаба инфраструктуры РЖД: сеть протяжённостью около 86 000 км (3-я в мире) включает десятки крупных узловых станций."},{"id":"3.3","points":300,"question":"Кто в 2007 году был принят на должность смотрителя станции Киши в Японии?","options":["А) Пенсионер","Б) Школьник","В) Кошка","Г) Собака"],"answer":"В) Кошка**","explanation":"Кошка Тама была назначена смотрителем станции Киши в японском городе Кинокава в 2007 году, когда станцию грозило закрытие из-за убытков. Тама стала символом станции: тысячи туристов приезжали фотографировать пушистую «смотрительницу». Благодаря Таме доходы станции выросли в несколько раз, а кошка была повышена до директора станции. Тама работала в специальной шляпе-форме и даже имела собственный кабинет. После её смерти в 2015 году пост смотрителя заняла её преемница - кошка Нитама. В России железнодорожные станции тоже могут быть необычными: 26 детских железных дорог воспитывают будущих железнодорожников, а сеть РЖД протяжённостью около 86 000 км обслуживает 1 311,1 млн пассажиров в год."},{"id":"3.4","points":400,"question":"Сколько вагонов в самом длинном грузовом составе СССР?","options":["А) 250","Б) 380","В) 440","Г) 510"],"answer":"В) 440**","explanation":"В 1986 году на станции Экибастуз в Казахстане был сформирован рекордный грузовой состав из 440 вагонов. Общая длина состава составила 6,5 километра, а вес превышал 43 000 тонн. Поезд тянули несколько электровозов серии ВЛ80. Рекорд был установлен в рамках эксперимента по увеличению веса поездов на Восточном полигоне. Сегодня на Восточном полигоне РЖД работают составы массой до 7 100 тонн - это самые тяжёлые регулярные поезда в мире. В 2025 году грузооборот РЖД составил 3 075,3 млрд тонно-километров, а загрузка достигла 1 115,8 млн тонн грузов. Средняя скорость поездов на Восточном полигоне достигла 494,5 км/сутки - на 21,9% выше уровня 2024 года."},{"id":"3.5","points":500,"question":"Как называется время прекращения движения поездов для работ на линии?","options":["А) Стойло","Б) Створ","В) Окно","Г) Ворота"],"answer":"В) Окно**","explanation":"«Окно» - метафорическое название времени, когда движение поездов приостанавливается для проведения ремонтных и строительных работ на линии. За это время бригады ремонтируют рельсы, шпалы, мосты, тоннели, контактные сети. «Окно» планируется заранее и может длиться от нескольких минут до нескольких часов. Чем больше «окно», тем масштабнее работы. На загруженных магистралях «окна» дают ночью, когда движение минимально. Понятие «окно» широко используется и в IT - как время, свободное от процессов. На сети РЖД протяжённостью около 86 000 км (3-я в мире) за «окна» проводятся масштабные работы, обеспечивающие рекордные показатели безопасности: 0,397 события на миллион км в 2025 году."},{"id":"4.1","points":100,"question":"Какой билет покупали пассажиры первой железной дороги в России?","options":["А) Бумажный","Б) Картонный","В) Медный","Г) Латунный"],"answer":"Г) Латунный**","explanation":"На первой российской железной дороге Санкт-Петербург - Царское Село, открытой в 1837 году, билеты были латунными жетонами. На каждом жетоне выдавливалась информация: название станции, время отправления, номер кареты. Пассажиры сдавали жетон кондуктору при входе в вагон. Латунные жетоны были прочными и удобными - их невозможно было порвать или смазать. Музей железных дорог России хранит экземпляры таких жетонов. Позже билеты стали бумагными, но традиция жетонов сохранилась в московском метрополитене. Сегодня РЖД перевозит 1 311,1 млн пассажиров в год, и каждый из них получает электронный билет - от латунных жетонов прошло почти 190 лет."},{"id":"4.2","points":200,"question":"В каком виде спорта РЖД помогает устанавливать рекорды?","options":["А) Силовой экстрим","Б) Скалолазание","В) Трейлраннинг","Г) Бейсджампинг"],"answer":"А) Силовой экстрим**","explanation":"РЖД является генеральным спонсором силового экстрима - вида спорта, где атлеты голыми руками сдвигают с места тяжёлые объекты. Богатыри сдвигали электровозы, электрички и целые поезда. Рекорды устанавливаются в нескольких категориях: сдвинуть локомотив на максимальное расстояние, за минимальное время, с наибольшим количеством пассажиров. Соревнования проводятся на крупных железнодорожных станциях и привлекают тысячи зрителей. Спортсмены тренируются годами, чтобы развить достаточную силу для работы с составами массой в сотни тонн. РЖД поддерживает этот вид спорта, демонстрируя мощь и надёжность железнодорожного транспорта. В 2025 году парк компании насчитывает 13 152 локомотива."},{"id":"4.3","points":300,"question":"У вокзала какого города стоит скульптура человека на дрезине?","options":["А) Йошкар-Ола","Б) Сыктывкар","В) Екатеринбург","Г) Новосибирск"],"answer":"А) Йошкар-Ола**","explanation":"У вокзала города Йошкар-Ола стоит скульптура Мустафы - героя фильма «Путевка в жизнь» 1931 года. В фильме молодой татарин Мустафа строит железную дорогу и ценой своей жизни предотвращает крушение поезда. Скульптура изображает его на дрезине - ручном железнодорожном транспорте. Фильм стал классикой советского кинематографа, а история Мустафы - симвом самоотверженности железнодорожников. Памятник стал одной из достопримечательностей города и обязательным местом для фотографий туристов. Железнодорожная тематика глубоко укоренена в российской культуре, а 26 детских железных дорог продолжают традицию воспитания будущих железнодорожников."},{"id":"4.4","points":400,"question":"Название какой железнодорожной станции придумали строители Мурманской магистрали?","options":["А) Полярные Зори","Б) Африканда","В) Выходной","Г) Лапландия"],"answer":"Б) Африканда**","explanation":"Станция Африканда на Мурманской магистрали получила своё имя в 1925 году благодаря иронии строителей. Магистраль строилась в условиях суровой арктической зимы, когда температура опускалась ниже минус 50 градусов. Рабочие шутили, что им так жарко, что они будто в Африке. Отсюда и пошло название - Африканда. Мурманская магистраль - одна из самых сложных в строительстве: она проходит через вечную мерзлоту, болота и тундру. Станция Африканда является грузовым узлом на перегоне между Мурманском и Петрозаводском. Магистраль является частью сети РЖД протяжённостью около 86 000 км, связывающей 艰 extremные регионы страны."},{"id":"4.5","points":500,"question":"Какая железнодорожная станция дважды снималась в фильмах Эльдара Рязанова?","options":["А) Лосиноостровская","Б) Подмосковная","В) Царицыно","Г) Фили"],"answer":"А) Лосиноостровская**","explanation":"Станция Лосиноостровская под Москвой дважды появлялась в фильмах великого режиссёра Эльдара Рязанова. В «Служебном романе» героиня Аллы Пугачёвой жила рядом с этой станцией. В «Вокзале для двоих» режиссёру нужна была станция с большим количеством поездов - и снова выбор пал на Лосиноостровскую. Интересно, что в «Вокзале для двоих» Рязанов сам сыграл эпизодическую роль начальника станции. Станция стала неформальным символом рязановского кинематографа и местом паломничества киноманов. Железнодорожная тематика занимает важное место в российской культуре, а сеть РЖД протяжённостью около 86 000 км (3-я в мире) обслуживает 1 311,1 млн пассажиров в год."}]}];
const SCORES = [0,0,0,0,0];
const TEAM_NAMES = ['Команда 1','Команда 2','Команда 3','Команда 4','Команда 5'];
const HISTORY = [];
const USED = {};
const PASSWORD = '1234';
let isAuthenticated = false;
let currentRound = 0;
let selectedBoardTeam = -1;
let currentTeam = -1;
let currentCatIdx = -1;
let currentPosIdx = -1;
const COST_MAP = [100,200,300,400,500];

function init(){
  document.getElementById('lock-password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') checkPassword();
  });
}

function checkPassword(){
  const input = document.getElementById('lock-password').value.trim();
  if(input === PASSWORD){
    isAuthenticated = true;
    document.getElementById('lock-error').textContent = '';
    document.getElementById('screen-lock').classList.remove('active');
    document.getElementById('app-header').style.display = 'flex';
    renderSetup();
  } else {
    document.getElementById('lock-error').textContent = 'Неверный пароль. Доступ закрыт.';
    document.getElementById('lock-password').value = '';
    document.getElementById('lock-password').focus();
  }
}

function renderSetup(){
  const c = document.getElementById('setup-teams');
  c.innerHTML = '';
  TEAM_NAMES.forEach((name,i)=>{
    c.innerHTML += '<div class="setup-team"><div class="num">'+(i+1)+'</div><input id="team-name-'+i+'" value="'+name+'" placeholder="Введите название" /></div>';
  });
  document.getElementById('screen-setup').classList.add('active');
}

function finishSetup(){
  TEAM_NAMES.forEach((_,i)=>{
    const v = document.getElementById('team-name-'+i).value.trim();
    if(v) TEAM_NAMES[i] = v;
  });
  document.getElementById('screen-setup').classList.remove('active');
  renderRounds();
  showScreen('screen-rounds');
}

function renderRounds(){
  const g = document.getElementById('rounds-grid');
  g.innerHTML = '';
  ROUNDS.forEach((r,i)=>{
    const total = r.questions.length;
    const used = Object.keys(USED).filter(k=>k.startsWith(i+'-')).length;
    const pct = total?Math.round(used/total*100):0;
    g.innerHTML+='<div class="round-card" onclick="selectRound('+i+')"><div class="num">'+(i+1)+'</div><div class="label">Раунд «'+r.name+'»</div><div class="sub">'+total+' вопросов</div><div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
  });
}

function selectRound(i){ currentRound=i; renderBoard(); showScreen('screen-board'); }

function renderBoard(){
  const r = ROUNDS[currentRound];
  document.getElementById('board-title').textContent = 'Раунд '+(currentRound+1)+' — '+r.name;
  const g = document.getElementById('board-grid');
  g.innerHTML='';
  // Team row
  g.innerHTML+='<div class="team-row-label">Отвечает команда</div>';
  TEAM_NAMES.forEach((name,i)=>{
    const active = selectedBoardTeam===i ? ' active' : '';
    g.innerHTML+='<div class="team-cell'+active+'" onclick="selectBoardTeam('+i+')">'+(i+1)+'</div>';
  });
  // Category rows
  r.categories.forEach((cat,ci)=>{
    g.innerHTML+='<div class="cat-label">'+cat+'</div>';
    for(let pos=0;pos<5;pos++){
      const key=currentRound+'-'+ci+'-'+pos;
      const used=USED[key];
      const cost=COST_MAP[pos];
      g.innerHTML+='<div class="q-cell '+(used?'used':'')+'" '+(used?'':'onclick="selectQuestion('+ci+','+pos+')"')+'>'+cost+'</div>';
    }
  });
}

function goToBoard(){ selectedBoardTeam=-1; renderBoard(); showScreen('screen-board'); }
function goToRounds(){ renderRounds(); showScreen('screen-rounds'); }

function selectBoardTeam(i){
  selectedBoardTeam = (selectedBoardTeam===i) ? -1 : i;
  renderBoard();
}

function selectQuestion(catIdx,posIdx){
  if(selectedBoardTeam<0){
    // flash team row to hint
    document.querySelectorAll('.team-cell').forEach(c=>{c.style.boxShadow='0 0 16px rgba(212,168,67,.6)';});
    setTimeout(()=>{document.querySelectorAll('.team-cell').forEach(c=>{c.style.boxShadow='';});},600);
    return;
  }
  currentCatIdx=catIdx;
  currentPosIdx=posIdx;
  currentTeam=selectedBoardTeam;
  const r=ROUNDS[currentRound];
  const qIdx=currentCatIdx*5+currentPosIdx;
  const q=r.questions[qIdx];
  const cost=COST_MAP[currentPosIdx];
  document.getElementById('q-badge').textContent=r.categories[currentCatIdx]+' · '+cost+' баллов · '+TEAM_NAMES[currentTeam];
  let optsHtml=q.options.map(o=>{
    const letter=o.charAt(0);
    const isCorrect=q.answer.startsWith(letter);
    return '<div class="q-option '+(isCorrect?'correct':'')+'"><span class="letter">'+letter+'</span>'+o.substring(3)+'</div>';
  }).join('');
  const explHtml=q.explanation.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('');
  document.getElementById('q-body').innerHTML=
    '<div class="q-text">'+q.question+'</div>'+
    '<div class="q-options">'+optsHtml+'</div>'+
    '<div class="q-answer-label">Правильный ответ: '+q.answer+'</div>'+
    '<div class="q-explanation">'+explHtml+'</div>';
  document.getElementById('q-actions').innerHTML=
    '<button class="q-action-btn accept" onclick="answerQuestion(true)">✓ Засчитать ('+TEAM_NAMES[currentTeam]+', +'+cost+')</button>'+
    '<button class="q-action-btn reject" onclick="answerQuestion(false)">✗ Не засчитать</button>';
  showScreen('screen-question');
}

function renderTeamSelect(){
  const g=document.getElementById('team-select-grid');
  g.innerHTML='';
  TEAM_NAMES.forEach((name,i)=>{
    g.innerHTML+='<div class="team-card" onclick="startQuestion('+i+')"><div class="team-card-name">'+name+'</div><div class="team-card-score">'+SCORES[i]+' баллов</div></div>';
  });
}

function startQuestion(teamIdx){
  currentTeam=teamIdx;
  const r=ROUNDS[currentRound];
  const qIdx=currentCatIdx*5+currentPosIdx;
  const q=r.questions[qIdx];
  const cost=COST_MAP[currentPosIdx];
  document.getElementById('q-badge').textContent=r.categories[currentCatIdx]+' · '+cost+' баллов';
  let optsHtml=q.options.map(o=>{
    const letter=o.charAt(0);
    const isCorrect=q.answer.startsWith(letter);
    return '<div class="q-option '+(isCorrect?'correct':'')+'"><span class="letter">'+letter+'</span>'+o.substring(3)+'</div>';
  }).join('');
  const explHtml=q.explanation.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('');
  document.getElementById('q-body').innerHTML=
    '<div class="q-text">'+q.question+'</div>'+
    '<div class="q-options">'+optsHtml+'</div>'+
    '<div class="q-answer-label">Правильный ответ: '+q.answer+'</div>'+
    '<div class="q-explanation">'+explHtml+'</div>';
  document.getElementById('q-actions').innerHTML=
    '<button class="q-action-btn accept" onclick="answerQuestion(true)">✓ Засчитать ('+TEAM_NAMES[currentTeam]+', +'+cost+')</button>'+
    '<button class="q-action-btn reject" onclick="answerQuestion(false)">✗ Не засчитать</button>';
  showScreen('screen-question');
}

function answerQuestion(correct){
  const r=ROUNDS[currentRound];
  const qIdx=currentCatIdx*5+currentPosIdx;
  const q=r.questions[qIdx];
  const cost=COST_MAP[currentPosIdx];
  USED[currentRound+'-'+currentCatIdx+'-'+currentPosIdx]=true;
  HISTORY.push({
    team:currentTeam,
    round:currentRound,
    cat:currentCatIdx,
    pos:currentPosIdx,
    correct:correct,
    points:correct?cost:0,
    categoryName:r.categories[currentCatIdx],
    cost:cost
  });
  SCORES[currentTeam]=Math.max(0,SCORES[currentTeam]+(correct?cost:0));
  renderBoard();
  showScreen('screen-board');
}

function showScreen(id){
  document.querySelectorAll('.screen,.question-screen,.setup-screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toggleScore(){
  renderScoreboard();
  document.getElementById('scoreboard').classList.toggle('open');
}

function renderScoreboard(){
  const c=document.getElementById('score-teams');
  c.innerHTML='';
  const sorted=TEAM_NAMES.map((name,i)=>({name,score:SCORES[i],idx:i})).sort((a,b)=>b.score-a.score);
  const positions={};
  sorted.forEach((t,i)=>positions[t.idx]=i+1);
  TEAM_NAMES.forEach((name,i)=>{
    const teamHistory=HISTORY.filter(h=>h.team===i);
    const historyHtml=teamHistory.map((h,hi)=>{
      const globalIdx=HISTORY.indexOf(h);
      return '<span class="history-plaque '+(h.correct?'correct':'incorrect')+'" onclick="showReview('+globalIdx+')">'+h.categoryName.substring(0,12)+' '+h.cost+'</span>';
    }).join('');
    c.innerHTML+='<div class="score-team"><div class="team-position">#'+positions[i]+'</div><div class="team-name">'+name+'</div><div class="team-score" id="score-'+i+'">'+SCORES[i]+'</div><div class="team-history">'+historyHtml+'</div></div>';
  });
}

function showReview(idx){
  const h=HISTORY[idx];
  const r=ROUNDS[h.round];
  const qIdx=h.cat*5+h.pos;
  const q=r.questions[qIdx];
  const cost=COST_MAP[h.pos];
  const b=document.getElementById('review-body');
  let optsHtml=q.options.map(o=>{
    const letter=o.charAt(0);
    const isCorrect=q.answer.startsWith(letter);
    return '<div class="review-option '+(isCorrect?'correct':'')+'">'+o+'</div>';
  }).join('');
  const explHtml=q.explanation.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('');
  b.innerHTML=
    '<div class="review-badge">'+r.categories[h.cat]+' · '+cost+' баллов</div>'+
    '<div class="review-team">'+TEAM_NAMES[h.team]+' — Раунд '+(h.round+1)+'</div>'+
    '<div class="review-result '+(h.correct?'correct':'incorrect')+'">'+(h.correct?'✓ Засчитано +'+cost:'✗ Не засчитано')+'</div>'+
    '<div class="review-q">'+q.question+'</div>'+
    '<div class="review-options">'+optsHtml+'</div>'+
    '<div class="review-answer">Правильный ответ: '+q.answer+'</div>'+
    '<div class="review-expl">'+explHtml+'</div>';
  document.getElementById('review-overlay').classList.add('open');
}

function closeReview(){ document.getElementById('review-overlay').classList.remove('open'); }

init();
</script>
</body>
</html>
