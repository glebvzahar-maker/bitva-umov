ловек работает в холдинге ОАО «РЖД»?", "options": ["А) 500 тысяч", "Б) 750 тысяч", "В) Около 1 миллиона", "Г) 1,5 миллиона"], "answer": "В) Около 1 миллиона**", "explanation": "ОАО «РЖД» — крупнейший работодатель России: в холдинге работает около 1 миллиона человек, выполняющих более 1000 различных профессий. Это больше, чем население многих российских городов.\n\nСтруктура персонала чётко организована: рабочие специальности (машинисты, проводники, путейцы, диспетчеры), инженерно-технический персонал, управленческий состав, специалисты сервисных компаний. Каждая из тысячи профессий играет свою роль в общей системе.\n\nМасштаб компании определяется не только числом сотрудников, но и географией: РЖД работает на территории 85 субъектов Российской Федерации, охватывая 11 часовых поясов. От Калининграда до Владивостока — везде работают люди, обеспечивающие бесперебойное функционирование транспортной системы.\n\nДля студентов миллион сотрудников — это понятие масштаба: если бы все сотрудники РЖД встали в очередь, она протянулась бы от Москвы до Санкт-Петербурга. А если бы они составили колонну и шли по одному, на проход последнего ушло бы несколько дней."}, {"id": "2.2", "points": 10, "question": "Сколько километров железнодорожных путей в России?", "options": ["А) 55 000 км", "Б) 70 000 км", "В) 85 500 км", "Г) 100 000 км"], "answer": "В) 85 500 км**", "explanation": "Протяжённость сети железных дорог России составляет 85 500 км, из которых 44 300 км — электрифицированные участки. Это делает российскую сеть одной из крупнейших в мире — третьей после США и Китая.\n\nДля понимания масштаба: если все российские пути разложить в одну линию, они бы дважды опоясали экватор. Протяжённость Транссибирской магистрали — основной магистрали страны — составляет около 9 200 км, что делает её самой длинной железной дорогой в мире.\n\nЭлектрифицированные участки (44 300 км) обеспечивают более эффективную и экологичную эксплуатацию. Электрическая тяга потребляет меньше энергии, не даёт выбросов и обеспечивает более высокую скорость и грузоподъёмность по сравнению с дизельной тягой.\n\nНовая инфраструктура активно развивается: в 2025 году было введено в эксплуатацию 1 057 км новых и модернизированных путей. Это позволяет увеличить пропускную способность наиболее нагруженных направлений и сократить время доставки грузов."}, {"id": "2.3", "points": 20, "question": "Какая доля грузооборота и пассажирооборота России приходится на инфраструктуру РЖД?", "options": ["А) 25% грузооборота и 15% пассажирооборота", "Б) 35% грузооборота и 20% пассажирооборота", "В) 44,8% грузооборота и 27,1% пассажирооборота", "Г) 60% грузооборота и 40% пассажирооборота"], "answer": "В) 44,8% грузооборота и 27,1% пассажирооборота**", "explanation": "На инфраструктуру ОАО «РЖД» приходится 44,8% общего грузооборота и 27,1% пассажирооборота России. Эти цифры наглядно демонстрируют, что железнодорожный транспорт является основой логистической системы страны.\n\nДоля в грузообороте почти 45% означает, что каждая вторая тонна груза, перемещаемая по территории России, перевозится по железной дороге. Это связано с тем, что для длинных расстояний (а Россия — самая большая страна мира) железнодорожный транспорт является наиболее экономически эффективным видом транспорта.\n\nДоля в пассажирообороте (27,1%) включает как дальние и пригородные перевозки, так и движение в метрополитенах, которые также принадлежат РЖД. Дальнее следование остаётся востребованным: поезда «Сапсан», «Ласточка», «Стриж» и обычные поезда перевозят миллионы пассажиров ежегодно.\n\nСравнение с другими видами транспорта показывает уникальность железнодорожного транспорта: по воздуху перевозится менее 1% грузов, по воде — около 5%, по трубопроводам — более 50%, но только несыпучие жидкости и газ. Железная дорога остаётся единственным универсальным транспортом, способным перевозить любые виды грузов на любые расстояния."}, {"id": "2.4", "points": 20, "question": "Какова ширина колеи российских железных дорог?", "options": ["А) 1 435 мм", "Б) 1 520 мм", "В) 1 668 мм", "Г) 1 600 мм"], "answer": "Б) 1 520 мм**", "explanation": "Ширина колеи российских железных дорог составляет 1 520 мм. Это шире, чем европейский стандарт (1 435 мм) и уже, чем испанско-португальская колея (1 668 мм). Выбор ширины колеи — историческое решение, принятое более 150 лет назад.\n\nШирокая колея обеспечивает несколько важных преимуществ: большую устойчивость вагонов на поворотах, более высокую грузоподъёмность вагонов, возможность размещения более мощного подвижного состава. Вагоны на российской колее могут быть длиннее и тяжелее, что увеличивает эффективность перевозок.\n\nИсторически считается, что широкая колея была выбрана как военная мера: поездам с колеёй 1 435 мм было бы затруднено движение по российским путям. Однако основной причиной были инженерные расчёты: более широкая колея обеспечивала лучшую устойчивость для тяжёлых составов в суровых климатических условиях.\n\nСегодня ширина колеи 1 520 мм является стандартом для стран бывшего СССР (кроме Грузии и прибалтийских государств). На стыке с европейской колеёй работают специальные комплексы перевода, которые меняют тележки вагонов — это позволяет грузам беспрепятственно следовать из Европы в Россию и обратно."}, {"id": "2.5", "points": 30, "question": "Кто является единственным учредителем и акционером ОАО «РЖД»?", "options": ["А) Частные инвесторы", "Б) Российская Федерация (государство)", "В) Международный консорциум", "Г) Топ-менеджеры компании"], "answer": "Б) Российская Федерация (государство)**", "explanation": "ОАО «РЖД» является государственной компанией: единственным учредителем и 100% акционером выступает Российская Федерация. Это означает, что вся прибыль компании направляется на развитие инфраструктуры и обеспечение транспортной доступности для всех граждан страны.\n\nГосударственная форма собственности определяет стратегические приоритеты РЖД: компания работает не только на коммерческую прибыль, но и на выполнение социальной миссии. Это проявляется в поддержании тарифов на пассажирские перевозки на доступном уровне, обеспечении транспортного обслуживания отдалённых регионов, развитии детских железных дорог.\n\nДля сравнения: в Европе многие железные дороги приватизированы (British Rail, Deutsche Bahn частично). В России государственная форма собственности позволяет координировать развитие железнодорожного транспорта с общенациональными стратегическими целями.\n\nСтатус государственной компании создаёт для РЖД особую ответственность: компания должна обеспечивать транспортную связность территории России — от Калининграда до Владивостока. В условиях, когда Россия является крупнейшей страной мира с уникальными климатическими и географическими условиями, железная дорога остаётся единственным видом транспорта, способным обеспечить надёжную транспортную связь между всеми регионами страны."}, {"id": "3.1", "points": 10, "question": "Какие два типа тягового тока используются на железных дорогах России?", "options": ["А) Постоянный 1 500 В и переменный 10 000 В", "Б) Постоянный 3 000 В и переменный 25 000 В", "В) Постоянный 5 000 В и переменный 50 000 В", "Г) Только переменный 25 000 В"], "answer": "Б) Постоянный 3 000 В и переменный 25 000 В**", "explanation": "На железных дорогах России используются два типа тягового тока: постоянный ток напряжением 3 000 В и переменный ток напряжением 25 000 В. Выбор типа тока определяется условиями эксплуатации и мощностью потребляемой энергии.\n\nПостоянный ток 3 000 В применяется на участках с небольшими расстояниями между тяговыми подстанциями. Локомотивы на постоянном токе (серия ВЛ10, ВЛ11) получают ток непосредственно от контактной сети через токоприёмник. Преимущества: простота конструкции локомотива, высокая пусковая тяга.\n\nПеременный ток 25 000 В является более распространённым на современной сети. Высокое напряжение позволяет передавать большую мощность на значительные расстояния, снижая потери в контактной сети. Локомотивы на переменном токе (ЭП1, ВЛ80, 2ЭС5К) оснащены преобразователями, которые понижают напряжение и преобразуют ток.\n\nСовмещённая система (участки с обоими типами тока) позволяет эксплуатировать локомотивы на обоих типах тока, увеличивая гибкость использования парка. Инфраструктура РЖД включает как электрифицированные участки с постоянным, так и с переменным током, что является уникальным инженерным решением."}, {"id": "3.2", "points": 10, "question": "Какое устройство на локомотиве собирает ток с контактной проводки?", "options": ["А) Генератор", "Б) Трансформатор", "В) Токоприёмник", "Г) Конвертер"], "answer": "В) Токоприёмник**", "explanation": "Токоприёмник (на жаргоне — «пантограф» или «колокол») — устройство на крыше локомотива, которое собирает электрический ток от контактной проводки и передаёт его в электрооборудование локомотива. Это ключевой элемент системы электрической тяги.\n\nКонтактная проводка имеет специальное поперечное сечение, которое не является идеально круглым. Такая форма предотвращает задирание токоприёмника и обеспечивает равномерный износ контактной поверхности. Благодаря этому токоприёмник движется по проводу, не соскакивая с него даже на высокой скорости.\n\nТокоприёмник работает в экстремальных условиях: температура от −40°C до +40°C, скорость до 200 км/ч и выше, постоянная вибрация. Современные токоприёмники изготавливаются из углеграфитовых контактов, которые обеспечивают отличную электропроводность и износостойкость.\n\nНа каждом локомотиве установлены два токоприёмника — основной и запасной. При неисправности основного автоматически поднимается запасной. Это обеспечивает надёжность электроснабжения: даже при поломке одного токоприёмника локомотив может продолжить движение."}, {"id": "3.3", "points": 20, "question": "Что такое «электрическая централизация» (ЭЦ)?", "options": ["А) Система освещения на станциях", "Б) Система управления стрелочными переводами и сигналами на станциях из централизованного поста", "В) Тип электрического локомотива", "Г) Система контроля температуры в вагонах"], "answer": "Б) Система управления стрелочными переводами и сигналами на станциях из централизованного поста**", "explanation": "Электрическая централизация (ЭЦ) — система диспетчерского управления стрелочными переводами и сигналами на железнодорожных станциях. Она позволяет одному диспетчеру управлять всеми стрелками и сигналами станции из одного централизованного поста.\n\nПринцип работы ЭЦ: стрелочные переводы и сигналы соединены с диспетчерским пультом электрическими цепями. Диспетчер, наблюдая за схемой станции на пульте, может переключать стрелки и управлять сигналами нажатием кнопок. Система контролирует правильность и безопасность маневровых передвижений.\n\nДо появления ЭЦ стрелками управляли вручную — специальные работники переводили стрелки на местах. Это требовало большого числа персонала и было связано с рисками. ЭЦ обеспечила безопасность и эффективность: один диспетчер заменяет десятки работников.\n\nСовременная ЭЦ работает на микропроцессорной основе и включает системы контроля, диагностики и записи маневров. Каждое переключение стрелки или изменение сигнала автоматически фиксируется, что обеспечивает прозрачность и возможность анализа работы станции."}, {"id": "3.4", "points": 20, "question": "Сколько было инвестировано в ЖАТ и двухстороннюю автоблокировку в 2025 году?", "options": ["А) 1,2 млрд ₽", "Б) 2,7 млрд ₽", "В) 5,5 млрд ₽", "Г) 8,0 млрд ₽"], "answer": "Б) 2,7 млрд ₽**", "explanation": "В 2025 году ОАО «РЖД» инвестировало 2,7 млрд рублей в развитие железнодорожной автоматики и телемеханики (ЖАТ) и двухстороннюю автоблокировку. Эти инвестиции направлены на повышение пропускной способности и безопасности движения.\n\nЖАТ включает системы автоматической блокировки, централизации, контроля состояния путей и устройств связи. Развитие этих систем позволяет увеличить количество поездов на участке без снижения безопасности — это критически важно для загруженных направлений.\n\nДвухсторонняя автоблокировка — система, при которой один и тот же участок пути может использоваться для движения поездов в обоих направлениях. Обычно каждый путь используется для движения в одном направлении, но двухсторонняя АБУ позволяет использовать один путь для поездов, следующих в обоих направлениях.\n\nИнвестиции в размере 2,7 млрд рублей позволяют модернизировать десятки километров инфраструктуры, внедрить современные микропроцессорные системы управления и повысить пропускную способность наиболее загруженных участков сети РЖД."}, {"id": "3.5", "points": 30, "question": "Что такое «двусторонняя автоблокировка» и почему она важна?", "options": ["А) Система, которая разрешает движение поездов только в одну сторону", "Б) Система, которая позволяет поездам следовать в обоих направлениях на одном участке пути, увеличивая пропускную способность", "В) Система автоматического торможения поездов", "Г) Система контроля за скоростью поездов на спусках"], "answer": "Б) Система, которая позволяет поездам следовать в обоих направлениях на одном участке пути, увеличивая пропускную способность**", "explanation": "Двусторонняя автоблокировка (двусторонняя АБУ) — система сигнализации, которая позволяет поездам следовать в обоих направлениях по одному и тому же участку пути. Это принципиальное отличие от обычной автоблокировки, где каждый путь используется только для движения в одном направлении.\n\nВ обычной автоблокировке каждый путь предназначен для движения в одном направлении: один путь — «от Москвы», другой — «к Москве». Двусторонняя АБУ позволяет поездам двигаться в обоих направлениях по одному пути, что значительно увеличивает пропускную способность линии.\n\nВажность двусторонней АБУ определяется несколькими факторами: она позволяет увеличить количество поездов на участке без строительства новых путей; обеспечивает гибкость управления движением при нарушении графика; повышает устойчивость системы при возникновении нештатных ситуаций.\n\nДвусторонняя АБУ особенно ценна на однопутных участках, где нет возможности увеличить число путей. Она также полезна в горных условиях, где строительство дополнительных путей крайне затруднено. Система работает на основе принципа автоматической блокировки, но с дополнительными устройствами, обеспечивающими безопасность движения в обоих направлениях."}, {"id": "4.1", "points": 10, "question": "Сколько детских железных дорог существует в России?", "options": ["А) 10", "Б) 18", "В) 26", "Г) 35"], "answer": "В) 26**", "explanation": "В России действуют 26 детских железных дорог — уникальных учебных объектов, на которых дети и подростки осваивают профессии железнодорожников. Каждая детская железная дорога имеет собственную инфраструктуру: станции, платформы, переезды, локомотивы и вагоны.\n\nСтарейшей является Красноярская детская железная дорога, открытая в 1936 году. Она стала первой детской железной дорогой в СССР и послужила образцом для создания аналогичных объектов по всей стране. За 90 лет Красноярская ДЖД подготовила тысячи будущих железнодорожников.\n\nДетские железные дороги выполняют несколько функций: профориентация (знакомство детей с железнодорожными профессиями), дополнительное образование (обучение основам железнодорожного дела), патриотическое воспитание (формирование уважения к профессии и истории железной дороги).\n\nНа детских железных дорогах дети работают машинистами, проводниками, диспетчерами, путейцами — осваивают реальные профессии под руководством взрослых наставников. Многие выпускники детских железных дорог впоследствии связывают свою жизнь с РЖД."}, {"id": "4.2", "points": 10, "question": "На каком вокзале перроны расположены на втором этаже, а не на первом?", "options": ["А) Московский вокзал (СПб)", "Б) Ленинградский вокзал (Москва)", "В) Витебский вокзал (СПб)", "Г) Курский вокзал (Москва)"], "answer": "В) Витебский вокзал (СПб)**", "explanation": "Витебский вокзал в Санкт-Петербурге — единственный вокзал в России, где перроны расположены на втором этаже. Здание вокзала было построено в 1902 году и стало первым вокзалом в стране, оснащённым лифтами для перевозки багажа.\n\nАрхитектурное решение — размещение перронов на втором этаже — было продиктовано особенностями рельефа местности и необходимостью обеспечить удобную стыковку с городским транспортом. Пассажиры поднимаются на платформу по лестницам или на эскалаторах, что создаёт необычное впечатление по сравнению с обычными вокзалами.\n\nВитебский вокзал обслуживает поезда, следующие в направлении Минска, Витебска, Киева и других городов. Он является важным транспортным узлом Санкт-Петербурга и ежедневно обслуживает десятки тысяч пассажиров.\n\nДля студентов Витебский вокзал интересен как пример уникального архитектурного и инженерного решения, которое применяется уже более 120 лет и продолжает успешно функционировать."}, {"id": "4.3", "points": 20, "question": "Что должно быть в руках у проводника при отправлении поезда?", "options": ["А) Красный флажок", "Б) Жёлтый флажок", "В) Зелёный флажок", "Г) Белый флаг"], "answer": "Б) Жёлтый флажок**", "explanation": "При отправлении поезда проводник обязан держать в руках жёлтый флажок. Свёрнутый жёлтый флажок означает, что поезд готов к отправлению, все пассажиры на месте, и можно отходить от станции.\n\nЕсли проводник развёртывает красный флажок — это сигнал диспетчеру и машинисту: отмена отправки, нештатная ситуация, необходимо остановиться. Красный флажок является абсолютным запретом на отправку поезда.\n\nСистема сигнальных флажков является простым, но надёжным способом визуального контроля готовности поезда к отправке. В условиях, когда технические системы могут дать сбой, простой жёлтый флажок остаётся гарантом безопасности.\n\nПравило использования сигнальных флажков закреплено в технических указаниях по организации движения поездов. Проводники проходят специальное обучение по работе с сигнальными средствами, что является частью их профессиональной подготовки."}, {"id": "4.4", "points": 20, "question": "Как называется перекрёстный стрелочный перевод на четыре направления?", "options": ["А) «Американка»", "Б) «Англичанка»", "В) «Немка»", "Г) «Француженка»"], "answer": "Б) «Англичанка»**", "explanation": "Перекрёстный стрелочный перевод, известный в народе как «англичанка», представляет собой уникальное инженерное сооружение, которое обеспечивает переход с двух путей на четыре направления. Такой стрелочный перевод был разработан английскими производителями, откуда и получил своё название.\n\n«Англичанка» применяется на сложных станционных узлах, где необходимо обеспечить максимальную гибкость маневрирования. Она позволяет поездам с любого из двух путей попасть на любой из четырёх направлений, что значительно расширяет возможности станции.\n\nКонструкция перекрёстного перевода сложнее обычного стрелочного перевода: она включает несколько стыковых остряков и крестовину, обеспечивающую плавный переход с одного пути на другой. Это требует высокой точности изготовления и монтажа.\n\nСегодня «англичанки» применяются на крупных сортировочных станциях и узловых пунктах сети РЖД. Несмотря на появление более современных решений (путь-путь), перекрёстные переводы остаются важным элементом инфраструктуры, обеспечивая гибкость и эффективность маневровой работы."}, {"id": "4.5", "points": 30, "question": "Какая профессия на железной дороге связана с прогнозированием погоды?", "options": ["А) Машинист", "Б) Диспетчер", "В) Синоптик", "Г) Путеец"], "answer": "В) Синоптик**", "explanation": "Синоптик — специалист железнодорожной службы, который занимается прогнозированием погоды и оценкой её влияния на работу инфраструктуры. У РЖД есть собственная метеослужба, которая обеспечивает все направления сети актуальными прогнозами.\n\nРабота железнодорожного синоптика уникальна: он должен не просто предсказать погоду, но и оценить, как она повлияет на конкретные участки пути. Снег может заблокировать переезды, гололедица — снизить скорость движения, сильный ветер — повредить контактную сеть. Синоптик должен предвидеть все эти факторы и заблаговременно предупредить службы.\n\nМетеослужба РЖД использует собственную сеть метеостанций, спутниковые данные и результаты компьютерного моделирования. Прогнозы составляются с высокой точностью и обновляются каждые несколько часов — для оперативного принятия решений.\n\nДля студентов факт наличия собственной метеослужбы у железной дороги является неожиданным: большинство людей не задумываются о том, кто и как предсказывает погоду для поездов. А ведь от точности прогноза зависит безопасность тысяч пассажиров и сохранность миллиардов рублей грузов."}]}, {"name": "Будущее", "categories": ["Взгляд за горизонт", "Локомотивы", "Организация перевозок", "Разное"], "questions": [{"id": "1.1", "points": 10, "question": "Как называется концепция, которая предполагает создание полной цифровой копии транспортного процесса — от поезда до инфраструктуры — способной в реальном времени рассчитывать последствия любых изменений и прогнозировать развитие событий?", "options": ["А) Цифровой двойник транспортного процесса", "Б) Алгоритм автономного управления", "В) Система предиктивного анализа", "Г) Модель цифровой логистики"], "answer": "А) Цифровой двойник транспортного процесса**", "explanation": "Цифровой двойник транспортного процесса — это одна из наиболее амбициозных технологических инициатив ОАО «РЖД», заложенная в стратегию развития компании до 2050 года. Суть концепции заключается в создании полной виртуальной копии железнодорожной сети, которая воспроизводит все ключевые параметры реальной инфраструктуры: рельсовый путь, подвижной состав, системы сигнализации, пассажиропотоки и грузоперевозки. При этом цифровой двойник способен в режиме реального времени обрабатывать данные и прогнозировать последствия любых изменений в сети — от ремонта отдельного участка до запуска нового маршрута.\n\nСогласно отчётам ОАО «РЖД» за 2023–2025 годы, к 2025 году в компании уже работают более 30 промышленных digital twin решений, охватывающих ключевые бизнес-процессы. Однако создание полноценного двойника транспортного процесса является задачей перспективной и планируется к завершению к 2050 году. Это связано с колоссальным объёмом данных: сеть ОАО «РЖД» насчитывает более 85 600 километров путей, а ежедневно по ним следуют тысячи поездов.\n\nЦифровой двойник позволит кардинально повысить эффективность управления сетью. Вместо традиционного планирования, основанного на статических моделях, компания сможет моделировать сценарии развития событий с учётом погодных условий, сезонных колебаний спроса, ремонтных работ и непредвиденных ситуаций. По оценкам экспертов, внедрение данной технологии может сократить простои поездов на 15–20 % и увеличить пропускную способность сети на 25–30 %.\n\nТехнологическая основа для создания цифрового двойника формируется уже сегодня. Компания активно развивает платформу «Цифровая среда», интегрирует данные из систем АСУ ТП, использует технологии интернета вещей (IoT) для сбора информации с инфраструктурных объектов и применяет методы искусственного интеллекта для обработки полученных данных. Все эти элементы в совокупности составляют фундамент будущего цифрового двойника транспортного процесса."}, {"id": "1.2", "points": 10, "question": "Что такое «виртуальное сцепление» поездов?", "options": ["А) Автоматическое соединение вагонов в составе без участия маневрового локомотива", "Б) Управление двумя и более поездами как единой системой с минимальным интервалом движения", "В) Использование специальных магнитных сцепок для увеличения скорости", "Г) Централизованное управление составами из удалённого диспетчерского центра"], "answer": "Б) Управление двумя и более поездами как единой системой с минимальным интервалом движения**", "explanation": "Виртуальное сцепление — это передовая технология, которая позволяет объединять два и более поезда в единую управляемую систему с минимальным интервалом движения между ними. В отличие от физической сцепки, при которой вагоны соединяются механически, виртуальное сцепление реализуется исключительно программными средствами: поезда движутся следом друг за другом с дистанцией всего в несколько десятков метров, но управляются как один состав.\n\nПо данным ОАО «РЖД» за 2025 год, объём перевозок в формате виртуального сцепления составил 88 800 отправок, что на 17,1 % превысило показатель предыдущего года. Данная технология нашла широкое применение на_heapмпnonce сегментах сети, где она позволяет увеличить пропускную способность до 15 дополнительных пар поездов в сутки без прокладки новых путей и строительства дополнительной инфраструктуры.\n\nПринцип работы технологии основан на использовании систем автоматического управления поездом (АСУ П) и высокоточной навигации. Локомотив-автомат следит за расстоянием до идущего впереди поезда и автоматически регулирует скорость, обеспечивая безопасный интервал. Ведущий локомотив выполняет роль «мозга»整个 системы, а ведомые следуют заданному профилю движения.\n\nЭкономический эффект от внедрения виртуального сцепления相当显著. По оценкам специалистов компании, данная технология позволяет увеличить пропускную能力 сети без капитальных вложений в строительство новой инфраструктуры. В частности, на участках с высокой плотностью движения грузовых поездов виртуальное сцепление становится одним из ключевых инструментов оптимизации перевозочного процесса и повышения эффективности использования существующей инфраструктуры."}, {"id": "1.3", "points": 20, "question": "Какую максимальную скорость будет развивать первая российская высокоскоростная магистраль (ВСМ) Москва — Санкт-Петербург?", "options": ["А) Более 250 км/ч", "Б) Более 300 км/ч", "В) Более 320 км/ч", "Г) Более 350 км/ч"], "answer": "В) Более 320 км/ч**", "explanation": "Первая российская высокоскоростная магистраль Москва — Санкт-Петербург будет эксплуатироваться на максимальной скорости более 320 километров в час. Это делает её одной из самых быстрых действующих железнодорожных линий в мире и знаменует собой начало новой эры российского железнодорожного транспорта. Поезд будет состоять из 8 вагонов и вмещать 452 пассажира, обеспечивая комфортабельные условия перевозки на маршруте протяжённостью около 680 километров.\n\nСоздание высокоскоростного поезда для ВСМ является масштабным инженерным проектом, в который вовлечены более 150 предприятий и организаций. В разработку и производство вовлечены ведущие российские конструкторские бюро, научно-исследовательские институты и промышленные предприятия. Общая численность специалистов, занятых в проекте, превышает 500 инженеров и конструкторов.\n\nПоезд разрабатывается с учётом международного опыта эксплуатации высокоскоростных магистралей, однако адаптирован к специфическим климатическим и географическим условиям России. В частности, подвижной состав рассчитан на эксплуатацию при температурах от минус 40 до плюс 40 градусов по Цельсию и способен преодолевать значительные перепады высот на трассе.\n\nЗапуск регулярного движения по ВСМ Москва — Санкт-Петербург запланирован на 2028–2029 годы. По оценкам аналитиков, время в пути составит около 2 часов 15 минут, что более чем вдвое сократит текущую продолжительность поездки между двумя столицами. В перспективе технология высокоскоростных перевозок может быть распространена и на другие направления, включая маршруты Москва — Казань, Москва — Екатеринбург и другие."}, {"id": "1.4", "points": 20, "question": "Какие три горизонта технологического развития ОАО «РЖД» определены в стратегии компании?", "options": ["А) Автоматизация до 2030 г., цифровое пространство 2031–2040 гг., цифровой двойник 2041–2050 гг.", "Б) Цифровизация до 2028 г., роботизация 2029–2035 гг., автономность 2036–2050 гг.", "В) Развитие ИИ до 2032 г., квантовые вычисления 2033–2042 гг., сингулярность 2043–2050 гг.", "Г) Модернизация до 2035 г., инновации 2036–2045 гг., трансформация 2046–2050 гг."], "answer": "А) Автоматизация до 2030 г., цифровое пространство 2031–2040 гг., цифровой двойник 2041–2050 гг.**", "explanation": "Стратегия технологического развития ОАО «РЖД» выделяет три последовательных горизонта, каждый из которых определяет ключевые направления и задачи компании на соответствующий период. Первый горизонт (до 2030 года) посвящён автоматизации и оптимизации существующих бизнес-процессов, второй (2031–2040 гг.) — созданию единого цифрового пространства, а третий (2041–2050 гг.) — формированию полноценного цифрового двойника транспортного процесса.\n\nНа первом горизонте основное внимание уделяется внедрению систем автоматического управления, роботизации трудоёмких процессов и цифровизации ключевых бизнес-процессов. К 2025 году компания уже достигла значительных результатов в данном направлении: запущено более 30 промышленных digital twin решений, внедрены системы предиктивного анализа и развёрнуты сети датчиков на инфраструктурных объектах.\n\nВторой горизонт (2031–2040 гг.) предполагает создание единого цифрового пространства, интегрирующего все информационные системы компании и партнёров. На этом этапе планируется полностью цифровизировать процессы перевозок, обеспечить сквозную прозрачность цепочек поставок и внедрить технологии искусственного интеллекта для принятия управленческих решений.\n\nТретий горизонт (2041–2050 гг.) является наиболее амбициозным и предусматривает создание полноценного цифрового двойника транспортного процесса. Эта технология позволит моделировать и прогнозировать развитие событий в масштабах всей сети в реальном времени, обеспечивая точное планирование и оперативное реагирование на любые изменения. Реализация данной стратегии обеспечит устойчивое развитие железнодорожного транспорта и его конкурентоспособность на долгосрочную перспективу."}, {"id": "1.5", "points": 30, "question": "Какие альтернативные источники энергии для подвижного состава рассматриваются в стратегии ОАО «РЖД»?", "options": ["А) Солнечные батареи, ветрогенераторы, ядерная энергия", "Б) Водород, аккумуляторные батареи, гибридные установки", "В) Геотермальная энергия, энергия приливов, биотопливо", "Г) Пьезоэлектрики, термоэлектрики, суперконденсаторы"], "answer": "Б) Водород, аккумуляторные батареи, гибридные установки**", "explanation": "В стратегии развития ОАО «РЖД» в качестве альтернативных источников энергии для подвижного состава рассматриваются три основных направления: водородные технологии, аккумуляторные батареи и гибридные энергетические установки. Выбор данных технологий обусловлен их практической применимостью в условиях российского климата и технической совместимостью с существующей инфраструктурой.\n\nВодородные технологии представляют особый интерес для компании. Водород может использоваться как в топливных элементах для генерации электроэнергии, так и в качестве топлива для специальных газотурбинных двигателей. По данным ОАО «РЖД», ведутся активные разработки в направлении гибридных локомотивов, способных работать как от контактной сети, так и от автономных источников питания, включая водородные топливные элементы.\n\nАккумуляторные батареи применяются в составе гибридных энергетических установок, позволяющих накапливать энергию при торможении и использовать её для разгона или движения на бесконтактных участках. Данная технология уже нашла практическое применение в маневровых локомотивах серии ЧМЭ3Т и некоторых пассажирских вагонах.\n\nГибридные установки сочетают в себе несколько источников энергии, обеспечивая максимальную гибкость эксплуатации. Например, гибридный локомотив может использовать электроэнергию контактной сети на электрифицированных участках и переходить на автономное питание при движении по неэлектрифицированным линиям. По оценкам специалистов, внедрение альтернативных источников энергии позволит сократить выбросы CO2 на 30–40 % к 2030 году и обеспечить переход к экологически чистому подвижному составу в долгосрочной перспективе."}, {"id": "2.1", "points": 10, "question": "Что означает буквенное обозначение «ВЛ» в маркировке электровозов серии ВЛ80?", "options": ["А) Высоковольтный локомотив", "Б) Владимир Ленин", "В) Всесоюзный локомотив", "Г) Высокоскоростной локомотив"], "answer": "Б) Владимир Ленин**", "explanation": "Буквенное обозначение «ВЛ» в маркировке электровозов серии ВЛ80 расшифровывается как «Владимир Ленин». Данная традиция именования была введена в советское время, когда многие серии локомотивов получали названия в честь выдающихся государственных и политических деятелей, а также городов и регионов. Серия ВЛ80 является одной из самых массовых и распространённых серий грузовых электровозов на железных дорогах бывшего Советского Союза.\n\nЭлектровоз ВЛ80 был разработан в 1960-х годах и серийно производился на Таганрогском и Новочеркасском заводах электровозостроения. За время выпуска было изготовлено более 12 000 единиц подвижного состава данной серии, что делает ВЛ80 наиболее произведённым грузовым электровозом в истории российской железнодорожной отрасли. Локомотивы этой серии эксплуатируются на магистральных маршрутах и обеспечивают перевозку основной массы грузов.\n\nКлючевыми техническими характеристиками ВЛ80 являются мощность до 6 520 кВт и способность вести поезда весом до 6 000 тонн на подъёмах до 15 промилле. Электровоз оснащён четырьмя двухосными тележками с индивидуальным приводом каждого колёсного пары, что обеспечивает высокое тяговое усилие и надёжную сцепку с рельсовым путём.\n\nНа сегодняшний день электровозы серии ВЛ80 продолжают оставаться основными тяговыми единицами на многих направлениях сети ОАО «РЖД». Несмотря на появление более современных локомотивов, ВЛ80 зарекомендовал себя как надёжный и неприхотливый в эксплуатации подвижной состав, способный работать в широком диапазоне климатических условий и выдерживать значительные эксплуатационные нагрузки."}, {"id": "2.2", "points": 10, "question": "Какой тип тяги характерен для локомотивов серии ТЭМ?", "options": ["А) Электрическая тяга от контактной сети", "Б) Дизельная тяга с электрической передачей", "В) Дизельная тяга с механической передачей", "Г) Тепловозная тяга с гидравлической передачей"], "answer": "Б) Дизельная тяга с электрической передачей**", "explanation": "Локомотивы серии ТЭМ относятся к классу маневровых тепловозов и используют дизельную тягу с электрической передачей. Данная конструкция предполагает, что дизельный двигатель приводит в действие генератор, вырабатывающий электрическую энергию, которая затем подаётся на тяговые электродвигатели, расположенные на колёсных парах локомотива. Такая схема обеспечивает плавную регулировку тягового усилия и высокую маневренность.\n\nСерия ТЭМ была разработана в 1960-х годах специально для выполнения маневровых работ на железнодорожных станциях и в портовых терминалах. Локомотивы этой серии отличаются компактными размерами, высокой тяговой характеристикой на малых скоростях и способностью работать на кривых с малым радиусом, что является essential для маневровой работы.\n\nНа протяжении десятилетий серия ТЭМ постоянно модернизировалась. Были выпущены различные модификации с увеличенной мощностью, улучшенными тяговыми характеристиками и модернизированными системами управления. Современные локомотивы серии ТЭМ оснащаются микропроцессорными системами контроля и управления, что повышает их надёжность и экономичность.\n\nПо данным ОАО «РЖД», локомотивы серии ТЭМ по-прежнему составляют значительную часть маневрового парка компании. Они эксплуатируются на крупнейших железнодорожных станциях и обеспечивают формирование и расформирование грузовых поездов, подачу и уборку вагонов на промышленных предприятиях, а также выполнение других маневровых операций, необходимых для бесперебойной работы транспортной системы."}, {"id": "2.3", "points": 20, "question": "Как называется система, позволяющая управлять несколькими локомотивами из одной кабины?", "options": ["А) Система дистанционного управления (СДУ)", "Б) Система множественных единиц (СМЕ)", "В) Автоматизированная система управления (АСУ)", "Г) Система параллельного вождения (СПВ)"], "answer": "Б) Система множественных единиц (СМЕ)**", "explanation": "Система множественных единиц (СМЕ) — это технология, которая позволяет объединять несколько локомотивов в единый тяговый комплекс и управлять всеми ими из одной кабины машиниста. При этом локомотивы могут располагаться в разных частях поезда — в голове, хвосте или середине состава — и обеспечивать синхронную работу всех тяговых единиц.\n\nПринцип работы СМЕ основан на использовании специальных кабелей связи и блоков управления, которые передают команды машиниста от ведущего локомотива к ведомым. Ведомые локомотивы получают сигналы о необходимости увеличения или уменьшения тягового усилия, торможения и других операциях и выполняют их автоматически, обеспечивая синхронную работу всей группы.\n\nСистема СМЕ широко применяется на железных дорогах России для увеличения веса грузовых поездов без необходимости увеличения длины отдельного локомотива. На отдельных направлениях с высоким грузопотоком используютсяroups из двух, трёх и более локомотивов, управляемых по системе СМЕ, что позволяет формировать поезда весом до 10 000 тонн и более.\n\nПрименение системы СМЕ обладает значительными экономическими преимуществами. Одна бригада машинистов может управлять несколькими локомотивами, что снижает трудозатраты на перевозки. Кроме того, распределение тяговой нагрузки по длине поезда уменьшает износ рельсового пути и подвижного состава, а также повышает безопасность движения за счёт равномерного распределения тормозных усилий."}, {"id": "2.4", "points": 20, "question": "Какой вид ремонта выполняется при пробеге локомотива 1 800 тысяч километров?", "options": ["А) Текущий ремонт (ТР)", "Б) Капитальный ремонт (КР)", "В) Средний ремонт (СР)", "Г) Периодический ремонт (ПР)"], "answer": "В) Средний ремонт (СР)**", "explanation": "Средний ремонт (СР) выполняется при достижении локомотивом пробега 1 800 тысяч километров и представляет собой комплекс работ по восстановлению работоспособности подвижного состава. Данный вид ремонта является промежуточным между текущим ремонтом (ТР) и капитальным ремонтом (КР) и направлен на замену изношенных узлов и деталей, восстановление основных технических характеристик локомотива.\n\nВ ходе среднего ремонта выполняется полная разборка основных агрегатов: дизельного двигателя (для тепловозов), тяговых электродвигателей, вспомогательных машин, тормозного оборудования и системы управления. Проводится дефектация всех деталей с целью выявления износа и повреждений, после чего выполняется замена или восстановление изношенных элементов.\n\nПо данным ОАО «РЖД», средний ремонт является одним из наиболее востребованных видов технического обслуживания подвижного состава. Компания располагает сетью специализированных депо и ремонтных баз, оснащённых необходимым оборудованием для выполнения данных работ. Сроки выполнения среднего ремонта составляют от 15 до 30 суток в зависимости от типа локомотива и объёма работ.\n\nСоблюдение регламента среднего ремонта является essential для обеспечения безопасности и надёжности эксплуатации локомотивов. Пробег в 1 800 тысяч километров определён на основании статических данных о ресурсе основных узлов и агрегатов и представляет собой оптимальный интервал для проведения комплексного технического обслуживания, позволяющего сохранить работоспособность подвижного состава до следующего капитального ремонта."}, {"id": "2.5", "points": 30, "question": "Что такое аддитивное производство в контексте железнодорожного транспорта?", "options": ["А) Метод Manufacture композитных материалов для вагонов", "Б) Технология 3D-печати деталей непосредственно в депо", "В) Система автоматической сборки вагонов на конвейере", "Г) Процесс нанесения защитных покрытий на рельсы"], "answer": "Б) Технология 3D-печати деталей непосредственно в депо**", "explanation": "Аддитивное производство в контексте железнодорожного транспорта представляет собой технологию изготовления деталей методом послойного наращивания материала — 3D-печати. Данная технология позволяет создавать запасные части и комплектующие непосредственно в депо и ремонтных базах ОАО «РЖД», что существенно сокращает сроки поставки и снижает себестоимость запасных частей.\n\nПо данным ОАО «РЖД» за 2023–2025 годы, компания активно развивает направление аддитивного производства и уже внедрила данную технологию на ряде предприятий. С помощью 3D-принтеров изготавливаются детали из металлических сплавов, полимеров и композитных материалов, которые используются при ремонте и техническом обслуживании подвижного состава и инфраструктурных объектов.\n\nОсновным преимуществом аддитивного производства является возможность быстрого изготовления деталей по индивидуальному заказу без необходимости изготовления дорогостоящей оснастки и инструмента. Это особенно важно для редких и устаревших типов подвижного состава, запчасти для которых сняты с производства или доступны только от поставщиков за рубежом.\n\nТехнология аддитивного производства также открывает возможности для создания оптимизированных конструкций деталей с улучшенными эксплуатационными характеристиками. С помощью компьютерного моделирования и 3D-печати можно изготовить детали с уникальной геометрией, обеспечивающей повышенную прочность, снижение веса и улучшение теплопередачи. По прогнозам специалистов, к 2030 году аддитивное производство станет стандартным инструментом технического обслуживания на железнодорожном транспорте."}, {"id": "3.1", "points": 10, "question": "Как называется график движения поездов, который является основным планом работы всей сети?", "options": ["А) Суточный график", "Б) График движения поездов (ГДП)", "В) Технический график", "Г) Эксплуатационный план"], "answer": "Б) График движения поездов (ГДП)**", "explanation": "График движения поездов (ГДП) — это поездной распорядок всей сети, где для каждого поезда заданы нитки движения по времени. ГДП увязывает работу локомотивов, бригад и станций. Это главный документ, по которому работает вся железнодорожная сеть.\n\nГДП строится так, чтобы пропускная способность и скорость движения были сбалансированы. Каждый поезд на графике — это «нитка», которая показывает время отправления, прибытия и проследования каждого раздельного пункта.\n\nДля студентов важно понимать: ГДП — это не просто таблица расписания. Это результат сложнейшей оптимизационной задачи, в которой учитываются возможности инфраструктуры, мощность тяги, потребности грузоотправителей и пассажиров, а также ресурс подвижного состава."}, {"id": "3.2", "points": 10, "question": "Какой уровень управления отвечает за сетевое планирование перевозок?", "options": ["А) ДС — линейный уровень (станция)", "Б) Д — дорожный уровень (железная дорога)", "В) П — полигонный уровень", "Г) ЦД — сетевой уровень (Центральная дирекция)"], "answer": "Г) ЦД — сетевой уровень**", "explanation": "Центральная дирекция управления движением (ЦД) — это сетевой уровень управления перевозками. Здесь принимаются решения, которые касаются работы всей сети РЖД, а не отдельного участка или дороги.\n\nУровни управления распределены иерархически: ДС (станция) решает задачи по расстановке поездов на путях; Д (дорога) координирует движение поездов в пределах одной железной дороги; П (полигон) управляет смежными дорогами; ЦД — весь масштаб сети.\n\nТекущее планирование ведётся в трёхчасовых периодах с прогнозом на шесть часов. Сменно-суточное планирование охватывает двенадцатичасовые периоды."}, {"id": "3.3", "points": 20, "question": "Что такое оборот вагона и почему он является ключевым показателем?", "options": ["А) Время, за которое вагон проходит один круг по маршруту", "Б) Время полного цикла вагона от погрузки до следующей погрузки", "В) Количество вагонов, прошедших через станцию за сутки", "Г) Стоимость содержания одного вагона в год"], "answer": "Б) Время полного цикла от погрузки до погрузки**", "explanation": "Оборот вагона — время полного цикла от погрузки до следующей погрузки. Это ключевой показатель эффективности грузовых перевозок: чем короче оборот, тем больше груза может перевезти один вагон за единицу времени.\n\nЦикл вагона включает: погрузку, отправление, следование, прибытие, выгрузку, порожнее следование, постановку под погрузку. Каждый элемент цикла — это время и деньги.\n\nВ 2025 году РЖД удалось ускорить оборот вагона и исключить из процесса 193 тыс. лишних порожних вагонов. Это дало рост скорости доставки до 494,5 км/сут — на 21,9% больше, чем в 2024 году."}, {"id": "3.4", "points": 20, "question": "Какие показатели определяют качество работы грузового железнодорожного транспорта?", "options": ["А) Только скорость поезда", "Б) Участковая и техническая скорость, среднесуточный пробег, производительность вагона и локомотива", "В) Количество поездов в сутки", "Г) Только стоимость перевозки"], "answer": "Б) **", "explanation": "Качество работы грузового транспорта определяется комплексом показателей: оборот вагона, участковая и техническая скорость, рейс вагона, среднесуточный пробег, производительность вагона и локомотива, коэффициент порожнего пробега.\n\nУчастковая скорость — средняя скорость поезда на участке с учётом остановок. Техническая скорость — средняя скорость без учёта стоянок. В 2025 году участковая скорость грузовых поездов — 38,7 км/ч, техническая — 43 км/ч.\n\nКоэффициент порожнего пробега показывает долю вагонов, следующих без груза. Чем ниже этот показатель, тем эффективнее работает система."}, {"id": "3.5", "points": 30, "question": "Какая уникальная линия в России имеет левостороннее движение поездов и почему?", "options": ["А) Москва — Нижний Новгород (построена немцами)", "Б) Москва — Рязань (построена англичанами)", "В) Санкт-Петербург — Москва (построена русскими инженерами)", "Г) Екатеринбург — Челябинск (построена для военных целей)"], "answer": "Б) Москва — Рязань (построена англичанами)**", "explanation": "На линии Москва — Рязань светофоры расположены по левую руку от машиниста. Это единственная магистральная линия в России с левосторонним движением.\n\nМагистраль строили в середине XIX века англичане, и они организовали движение так, как было привычно им — по левой стороне. Когда позже в России были приняты стандарты правостороннего движения, линия осталась исключением.\n\nДля машинистов это создаёт определённые сложности: сигналы светофоров расположены не так, как на остальной сети. Однако за более чем 150 лет существования линии все работники привыкли к этой особенности.\n\nЭто яркий пример того, как исторические решения могут определять технологические стандарты на десятилетия вперёд."}, {"id": "4.1", "points": 10, "question": "Как называется вагон не того направления, случайно попавший в другой состав?", "options": ["А) Заяц", "Б) Косой", "В) Зять", "Г) Чужак"], "answer": "Г) Чужак**", "explanation": "«Чужак» — так железнодорожники называют вагон, который по ошибке попал в состав, следующий не по его назначению. Это профессиональный жаргон, широко используемый на сортировочных станциях.\n\nПричины появления «чужаков»: ошибка при формировании состава, неправильная маркировка вагона, несовпадение данных в документах. На крупных сортировочных станциях, где перерабатываются тысячи вагонов в сутки, такие ситуации неизбежны.\n\n«Чужаков» выявляют при проверке составов. Вагон снимают с поезда и отправляют на правильный путь. Процесс выявления и исправления «чужаков» — важная часть работы приёмщиков поездов и составителей."}, {"id": "4.2", "points": 10, "question": "Какой железнодорожный праздник появился в России в 2023 году?", "options": ["А) День крановщика", "Б) День диспетчера", "В) День машиниста", "Г) День стрелочника"], "answer": "В) День машиниста**", "explanation": "31 марта 2023 года в России впервые отметили новый профессиональный праздник — День машиниста. Хотя праздник появился совсем недавно, сама профессия машиниста считается самой старой на железнодорожном транспорте.\n\nПервые машинисты появились в России в 1837 году, когда открылось движение по Царскосельской железной дороге. С тех пор профессия претерпела колоссальные изменения: от паровозов до электровозов, от ручного управления до компьютеризированных кабин.\n\nВ 2025 году в парке РЖД 12 058 локомотивов, и каждым из них управляет подготовленный машинист. Машинист — не просто водитель поезда. Это специалист, отвечающий за жизнь сотен пассажиров или тысяч тонн груза."}, {"id": "4.3", "points": 20, "question": "Какая железнодорожная станция дважды снималась в фильмах Эльдара Рязанова?", "options": ["А) Лосиноостровская", "Б) Подмосковная", "В) Царицыно", "Г) Фили"], "answer": "А) Лосиноостровская**", "explanation": "Станция Лосиноостровская на Ярославском направлении Московской железной дороги дважды стала «кинозвездой» в фильмах великого режиссёра.\n\nВ «Служебном романе» (1977) одна из героинь жила рядом с Лосиноостровской. Станция появляется в кадре как символ пригородной жизни. В «Вокзале для двоих» (1982) режиссёру нужна была станция с большим количеством поездов. А в одном из эпизодов можно увидеть самого Рязанова — он снялся в роли начальника станции.\n\nСтанция была открыта в 1902 году и названа в честь посёлка Лосиный Остров. Сегодня это крупный узел, обслуживающий десятки тысяч пассажиров ежедневно."}, {"id": "4.4", "points": 20, "question": "Какое историческое событие способствовало появлению аббревиатур на русском языке, в том числе на железной дороге?", "options": ["А) Революция 1905 года", "Б) Революция 1917 года", "В) Картофельные бунты", "Г) Первая мировая война"], "answer": "Г) Первая мировая война**", "explanation": "В Первую мировую войну выросла нагрузка на телеграфные службы, и они потребовали срочного сокращения числа слов в телеграммах. Это стало толчком для широкого распространения аббревиатур в русском языке.\n\nСлужба пути стала называться «П», тяги — «Т», телеграфа — «Ш». Аббревиатуры позволяли передавать информацию в несколько раз быстрее и экономить ограниченные ресурсы телеграфной связи.\n\nЖелезнодорожные аббревиатуры прочно вошли в язык: ПЧ (путевое хозяйство), ТЧ (локомотивное хозяйство), ШЧ (сигнализация и связь), ЭЦ (электрическая централизация), ЖАТ (железнодорожная автоматика и телемеханика)."}, {"id": "4.5", "points": 30, "question": "Какой город стал родоначальником запуска бесплатных туристических электричек «Лыжная стрела»?", "options": ["А) Ленинград", "Б) Свердловск", "В) Хабаровск", "Г) Горький"], "answer": "А) Ленинград**", "explanation": "Пригородный поезд «Лыжная стрела» впервые отправился из Ленинграда в область в январе 1948 года. Поезд превращался в дом отдыха на колесах: после прогулки на лыжах в нём можно было погреться, перекусить и затем вернуться в город.\n\nИдея «Лыжной стрелы» родилась из реальной потребности: в послевоенном Ленинграде лыжный спорт был очень популярен, но добраться до леса зимой было непросто. Пригородный поезд стал решением этой проблемы — бесплатным и удобным.\n\nПоезд состоял из нескольких вагонов, оборудованных для отдыха: в них были печки, чайники, буфеты. Пассажиры могли взять в поезде лыжи и вернуть их обратно. «Лыжная стрела» стала символом заботы о здоровье горожан и показала, как железнодорожный транспорт может служить не только перевозкам, но и досугу."}]}];
const SCORES = [0,0,0,0,0];
const TEAM_NAMES = ['Команда 1','Команда 2','Команда 3','Команда 4','Команда 5'];
const HISTORY = [];
const USED = {};
const PASSWORD = '1234';
let isAuthenticated = false;
let currentRound = 0;
let currentTeam = -1;
let currentCatIdx = -1;
let currentPosIdx = -1;
const COST_MAP = [100,200,300,400,500];

function init(){
  document.getElementById('lock-password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') checkPassword();
  });
}

function checkPassword(){
  const input = document.getElementById('lock-password').value.trim();
  if(input === PASSWORD){
    isAuthenticated = true;
    document.getElementById('lock-error').textContent = '';
    document.getElementById('screen-lock').classList.remove('active');
    document.getElementById('app-header').style.display = 'flex';
    renderSetup();
  } else {
    document.getElementById('lock-error').textContent = 'Неверный пароль. Доступ закрыт.';
    document.getElementById('lock-password').value = '';
    document.getElementById('lock-password').focus();
  }
}

function renderSetup(){
  const c = document.getElementById('setup-teams');
  c.innerHTML = '';
  TEAM_NAMES.forEach((name,i)=>{
    c.innerHTML += '<div class="setup-team"><div class="num">'+(i+1)+'</div><input id="team-name-'+i+'" value="'+name+'" placeholder="Введите название" /></div>';
  });
  document.getElementById('screen-setup').classList.add('active');
}

function finishSetup(){
  TEAM_NAMES.forEach((_,i)=>{
    const v = document.getElementById('team-name-'+i).value.trim();
    if(v) TEAM_NAMES[i] = v;
  });
  document.getElementById('screen-setup').classList.remove('active');
  renderRounds();
  showScreen('screen-rounds');
}

function renderRounds(){
  const g = document.getElementById('rounds-grid');
  g.innerHTML = '';
  ROUNDS.forEach((r,i)=>{
    const total = r.questions.length;
    const used = Object.keys(USED).filter(k=>k.startsWith(i+'-')).length;
    const pct = total?Math.round(used/total*100):0;
    g.innerHTML+='<div class="round-card" onclick="selectRound('+i+')"><div class="num">'+(i+1)+'</div><div class="label">Раунд «'+r.name+'»</div><div class="sub">'+total+' вопросов</div><div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
  });
}

function selectRound(i){ currentRound=i; renderBoard(); showScreen('screen-board'); }

function renderBoard(){
  const r = ROUNDS[currentRound];
  document.getElementById('board-title').textContent = 'Раунд '+(currentRound+1)+' — '+r.name;
  const g = document.getElementById('board-grid');
  g.innerHTML='';
  r.categories.forEach((cat,ci)=>{
    g.innerHTML+='<div class="cat-label">'+cat+'</div>';
    for(let pos=0;pos<5;pos++){
      const key=currentRound+'-'+ci+'-'+pos;
      const used=USED[key];
      const cost=COST_MAP[pos];
      g.innerHTML+='<div class="q-cell '+(used?'used':'')+'" '+(used?'':'onclick="selectQuestion('+ci+','+pos+')"')+'>'+cost+'</div>';
    }
  });
}

function goToBoard(){ renderBoard(); showScreen('screen-board'); }
function goToRounds(){ renderRounds(); showScreen('screen-rounds'); }

function selectQuestion(catIdx,posIdx){
  currentCatIdx=catIdx;
  currentPosIdx=posIdx;
  renderTeamSelect();
  showScreen('screen-team-select');
}

function renderTeamSelect(){
  const g=document.getElementById('team-select-grid');
  g.innerHTML='';
  TEAM_NAMES.forEach((name,i)=>{
    g.innerHTML+='<div class="team-card" onclick="startQuestion('+i+')"><div class="team-card-name">'+name+'</div><div class="team-card-score">'+SCORES[i]+' баллов</div></div>';
  });
}

function startQuestion(teamIdx){
  currentTeam=teamIdx;
  const r=ROUNDS[currentRound];
  const qIdx=currentCatIdx*5+currentPosIdx;
  const q=r.questions[qIdx];
  const cost=COST_MAP[currentPosIdx];
  document.getElementById('q-badge').textContent=r.categories[currentCatIdx]+' · '+cost+' баллов';
  let optsHtml=q.options.map(o=>{
    const letter=o.charAt(0);
    const isCorrect=q.answer.startsWith(letter);
    return '<div class="q-option '+(isCorrect?'correct':'')+'"><span class="letter">'+letter+'</span>'+o.substring(3)+'</div>';
  }).join('');
  const explHtml=q.explanation.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('');
  document.getElementById('q-body').innerHTML=
    '<div class="q-text">'+q.question+'</div>'+
    '<div class="q-options">'+optsHtml+'</div>'+
    '<div class="q-answer-label">Правильный ответ: '+q.answer+'</div>'+
    '<div class="q-explanation">'+explHtml+'</div>'+
    '<div class="q-actions">'+
    '<button class="q-action-btn accept" onclick="answerQuestion(true)">✓ Засчитать ('+TEAM_NAMES[currentTeam]+', +'+cost+')</button>'+
    '<button class="q-action-btn reject" onclick="answerQuestion(false)">✗ Не засчитать</button>'+
    '</div>';
  showScreen('screen-question');
}

function answerQuestion(correct){
  const r=ROUNDS[currentRound];
  const qIdx=currentCatIdx*5+currentPosIdx;
  const q=r.questions[qIdx];
  const cost=COST_MAP[currentPosIdx];
  USED[currentRound+'-'+currentCatIdx+'-'+currentPosIdx]=true;
  HISTORY.push({
    team:currentTeam,
    round:currentRound,
    cat:currentCatIdx,
    pos:currentPosIdx,
    correct:correct,
    points:correct?cost:0,
    categoryName:r.categories[currentCatIdx],
    cost:cost
  });
  SCORES[currentTeam]=Math.max(0,SCORES[currentTeam]+(correct?cost:0));
  goToBoard();
}

function showScreen(id){
  document.querySelectorAll('.screen,.question-screen,.setup-screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toggleScore(){
  renderScoreboard();
  document.getElementById('scoreboard').classList.toggle('open');
}

function renderScoreboard(){
  const c=document.getElementById('score-teams');
  c.innerHTML='';
  const sorted=TEAM_NAMES.map((name,i)=>({name,score:SCORES[i],idx:i})).sort((a,b)=>b.score-a.score);
  const positions={};
  sorted.forEach((t,i)=>positions[t.idx]=i+1);
  TEAM_NAMES.forEach((name,i)=>{
    const teamHistory=HISTORY.filter(h=>h.team===i);
    const historyHtml=teamHistory.map((h,hi)=>{
      const globalIdx=HISTORY.indexOf(h);
      return '<span class="history-plaque '+(h.correct?'correct':'incorrect')+'" onclick="showReview('+globalIdx+')">'+h.categoryName.substring(0,12)+' '+h.cost+'</span>';
    }).join('');
    c.innerHTML+='<div class="score-team"><div class="team-position">#'+positions[i]+'</div><div class="team-name">'+name+'</div><div class="team-score" id="score-'+i+'">'+SCORES[i]+'</div><div class="team-history">'+historyHtml+'</div></div>';
  });
}

function showReview(idx){
  const h=HISTORY[idx];
  const r=ROUNDS[h.round];
  const qIdx=h.cat*5+h.pos;
  const q=r.questions[qIdx];
  const cost=COST_MAP[h.pos];
  const b=document.getElementById('review-body');
  let optsHtml=q.options.map(o=>{
    const letter=o.charAt(0);
    const isCorrect=q.answer.startsWith(letter);
    return '<div class="review-option '+(isCorrect?'correct':'')+'">'+o+'</div>';
  }).join('');
  const explHtml=q.explanation.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('');
  b.innerHTML=
    '<div class="review-badge">'+r.categories[h.cat]+' · '+cost+' баллов</div>'+
    '<div class="review-team">'+TEAM_NAMES[h.team]+' — Раунд '+(h.round+1)+'</div>'+
    '<div class="review-result '+(h.correct?'correct':'incorrect')+'">'+(h.correct?'✓ Засчитано +'+cost:'✗ Не засчитано')+'</div>'+
    '<div class="review-q">'+q.question+'</div>'+
    '<div class="review-options">'+optsHtml+'</div>'+
    '<div class="review-answer">Правильный ответ: '+q.answer+'</div>'+
    '<div class="review-expl">'+explHtml+'</div>';
  document.getElementById('review-overlay').classList.add('open');
}

function closeReview(){ document.getElementById('review-overlay').classList.remove('open'); }

init();
</script>
</body>
</html>
