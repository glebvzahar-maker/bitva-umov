<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Викторина — Битва умов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17;--card:#141a2a;--gold:#d4a843;--gold2:#f0d68a;
  --text:#e8ecf2;--muted:#6b7a94;--green:#3ecf7a;--red:#e05555;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(20,26,42,.95);border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;z-index:10;}
.header h1{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold);}
.header .score-toggle{background:none;border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;}

.screen{display:none;flex:1;overflow-y:auto;flex-direction:column;}
.screen.active{display:flex;}

.lock-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:30px 16px;gap:16px;}
.lock-screen.active{display:flex;}
.lock-icon{font-size:48px;margin-bottom:8px;}
.lock-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);text-align:center;}
.lock-sub{font-size:13px;color:var(--muted);text-align:center;max-width:300px;}
.lock-input-wrap{display:flex;align-items:center;gap:8px;width:100%;max-width:300px;}
.lock-input{flex:1;background:var(--card);border:1px solid rgba(212,168,67,.3);border-radius:8px;color:var(--text);font-size:18px;font-weight:600;padding:12px 16px;text-align:center;font-family:'Inter',sans-serif;letter-spacing:4px;outline:none;}
.lock-input:focus{border-color:var(--gold);}
.lock-btn{background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.lock-btn:active{transform:scale(.96);}
.lock-error{font-size:13px;color:var(--red);text-align:center;min-height:20px;}

.rounds-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 16px;max-width:500px;margin:0 auto;width:100%;}
.round-card{background:var(--card);border:1px solid rgba(212,168,67,.2);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.round-card:active{transform:scale(.97);}
.round-card .num{font-family:'Playfair Display',serif;font-size:44px;font-weight:900;color:var(--gold);line-height:1;}
.round-card .label{font-size:15px;font-weight:600;margin-top:6px;}
.round-card .sub{font-size:11px;color:var(--muted);margin-top:4px;}
.round-card .progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05);}
.round-card .progress-fill{height:100%;background:var(--gold);transition:width .3s;width:0%;}

.board-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-shrink:0;}
.board-header .back-btn{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:4px 8px;}
.board-header h2{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);text-align:center;}

.board-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:5px;padding:12px 16px;flex:1;align-content:start;}
.cat-label{background:var(--card);border:1px solid rgba(212,168,67,.2);border-radius:5px;padding:6px 4px;text-align:center;font-size:10px;font-weight:600;color:var(--gold);display:flex;align-items:center;justify-content:center;min-height:50px;line-height:1.2;}
.q-cell{background:linear-gradient(135deg,#1a2240,#162038);border:1px solid rgba(212,168,67,.18);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--gold2);cursor:pointer;transition:all .25s;min-height:50px;position:relative;}
.q-cell:active{transform:scale(.93);}
.q-cell.used{background:rgba(20,26,42,.4);border-color:rgba(80,80,80,.2);color:rgba(80,80,80,.35);cursor:default;pointer-events:none;text-decoration:line-through;}
.q-cell.used::after{content:"";position:absolute;inset:0;background:rgba(10,14,23,.6);border-radius:6px;}

.team-select-grid{display:flex;flex-direction:column;gap:10px;padding:20px 16px;max-width:600px;margin:0 auto;width:100%;}
.team-card{background:var(--card);border:1px solid rgba(212,168,67,.2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;}
.team-card:active{transform:scale(.97);border-color:var(--gold);}
.team-card .team-card-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.team-card .team-card-score{font-size:13px;color:var(--muted);}

.question-screen{display:none;flex-direction:column;height:100%;}
.question-screen.active{display:flex;}
.q-top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(20,26,42,.95);border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;}
.q-top-bar .back-btn{background:none;border:none;color:var(--gold);font-size:20px;cursor:pointer;}
.q-top-bar .q-badge{background:var(--gold);color:var(--bg);font-weight:700;padding:4px 12px;border-radius:16px;font-size:11px;}
.q-body{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
.q-text{font-size:16px;font-weight:600;line-height:1.5;background:var(--card);border-radius:10px;padding:16px;border-left:3px solid var(--gold);}
.q-options{display:flex;flex-direction:column;gap:8px;}
.q-option{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.4;transition:all .3s;}
.q-option.correct{border-color:var(--green);background:rgba(62,207,122,.08);}
.q-option .letter{display:inline-block;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.07);text-align:center;line-height:22px;font-weight:700;font-size:12px;margin-right:8px;}
.q-option.correct .letter{background:var(--green);color:var(--bg);}
.q-answer-label{font-size:13px;font-weight:700;color:var(--green);padding:10px 14px;background:rgba(62,207,122,.06);border-radius:8px;text-align:center;}
.q-explanation{background:var(--card);border-radius:10px;padding:16px;font-size:13px;line-height:1.7;color:var(--muted);border:1px solid rgba(255,255,255,.04);}
.q-explanation p{margin-bottom:10px;}
.q-explanation strong{color:var(--text);}

.q-actions{display:flex;gap:10px;padding:10px 0 20px;}
.q-action-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;}
.q-action-btn:active{transform:scale(.96);}
.q-action-btn.accept{background:var(--green);color:var(--bg);}
.q-action-btn.reject{background:var(--red);color:#fff;}

.scoreboard{display:none;flex-direction:column;position:fixed;inset:0;z-index:100;background:rgba(10,14,23,.97);}
.scoreboard.open{display:flex;}
.score-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;}
.score-header h2{font-family:'Playfair Display',serif;color:var(--gold);font-size:18px;}
.score-header .close-btn{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;}
.score-teams{display:flex;flex-direction:column;gap:10px;padding:16px;flex:1;overflow-y:auto;}
.score-team{background:var(--card);border-radius:10px;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.team-position{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--gold);width:30px;text-align:center;flex-shrink:0;}
.team-name{font-weight:700;font-size:13px;width:80px;flex-shrink:0;color:var(--gold);}
.team-score{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;width:60px;text-align:center;flex-shrink:0;}
.team-history{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.history-plaque{display:inline-block;padding:3px 6px;border-radius:4px;font-size:9px;font-weight:600;line-height:1;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:all .2s;}
.history-plaque:active{transform:scale(.92);}
.history-plaque.correct{background:rgba(62,207,122,.15);color:var(--green);}
.history-plaque.incorrect{background:rgba(224,85,85,.15);color:var(--red);}

.setup-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:30px 16px;gap:16px;}
.setup-screen.active{display:flex;}
.setup-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);text-align:center;margin-bottom:10px;}
.setup-team{display:flex;align-items:center;gap:10px;width:100%;max-width:400px;background:var(--card);border-radius:10px;padding:12px 16px;}
.setup-team .num{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--gold);width:30px;text-align:center;flex-shrink:0;}
.setup-team input{flex:1;background:none;border:none;border-bottom:1px solid rgba(212,168,67,.3);color:var(--text);font-size:15px;font-weight:600;padding:6px 0;font-family:'Inter',sans-serif;outline:none;}
.setup-team input:focus{border-bottom-color:var(--gold);}
.setup-team input::placeholder{color:var(--muted);font-weight:400;}
.setup-start-btn{margin-top:16px;background:var(--gold);color:var(--bg);border:none;border-radius:10px;padding:14px 40px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;}
.setup-start-btn:active{transform:scale(.96);}

.review-overlay{display:none;flex-direction:column;position:fixed;inset:0;z-index:200;background:rgba(10,14,23,.98);overflow-y:auto;}
.review-overlay.open{display:flex;}
.review-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(212,168,67,.15);flex-shrink:0;}
.review-header h2{font-family:'Playfair Display',serif;color:var(--gold);font-size:16px;}
.review-header .close-btn{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;}
.review-body{padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
.review-badge{background:var(--gold);color:var(--bg);font-weight:700;padding:4px 12px;border-radius:16px;font-size:11px;align-self:flex-start;}
.review-team{font-size:14px;color:var(--muted);font-weight:600;}
.review-result{font-size:14px;font-weight:700;padding:6px 12px;border-radius:6px;align-self:flex-start;}
.review-result.correct{background:rgba(62,207,122,.12);color:var(--green);}
.review-result.incorrect{background:rgba(224,85,85,.12);color:var(--red);}
.review-q{font-size:16px;font-weight:600;line-height:1.5;background:var(--card);border-radius:10px;padding:16px;border-left:3px solid var(--gold);}
.review-options{display:flex;flex-direction:column;gap:6px;}
.review-option{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.4;}
.review-option.correct{border-color:var(--green);background:rgba(62,207,122,.08);}
.review-answer{font-size:13px;font-weight:700;color:var(--green);padding:8px 14px;background:rgba(62,207,122,.06);border-radius:8px;text-align:center;}
.review-expl{background:var(--card);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;color:var(--muted);border:1px solid rgba(255,255,255,.04);}
.review-expl p{margin-bottom:8px;}
.review-expl strong{color:var(--text);}

@media(min-width:768px){
  .board-grid{gap:6px;padding:12px 20px;}
  .q-cell{font-size:24px;min-height:54px;}
  .cat-label{font-size:11px;min-height:54px;}
  .q-text{font-size:18px;}
  .q-explanation{font-size:14px;}
  .team-card{padding:28px;}
  .team-card .team-card-name{font-size:24px;}
}
</style>
</head>
<body>
<div class="header" id="app-header" style="display:none"><h1>Битва умов</h1><button class="score-toggle" onclick="toggleScore()">Результат Викторины</button></div>

<div class="lock-screen active" id="screen-lock">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">Битва умов</div>
  <div class="lock-sub">Введите пароль для доступа к викторине</div>
  <div class="lock-input-wrap">
    <input type="password" class="lock-input" id="lock-password" maxlength="10" placeholder="····" inputmode="numeric">
    <button class="lock-btn" onclick="checkPassword()">→</button>
  </div>
  <div class="lock-error" id="lock-error"></div>
</div>

<div class="setup-screen" id="screen-setup">
  <div class="setup-title">Назовите команды</div>
  <div id="setup-teams"></div>
  <button class="setup-start-btn" onclick="finishSetup()">Начать игру</button>
</div>

<div class="screen" id="screen-rounds"><div class="rounds-grid" id="rounds-grid"></div></div>
<div class="screen" id="screen-board"><div class="board-header"><button class="back-btn" onclick="goToRounds()">←</button><h2 id="board-title"></h2><div></div></div><div class="board-grid" id="board-grid"></div></div>
<div class="screen" id="screen-team-select"><div class="board-header"><button class="back-btn" onclick="goToBoard()">←</button><h2>Какая команда отвечает?</h2><div></div></div><div class="team-select-grid" id="team-select-grid"></div></div>
<div class="question-screen" id="screen-question"><div class="q-top-bar"><button class="back-btn" onclick="goToBoard()">←</button><div class="q-badge" id="q-badge"></div><div></div></div><div class="q-body" id="q-body"></div></div>
<div class="scoreboard" id="scoreboard"><div class="score-header"><h2>Результат Викторины</h2><button class="close-btn" onclick="toggleScore()">×</button></div><div class="score-teams" id="score-teams"></div></div>
<div class="review-overlay" id="review-overlay"><div class="review-header"><h2>Просмотр вопроса</h2><button class="close-btn" onclick="closeReview()">×</button></div><div class="review-body" id="review-body"></div></div>

<script>
const ROUNDS = [{"name": "Старт", "categories": ["Инфраструктурный комплекс", "Локомотивы", "Управление движением", "Разное"], "questions": [{"id": "1.1", "points": 10, "question": "Какой тип рельса является наиболее распространённым на железных дорогах Российской Федерации?", "options": ["А) Р 43", "Б) Р 50", "В) Р 65", "Г) Р 75"], "answer": "В) Р 65**", "explanation": "Рельс Р 65 — основной тип рельса на сети железных дорог России. Цифра «65» обозначает массу рельса в килограммах на один метр длины. Этот тип обеспечивает оптимальный баланс между прочностью, весом и стоимостью для условий российской эксплуатации.\n\nСтруктура рельса состоит из трёх частей: головка (верхняя, по которой катятся колёса), шейка (средняя, обеспечивающая упругость) и подошва (нижняя, опирающаяся на шпалы). К рельсу предъявляются жёсткие требования: прочность, твёрдость, вязкость, упругость, гладкость и жёсткость. Каждый грузовой состав массой 5 000–7 000 тонн проходит по рельсу, создавая колоссальное давление.\n\nСовременные рельсы на сети РЖД — бесстыковые. Рельсы свариваются в длинные плети длиной в сотни метров, а затем в ещё более длинные — до нескольких километров. Это убирает стыки — самое слабое место пути — и обеспечивает более плавное и быстрое движение, меньший износ подвижного состава, снижение шума и вибрации.\n\nРельс Р 75 применяется на тяжеловесных направлениях (Восточный полигон), где нагрузка на ось превышает 25 тонн. Рельс Р 50 использовался на линиях с малой нагрузкой, но постепенно заменяется. Рельс Р 43 — исторический тип, на магистральных линиях уже не применяется."}, {"id": "1.2", "points": 10, "question": "Какое инженерное сооружение считается самой красивой точкой БАМа?", "options": ["А) Байкальский тоннель", "Б) Мост через Амур", "В) Северомуйский тоннель", "Г) Чёртов мост"], "answer": "Г) Чёртов мост**", "explanation": "Чёртов мост — полукруглый виадук над рекой Итыкит на обходе Северомуйского тоннеля. Он был построен в 1986 году и стал одним из самых узнаваемых сооружений Байкало-Амурской магистрали. Мост представляет собой грандиозное инженерное сооружение: высота опор превышает 30 метров, а длина — более 200 метров.\n\nМногие машинисты боялись ездить по мосту: при прохождении тяжёлого состава сооружение раскачивалось, создавая ощущение небезопасности. Однако расчётам инженеров можно доверять — мост выдерживает любые нагрузки, предусмотренные проектом.\n\nЧёртов мост стал визитной карточкой не только БАМа, но и всего российского железнодорожного строительства. Его часто фотографируют туристы, он появляется в документальных фильмах и учебниках по инженерным сооружениям. Мост доказывает, что даже на самой сложной трассе можно создать сооружение, которое сочетает функциональность и эстетическую красоту."}, {"id": "1.3", "points": 20, "question": "На какой линии в России находится участок с левосторонним движением поездов?", "options": ["А) Казань — Тверь", "Б) Тайшет — Канск", "В) Москва — Рязань", "Г) Самара — Пенза"], "answer": "В) Москва — Рязань**", "explanation": "На уникальной линии Москва — Рязань светофоры расположены по левую руку от машиниста, а пассажиры выходят с непривычной стороны перрона. Это единственная магистральная линия в России с левосторонним движением.\n\nМагистраль строили в середине XIX века англичане, и они организовали движение так, как было привычно им — по левой стороне. Тогда в Англии было принято держаться при езде слева, и это правило было перенесено на железную дорогу. Когда позже в России были приняты стандарты правостороннего движения, линия Москва — Рязань осталась исключением.\n\nДля машинистов это создаёт определённые сложности: сигналы светофоров расположены не так, как на остальной сети, и нужно привыкнуть к нестандартной ориентации. Однако за более чем 150 лет существования линии все работники привыкли к этой особенности, и левостороннее движение стало частью истории Московской железной дороги.\n\nЭто яркий пример того, как исторические решения могут определять технологические стандарты на десятилетия вперёд. Линия Москва — Рязань продолжает работать в штатном режиме и обслуживает миллионы пассажиров ежегодно."}, {"id": "1.4", "points": 20, "question": "Как называется время, в период которого прекращается движение поездов и производятся работы на линии?", "options": ["А) Стойло", "Б) Створ", "В) Окно", "Г) Ворота"], "answer": "В) Окно**", "explanation": "Термин «окно» — один из ключевых в организации движения на железной дороге. Он означает временной промежуток, в течение которого движение поездов приостанавливается, и на линии проводятся плановые или аварийные работы.\n\nПроисхождение термина — метафорическое: так же как «окно» в расписании является временным пространством, так и в графике движения поездов «окно» — это «дырка», через которую инженеры и путейцы «заглядывают» в инфраструктуру для её обновления.\n\nВиды «окон»: плановые — для планового ремонта пути, контактной сети, устройств автоматики и телемеханики (обычно ночью или в часы минимальной загрузки); экстренные — для ликвидации последствий аварий, обрушений, сходов (назначаются немедленно по решению диспетчера).\n\nВ «окно» проводят ремонт и замену рельсов, подбивку и выравнивание пути, ремонт контактной сети и тяговых подстанций, обслуживание переездов и светофоров, работы на искусственных сооружениях. В 2025 году было оздоровлено 4 249 км пути, модернизировано 274 км контактной сети — всё это стало возможным благодаря грамотному планированию «окон»."}, {"id": "1.5", "points": 30, "question": "Какая ресурсосберегающая технология повторной укладки является самой распространённой на сети РЖД?", "options": ["А) Повторная укладка старогодных материалов", "Б) Очистка кюветов", "В) Плановая замена элементов ВСП", "Г) Укладка безбалластного мостового полотна"], "answer": "А) Повторная укладка старогодных материалов**", "explanation": "Повторная укладка старогодных материалов (ПУСМ) — самая распространённая ресурсосберегающая технология на сети РЖД. Суть технологии: вместо полной замены рельсошпальной решётки на новую, старые, но ещё пригодные элементы (рельсы, шпалы, скрепления) повторно укладываются на другой участок пути, где условия эксплуатации менее требовательные.\n\nПреимущества технологии очевидны: экономия материалов (до 40% от стоимости нового пути), сокращение времени на работы, снижение нагрузки на логистику (не нужно транспортировать огромные объёмы новых материалов), уменьшение отходов производства.\n\nТехнология требует точного расчёта: материалы должны соответствовать нормативам по остаточному ресурсу. Рельсы проверяются дефектоскопами, шпалы — на наличие трещин, скрепления — на износ. Только те элементы, которые прошли контроль качества, допускаются к повторной укладке.\n\nВ 2025 году ПУСМ позволила сэкономить десятки миллиардов рублей и существенно ускорить оздоровление пути. Это яркий пример того, как инженерный подход к ресурсосбережению даёт реальный экономический эффект при сохранении высоких стандартов безопасности."}, {"id": "2.1", "points": 10, "question": "Какая серия обозначает пассажирский электровоз переменного тока?", "options": ["А) ТЭМ18", "Б) ВЛ80", "В) ЭП1", "Г) 2ТЭ10"], "answer": "В) ЭП1**", "explanation": "ЭП1 — пассажирский электровоз переменного тока, один из самых распространённых в пассажирском хозяйстве РЖД. Расшифровка серии: «Э» — электровоз, «П» — пассажирский, «1» — первая модель в серии.\n\nЭП1 предназначен для вождения пассажирских поездов на участках с переменным током напряжением 25 000 В. Мощность локомотива — 4 800 кВт, максимальная скорость — 160 км/ч. Локомотив оснащён системами безопасности, радиосвязью и современными средствами диагностики.\n\nВ отличие от ЭП1, серия ТЭМ18 — маневровый тепловоз (для работы на станциях), ВЛ80 — грузовой электровоз переменного тока (расшифровка: «ВЛ» — Владимир Ленин), а 2ТЭ10 — двухсекционный грузовой тепловоз. Каждая серия имеет свою уникальную конструкцию, предназначенную для определённых условий эксплуатации.\n\nПонимание расшифровки серий локомотивов — ключ к пониманию всего локомотивного хозяйства. Код серии локомотива читается как паспорт: первая цифра — число секций, буквы — тип и предназначение."}, {"id": "2.2", "points": 10, "question": "Сколько локомотивов находится в парке ОАО «РЖД» (по данным 2025 года)?", "options": ["А) 5 000", "Б) 8 500", "В) 12 058", "Г) 15 000"], "answer": "В) 12 058**", "explanation": "Парк локомотивов ОАО «РЖД» насчитывает 12 058 единиц техники. Помимо этого, в компаниях холдинга находится ещё 2 638 локомотивов. Общая мощность парка позволяет обслуживать грузопотоки, объём которых измеряется миллиардами тонно-километров.\n\nВ 2025 году было закуплено 399 новых локомотивов российского производства на сумму 119,8 млрд руб. Все локомотивы — отечественного производства, что является результатом политики импортозамещения и развития российского машиностроения.\n\nПарк делится по видам службы: грузовые (основная часть), пассажирские, универсальные, маневровые и промышленные. Каждый тип имеет свою конструкцию, оптимизированную для конкретных условий: грузовые — для тяжёлых составов на длинные расстояния, пассажирские — для высоких скоростей, маневровые — для работы на станциях.\n\n12 058 локомотивов — это как если бы в каждом городе с населением более 100 000 человек базировалось по локомотивному депо. Масштаб парка определяет возможности компании по перевозке грузов и пассажиров на всей территории России."}, {"id": "2.3", "points": 20, "question": "Какая технология вождения поездов применяется на Восточном полигоне для перевозки сверхтяжёлых составов?", "options": ["А) Один локомотив в голове", "Б) Подталкивающий локомотив в хвосте", "В) Система многих единиц (СМЕ)", "Г) Сдвоенный поезд с распределённой тягой"], "answer": "Г) Сдвоенный поезд с распределённой тягой**", "explanation": "На Восточном полигоне — самом нагруженном направлении сети РЖД — применяется технология сдвоенного поезда с распределённой тягой. Суть: два поезда, каждый из которых управляется своим локомотивом, следуют как единая система, но с распределённой силой тяги.\n\nТяжеловесные поезда на Восточном полигоне достигают массы 7 100 тонн — это эквивалент более чем 700 вагонов средней грузоподъёмности или двух десятков «Боингов-747» в одном составе. Для движения таких составов необходимы не только мощные локомотивы, но и особая технология управления.\n\nВ 2025 году проведено 37,9 тыс. поездов массой 7,1 тыс. тонн — на 20,2% больше, чем годом ранее. Технология распределённой тяги позволяет увеличить пропускную способность участка, поскольку один сдвоенный поезд заменяет два отдельных состава.\n\nДля сравнения: один локомотив в голове (вариант А) применяется для лёгких составов; кратная тяга (несколько локомотивов в голове) — для средних поездов; подталкивающий локомотив (вариант Б) используется в горных условиях. СМЕ (вариант В) — система, при которой несколько локомотивов управляются из одной кабины, но это не та же технология, что распределённая тяга в сдвоенном поезде."}, {"id": "2.4", "points": 20, "question": "Какой ремонт локомотива выполняется через 180–200 тыс. км пробега?", "options": ["А) ТР-1", "Б) ТР-2", "В) ТР-3", "Г) Средний ремонт (СР)"], "answer": "Б) ТР-2**", "explanation": "Ремонт локомотивов организован по пробегам — это система, при которой вид ремонта определяется расстоянием, пройденным локомотивом. ТР-2 выполняется через 180–200 тыс. км пробега и является одним из ключевых видов текущего ремонта.\n\nПолная шкала ремонтов выглядит так: ТР-1 — через 25–50 тыс. км (самый частый, «техническое обслуживание»); ТР-2 — через 180–200 тыс. км (более глубокий); ТР-3 — через 360–600 тыс. км (капитальный текущий ремонт); Средний ремонт (СР) — через 1 800 тыс. км; Капитальный ремонт (КР) — через 5 400 тыс. км.\n\nНа каждом этапе ремонта проверяются и заменяются определённые компоненты: от смазки и фильтров (ТР-1) до полной переборки двигателя и трансмиссии (КР). Система ремонтов по пробегам обеспечивает баланс между стоимостью обслуживания и ресурсом локомотива.\n\nИменно в локомотивных депо работают десятки тысяч инженеров, технологов и слесарей. Молодые специалисты начинают практику именно здесь — в сервисных компаниях и депо, где проходит весь жизненный цикл локомотива от выпуска из завода до капитального ремонта."}, {"id": "2.5", "points": 30, "question": "Какие альтернативные источники энергии рассматриваются для тяги будущих локомотивов РЖД?", "options": ["А) Только водород", "Б) Водород, аккумуляторы и гибриды", "В) Солнечные батареи и ветрогенераторы", "Г) Ядерная энергетика"], "answer": "Б) Водород, аккумуляторы и гибриды**", "explanation": "Доклад «РЖД 2050: Взгляд за горизонт» определяет три основных направления развития альтернативной тяги: водородные топливные элементы, аккумуляторные и гибридные тяговые приводы.\n\nВодородные топливные элементы — самое перспективное направление. Локомотив на водороде не выбросов, заправка занимает_minutes, а запас хода сопоставим с дизельным топливом. РЖД уже ведёт экспериментальные работы по созданию гибридных локомотивов с водородными установками.\n\nАккумуляторные локомотивы предназначены для маневровой работы и подачи вагонов на сортировочных станциях. Их преимущество — полное отсутствие выбросов и низкий уровень шума, что особенно важно в городских условиях. Гибридные приводы сочетают дизельный двигатель с аккумуляторной установкой, обеспечивая экономию топлива до 30%.\n\nСолнечные батареи и ядерная энергетика (варианты В и Г) не рассматриваются как основные источники тяги: солнечные — из-за недостаточной мощности и зависимости от погоды, ядерные — из-за сложности эксплуатации и безопасности. Развитие альтернативной тяги — ключевой элемент стратегии «зелёного» транспорта РЖД до 2050 года."}, {"id": "3.1", "points": 10, "question": "Какой специалист отвечает за коммерческий осмотр вагонов на сортировочной станции?", "options": ["А) Коммерческий директор", "Б) Коммерческий коллектор", "В) Осмотрщик поездов", "Г) Приемщик поездов"], "answer": "Г) Приемщик поездов**", "explanation": "Приёмщики поездов — первыми встречают поезда на сортировочной станции и тщательно осматривают состав. Задача приёмщика — найти коммерческие неисправности, которые могут привести к потере груза в пути следования.\n\nКоммерческий осмотр включает проверку состояния вагонов, правильности крепления груза, исправности запорных устройств, наличия повреждений кузова. Приёмщик действует по чёткому регламенту: обходит каждый вагон, проверяет критические точки, фиксирует неисправности.\n\nПри обнаружении коммерческой неисправности приёмщик составляет акт и принимает решение: допустить вагон к следованию или задержать для устранения дефекта. От работы приёмщика зависит сохранность груза — если неисправность не будет обнаружена, груз может быть повреждён или утрачен.\n\nЭта профессия требует внимательности, знания нормативов и опыта. Молодые специалисты часто начинают работу именно с приёмки поездов — это даёт понимание всех процессов на станции и формирует базу для карьерного роста."}, {"id": "3.2", "points": 10, "question": "Как называют поезд, который временно отставлен на станции без локомотива?", "options": ["А) Стоячий экспресс", "Б) Поезд имени Вчера", "В) Брошенный поезд", "Г) Тормоз-мобиль"], "answer": "В) Брошенный поезд**", "explanation": "«Брошенный поезд» — это термин, обозначающий временно отставленный состав на станции без локомотива. Несмотря на пугающее название, это штатная ситуация в работе железнодорожного транспорта.\n\nПричины отставления поезда могут быть разными: ожидание локомотива, перестановка на другой путь, ожидание формирования состава, ремонт вагонов. Состав стоит на станции, пока не будет решён вопрос с его дальнейшим следованием.\n\nТермин «брошенный поезд» является профессиональным жаргоном железнодорожников. Он отражает факт отсутствия локомотива — то есть состав как бы «оставлен» без тяги. Однако в реальности за каждым таким поездом стоит диспетчер, который контролирует его состояние и планирует дальнейшие действия.\n\nДля студентов этот факт интересен тем, что показывает: даже в看似 простых ситуациях на железной дороге есть свои профессиональные термины и нюансы, которые невозможно узнать из учебников."}, {"id": "3.3", "points": 20, "question": "Как называется железнодорожная станция, которая считается самой крупной в России по площади и протяжённости путей?", "options": ["А) Лужская", "Б) Инская", "В) Тайшет", "Г) Юдино"], "answer": "А) Лужская**", "explanation": "Станция Лужская — самая крупная железнодорожная станция в России. Общая площадь станции превышает 900 гектаров, а протяжённость её путей — более 320 км. Лужскую называют железнодорожным городом, ведь она включает в себя и сортировочные пути, и 4 припортовых грузовых парка.\n\nСтанция расположена на Октябрьской железной дороге, в 170 км от Санкт-Петербурга. Она является ключевым узлом, через который проходят грузопотокы из портов Балтийского моря вглубь страны. Лужская обеспечивает переработку десятков тысяч вагонов в сутки.\n\nДля сравнения: станция Юдино (Московская железная дорога) — одна из крупнейших в Европе по сортировочной мощности, но по площади уступает Лужской. Станция Тайшет — важный узел на Транссибе, но её размеры значительно меньше. Инская (Новосибирская железная дорога) — крупный сортировочный узел, но не самый большой.\n\nСтанция Лужская — яркий пример масштаба инфраструктуры РЖД: 900 гектаров — это как территория небольшого города, и на всей этой территории работают десятки тысяч железнодорожников."}, {"id": "3.4", "points": 20, "question": "Кто является руководителем движения на железнодорожном участке?", "options": ["А) Дежурный по станции", "Б) Поездной диспетчер", "В) Начальник участка", "Г) Начальник станции"], "answer": "Б) Поездной диспетчер**", "explanation": "Поездной диспетчер — руководитель движения на железнодорожном участке. Он отвечает за график движения поездов: если произошла задержка в пути, он принимает решение и организует движение поездов по участку так, чтобы ввести поезда в график, обеспечив должный уровень безопасности.\n\nДиспетчер видит всё, что происходит на участке: каждый поезд, положение стрелок, сигналы светофоров. Он управляет электрической централизацией (ЭЦ), которая контролирует стрелочные переводы и сигналы на станциях. В случае аварии или нештатной ситуации именно диспетчер принимает решения о перенаправлении поездов, остановке движения, вызове ремонтных бригад.\n\nУровни управления распределены: ДС — линейный уровень (станция), Д — дорожный уровень (железная дорога), П — полигонный уровень, ЦД — сетевой уровень (Центральная дирекция управления движением). Поездной диспетчер работает на дорожном уровне и координирует работу десятков станций.\n\nДля студентов важно понимать: диспетчер — это не просто «оператор кнопок», а высококвалифицированный специалист, принимающий решения в реальном времени, от которых зависит безопасность тысяч пассажиров и миллиардов рублей грузов."}, {"id": "3.5", "points": 30, "question": "Как называется станция, расположенная в самом центре Транссибирской магистрали?", "options": ["А) Золотая", "Б) Половина", "В) Середина", "Г) Центральная"], "answer": "Б) Половина**", "explanation": "Станция Половина — единственная станция на Транссибирской магистрали, которая находится в самом её центре. Станция была построена в 1902 году и сразу получила своё необычное название. Расстояние от Москвы до Половины равно расстоянию от Половины до Владивостока — отсюда и название.\n\nСтанция расположена в Красноярском крае и обслуживает грузовые и пассажирские поезда, следующие по Транссибу. Несмотря на скромные размеры, Половина — это символ Транссиба, его «географическое сердце».\n\nИнтересный исторический факт: станция Середина ранее тоже находилась на карте Транссиба, но она располагалась зимой в центре озера Байкал и обслуживала пассажиров, пользовавшихся ледовой переправой. Летом поезда шли по берегу, а зимой — по льду Байкала. Середина была «сезонной» станцией и исчезла после постройки Байкальского тоннеля в 1904 году.\n\nПоловина — это не просто станция, а точка, где можно сказать: «Ровно половина пути пройдена». Для пассажиров, следующих из Москвы во Владивосток (или обратно), Половина — место для размышлений о масштабе России и инженерного подвига, которым является Транссиб."}, {"id": "4.1", "points": 10, "question": "Какая фигура возвышается над шпилем столичного Казанского вокзала?", "options": ["А) Красная звезда", "Б) Парящий феникс", "В) Крылатый змей", "Г) Трёхголовый пес"], "answer": "В) Крылатый змей**", "explanation": "На шпиле Казанского вокзала Москвы внимательные пассажиры могут увидеть флюгер в виде золотого дракона Зиланта. Сказочное существо считается покровителем Казани, с ним связаны легенды об основании этого города.\n\nЗилант — крылатый змей, который по легенде жил на холме, где потом была основана Казань. Дракон охранял город и его жителей, а его изображение стало символом Казани. Когда была построена железная дорога Москва — Казань и открыт Казанский вокзал, на шпиле здания установили фигуру Зиланта — дань уважения истории и культуре края.\n\nКазанский вокзал — один из красивейших вокзалов Москвы, построенный в 1864 году. Его здание выполнено в стиле русской псевдоготики с элементами восточной архитектуры. Вокзал является начальным пунктом Казанской и Восточно-Уральской магистралей.\n\nДля студентов этот факт важен тем, что показывает: железная дорога — это не только техника, но и культура. Каждый вокзал, каждый поезд, каждый маршрут связаны с историей и традициями тех мест, через которые они проходят."}, {"id": "4.2", "points": 10, "question": "Какая американская звезда выступала перед строителями БАМа?", "options": ["А) Мик Джаггер", "Б) Элвис Пресли", "В) Джон Леннон", "Г) Дин Рид"], "answer": "Г) Дин Рид**", "explanation": "В 1979 году на БАМ приехал Дин Рид — звезда вестернов и певец, не раз опережавший в хит-парадах Элвиса Пресли. За 19 дней, проведённых на БАМе, певец успел выступить не только в крупных городах, но и в отдалённых посёлках.\n\nДин Рид был.unique现象 в мировой культуре: американский певец и актёр, который стал звездой в социалистических странах, хотя на родине его знали меньше. Он активно поддерживал СССР и его идеалы, что делало его желанным гостем на крупнейших стройках страны.\n\nВыступления Дина Рида перед строителями БАМа стали легендой. Бамовцы — молодые люди, приехавшие строить магистраль в суровых условиях Сибири — ценили любое проявление внимания и поддержки. Концерты американской звезды подняли боевой дух строителей.\n\nДля студентов этот факт интересен в контексте истории БАМа — «стройки века», которая объединила тысячи молодых людей со всей страны. БАМ стал не только инженерным проектом, но и социальным явлением, символом молодёжного энтузиазма и самоотверженности."}, {"id": "4.3", "points": 20, "question": "В каком году в России появился первый железнодорожный музей?", "options": ["А) 1813", "Б) 1837", "В) 1896", "Г) 1905"], "answer": "А) 1813**", "explanation": "Первый железнодорожный музей открылся в Санкт-Петербурге в 1813 году — за несколько десятилетий до появления в России самих железных дорог. Это один из самых удивительных фактов в истории отечественного транспорта.\n\nМузей был открыт при Институте корпуса инженеров путей сообщения для хранения моделей технических сооружений. В то время железных дорог в России ещё не было — первая линия (Царскосельская) появится только в 1837 году. Однако инженеры уже изучали европейский опыт и готовились к строительству магистралей.\n\nВ музее хранились модели мостов, тоннелей, путевых сооружений — всё то, что инженеры планировали построить на российской земле. Музей стал учебной базой для подготовки кадров — будущих строителей железных дорог.\n\nЭтот факт показывает: Россия всегда уделяла большое внимание подготовке инженерных кадров. Даже до появления самой технологии создавались условия для её изучения. Музей при Институте путей сообщения работает и по сей день, являясь одним из старейших транспортных музеев мира."}, {"id": "4.4", "points": 20, "question": "Какое историческое событие способствовало появлению аббревиатур на русском языке, в том числе на железной дороге?", "options": ["А) Революция 1905 года", "Б) Революция 1917 года", "В) Картофельные бунты", "Г) Первая мировая война"], "answer": "Г) Первая мировая война**", "explanation": "В Первую мировую войну выросла нагрузка на телеграфные службы, и они потребовали срочного сокращения числа слов в телеграммах. Это стало толчком для широкого распространения аббревиатур в русском языке.\n\nВскоре после начала войны служба пути стала называться «П», тяги — «Т», телеграфа — «Ш», что заметно сократило объёмы железнодорожных телеграмм. Аббревиатуры позволяли передавать информацию в несколько раз быстрее и экономить ограниченные ресурсы телеграфной связи.\n\nЖелезнодорожные аббревиатуры прочно вошли в язык и используются по сей день: ПЧ (путевое хозяйство), ТЧ (локомотивное хозяйство), ШЧ (сигнализация и связь), МС (механизация и автоматизация) и многие другие. Для студентов знание этих аббревиатур — первый шаг к пониманию структуры компании.\n\nИстория аббревиатур на железной дороге — яркий пример того, как практическая необходимость порождает языковые инновации. Аббревиатуры, появившиеся в экстремальных условиях войны, стали неотъемлемой частью повседневной речи железнодорожников."}, {"id": "4.5", "points": 30, "question": "Какой вид транспорта стал основой для создания первого в СССР высокоскоростного поезда?", "options": ["А) Самолёт", "Б) Пароход", "В) Вертолёт", "Г) Автомобиль"], "answer": "А) Самолёт**", "explanation": "В конце 1960-х годов советские инженеры задумались над разработкой высокоскоростного поезда. Вместо привычной тяги на экспериментальный вагон установили реактивный двигатель от самолёта ЯК-40. Это был смелый эксперимент, который открыл новую страницу в истории отечественного транспорта.\n\nРеактивный двигатель ЯК-40 — газотурбинный двигатель мощностью 2 250 л.с. Он был установлен на специальную тележку, которая приводила в движение экспериментальный поезд. Идея заключалась в том, чтобы использовать аэродинамические принципы для создания поезда, способного развивать скорость более 200 км/ч.\n\nЭкспериментальные поезда с реактивной тягой проходили испытания на полигоне в Щербинке под Москвой. Результаты были впечатляющими: поезд достигал скорости более 250 км/ч, что было рекордом для советского железнодорожного транспорта.\n\nОднако реактивная тяга не нашла широкого применения из-за высокой стоимости эксплуатации, шума и безопасности. Впоследствии СССР и Россия развили собственную технологию высокоскоростного движения на электрической тяге — поезда «Сапсан», «Ласточка», «Стриж». Но эксперимент с реактивным двигателем ЯК-40 остался важным этапом в развитии отечественного транспорта."}]}, {"name": "Глубина", "categories": ["Вагоны", "Грузовые перевозки", "Пассажирские перевозки", "Разное"], "questions": [{"id": "1.1", "points": 10, "question": "Как в профессиональном жаргоне железнодорожников называется вагон, прибывший на станцию «неправильным» направлением — то есть его колёса обращены в сторону, обратную ожидаемой?", "options": ["А) Ворон", "Б) Чужак", "В) Левак", "Г) Оборотень"], "answer": "Б) Чужак**", "explanation": "На сортировочных станциях ежедневно перерабатываются тысячи вагонов, и для эффективной работы необходима чёткая классификация. Термин «чужак» обозначает вагон, который прибыл на станцию в направлении, обратном ожидаемому. Если состав формируется для движения на восток, а вагон прибыл «хвостом» вперёд — он считается чужаком.\n\nПроисхождение термина связано с простой логикой: вагон «чужой» для данного направления. Вагоны-чужаки требуют дополнительной обработки — их нужно перевернуть или переставить так, чтобы они оказались в правильном положении. Это занимает время и ресурсы, поэтому при формировании составов стремятся минимизировать количество чужаков.\n\nВагоноводы и составители поездов на сортировочных станциях постоянно следят за правильностью постановки вагонов. Если вагон по ошибке окажется в составе чужаком, это может привести к проблемам на промежуточных станциях — вагон могут отправить не в том направлении или задержать для перестановки.\n\nПрофессиональный жаргон железнодорожников богат подобными терминами, которые помогают быстро и точно обмениваться информацией. Знание таких терминов — часть профессиональной культуры железнодорожника, и для молодых специалистов их понимание является первым шагом к вживанию в профессию."}, {"id": "1.2", "points": 10, "question": "Как называется тип грузового вагона, который может наклоняться на 45 градусов в обе стороны для разгрузки навалочных грузов?", "options": ["А) Хоппер", "Б) Цистерна", "В) Думпкар", "Г) Полувагон"], "answer": "В) Думпкар**", "explanation": "Думпкар — это самоопрокидывающийся вагон, предназначенный для перевозки и механизированной разгрузки навалочных грузов: угля, руды, щебня, строительных материалов. Главная особенность думпкара — возможность наклонять кузов на 45 градусов в любую сторону, что обеспечивает быструю и полную выгрузку груза под действием силы тяжести.\n\nГрузоподъёмность современных думпкаров составляет до 80 тонн. Конструкция вагона включает поворотную платформу, гидравлическую систему наклона и автоматические замки фиксации. Вагон устанавливается на специальную эстакаду, после чего кузов наклоняется, и груз высыпается через боковой проём.\n\nДумпкары широко применяются на промышленных предприятиях, карьерах и строительных площадках. Они особенно эффективны там, где необходимо быстро разгрузить большой объём навалочного груза без привлечения дополнительной техники. Механизация разгрузки снижает трудозатраты и ускоряет оборот вагона.\n\nВ отличие от полувагона (который разгружается через боковые стенки вручную или с помощью бульдозеров) и хоппера (который разгружается через нижний люк), думпкар обеспечивает наиболее быструю и полную разгрузку. Цистерна предназначена для жидких грузов и не имеет механизма опрокидывания."}, {"id": "1.3", "points": 20, "question": "Какая профессия ближе всего по методу работы к осмотрщику вагонов на станции?", "options": ["А) Врач-рентгенолог", "Б) Музыкант", "В) Слесарь-ремонтник", "Г) Электрик"], "answer": "Б) Музыкант**", "explanation": "Осмотрщик вагонов использует уникальный метод диагностики, который поразительно напоминает работу музыканта. С помощью молотка осмотрщик простукивает металлические части вагона — колёса, оси, рамы, тормозные элементы — и по звуку определяет наличие трещин и дефектов.\n\nПринцип метода основан на физике звука: целый металл издаёт чистый, звонкий звук, а повреждённый — глухой, приглушённый. Как скрипач настраивает инструмент по звуку, так и осмотрщик «слушает» вагон, определяя его техническое состояние. Это требует высочайшего слуха и многолетнего опыта.\n\nДефекты, которые можно обнаружить таким методом, критически важны для безопасности: трещины в колёсах могут привести к сходу, повреждение оси — к аварии. Поэтому осмотрщик — одна из ключевых профессий на железнодорожном транспорте, от которой зависит жизнь тысяч пассажиров и сохранность миллиардов рублей грузов.\n\nМетод простукивания металла — древнейший способ неразрушающего контроля, который используется и в современных технологиях. Несмотря на появление ультразвуковых и других приборов, ручной метод остаётся незаменимым на многих станциях, сочетая скорость и доступность."}, {"id": "1.4", "points": 20, "question": "Сколько вагонов было в самом длинном грузовом поезде в истории СССР?", "options": ["А) 320", "Б) 440", "В) 560", "Г) 680"], "answer": "Б) 440**", "explanation": "Рекорд длины грузового поезда в истории СССР был установлен в 1986 году: состав из 440 вагонов с углём проследовал из Экибастуза. Длина поезда составила 6,5 километра, а масса — 43 000 тонн. Этот рекорд является одним из самых впечатляющих достижений советского железнодорожного транспорта.\n\nЭкибастуз — один из крупнейших угледобывающих центров Казахстана, обеспечивавший углём промышленность всего Советского Союза. Для перевозки таких колоссальных объёмов угля требовалась максимальная длина составов и мощная тяга.\n\nДля вождения поезда такой массы потребовались два тяжёлых электровоза ВЛ80т, работавших по системе многих единиц. Скорость состава была невысокой — около 20–25 км/ч, но главной задачей была не скорость, а максимальная загрузка каждого рейса.\n\nСовременные технологии позволяют формировать составы массой до 7 100 тонн на Восточном полигоне — это около 140–150 вагонов. Однако рекорд 1986 года до сих пор не побит, оставаясь символом масштабности советских железнодорожных перевозок и инженерных возможностей той эпохи."}, {"id": "1.5", "points": 30, "question": "Каков общий парк грузовых вагонов всех операторов на территории России?", "options": ["А) Около 700 тысяч", "Б) Около 1,05 миллиона", "В) Около 1,41 миллиона", "Г) Около 1,8 миллиона"], "answer": "В) Около 1,41 миллиона**", "explanation": "Общий парк грузовых вагонов всех операторов на территории России составляет около 1,41 миллиона единиц. Из них ОАО «РЖД» владеет 159 300 вагонами — лишь небольшой процент от общего числа. Основная часть парка принадлежит частным операторам: «Трансмашхолдингу», «Группе ЕВРАЗ», «СК ВЕК», «НКРТ» и другим компаниям.\n\nСтруктура парка отражает специфику российских перевозок: основную долю занимают полувагоны — открытые вагоны для перевозки угля, руды, зерна и других навалочных грузов. Следующими по распространённости идут цистерны (для нефти и нефтепродуктов), затем платформы и фитинговые платформы (для контейнеров), крытые вагоны и зерновозы.\n\nПолувагоны составляют наибольшую долю парка, поскольку основной объём грузов РЖД — это уголь, перевозимый с шахт Восточной Сибири и Кузбасса на Восточный полигон. Именно поэтому политика обновления парка ориентирована в первую очередь на увеличение числа полувагонов и фитинговых платформ под контейнеры.\n\nСобственный парк РЖД в 159 300 вагонов — это примерно 11% от общего числа. Такая структураOwnership отражает рыночную модель: РЖД владеет инфраструктурой и локомотивами, а перевозки грузов в вагонах осуществляют десятки частных компаний-операторов. Это создаёт конкурентную среду и стимулирует развитие рынка грузовых перевозок."}, {"id": "2.1", "points": 10, "question": "В каких единицах измеряется грузооборот железнодорожного транспорта?", "options": ["А) Тонны", "Б) Тонно-километры", "В) Кубометры", "Г) Вагоно-рейсы"], "answer": "Б) Тонно-километры**", "explanation": "Грузооборот — главный показатель работы грузового транспорта — измеряется в тонно-километрах (ткм). Это произведение веса груза (в тоннах) на среднюю дальность перевозки (в километрах). Формула проста: 1 тонна груза, перевезённая на расстояние 1 километр, равна 1 тонно-километру.\n\nГрузооборот позволяет учитывать не только объём перевезённых грузов, но и расстояние, на которое они были перемещены. Это делает его более информативным показателем, чем простая масса загрузки. Например, перевозка 100 тонн угля на 3 000 км (300 000 ткм) — значительно более серьёзная задача, чем перевозка тех же 100 тонн на 100 км (10 000 ткм).\n\nОАО «РЖД» по грузообороту является второй железнодорожной системой в мире после китайских железных дорог. Это свидетельствует о колоссальном масштабе российских железнодорожных перевозок и их важности для экономики страны.\n\nГрузооборот используется для планирования, прогнозирования и анализа эффективности перевозок. По этому показателю определяется потребность в локомотивах, вагонах, инфраструктуре и кадрах. Для студентов понимание единицы измерения «тонно-километр» — ключ к пониманию экономики железнодорожного транспорта."}, {"id": "2.2", "points": 10, "question": "Сколько тонн грузов было загружено на сети ОАО «РЖД» в 2025 году?", "options": ["А) 895,3 млн тонн", "Б) 1 012,5 млн тонн", "В) 1 115,8 млн тонн", "Г) 1 250,0 млн тонн"], "answer": "В) 1 115,8 млн тонн**", "explanation": "В 2025 году на сети ОАО «РЖД» было загружено 1 115,8 миллиона тонн грузов. Этот показатель стал рекордным за всю историю компании и свидетельствует о стабильном росте грузопотоков. Для сравнения: в 2024 году загрузка составляла около 1 080 млн тонн, а в 2020 году — около 1 000 млн тонн.\n\nРекордная загрузка стала возможной благодаря нескольким факторам: росту добычи угля и нефти, развитию экспортных маршрутов, увеличению перевозок в контейнерах и совершенствованию системы управления перевозками. РЖД удалось обеспечить стабильную работу даже в условиях высокой загрузки инфраструктуры.\n\nДля понимания масштаба: 1 115,8 млн тонн — это более миллиарда тонн грузов за год. Если перевести это в бытовые аналоги, это как если бы каждый человек в России перевёз примерно 7–8 тонн различных товаров за год исключительно по железной дороге.\n\nРост загрузки создаёт вызовы для инфраструктуры: необходимо увеличивать пропускную способность станций, обновлять локомотивы и вагоны, совершенствовать систему управления. Именно поэтому РЖД реализует масштабные программы модернизации, включая строительство новых путей и электрификацию участков."}, {"id": "2.3", "points": 20, "question": "Что такое «порожний пробег» и какой результат был достигнут в 2025 году в борьбе с ним?", "options": ["А) Процент загруженных вагонов; загрузка выросла до 75%", "Б) Доля порожних вагонов в общем пробеге; исключено 193 000 лишних порожних вагонов", "В) Стоимость перевозки пустых вагонов; экономия составила 50 млрд руб", "Г) Скорость движения порожних составов; увеличена до 600 км/сутки"], "answer": "Б) Доля порожних вагонов в общем пробеге; исключено 193 000 лишних порожних вагонов**", "explanation": "«Порожний пробег» — это процент вагонов, которые следуют без груза (порожняком). Это одна из главных проблем грузовых перевозок: каждый порожний вагон потребляет тяговую энергию, занимает путь и время локомотива, но не приносит дохода. Минимизация порожнего пробега — задача первостепенной важности для эффективной работы дороги.\n\nВ 2025 году РЖД удалось исключить из процесса 193 000 лишних порожних вагонов — это был значительный шаг в борьбе с неэффективностью. Благодаря этомусредняяная скорость доставки грузов увеличилась до 494,5 км/сутки, что на 21,9% больше, чем в 2024 году.\n\nБорьба с порожним пробегом включает несколько направлений: оптимизация маршрутов следования вагонов, совершенствование системы обмена вагонами между операторами, развитие технологий обратных перевозок (когда порожний вагон сразу загружается на обратном пути). Кроме того, применяется экономическое стимулирование: операторы платят за пробег порожних вагонов, что побуждает их искать пути загрузки.\n\nСнижение порожнего пробега — это не только экономическая, но и экологическая задача. Меньше порожних вагонов — меньше потребление электроэнергии и дизельного топлива, меньше выбросов в атмосферу. Поэтому борьба с порожним пробегом является частью стратегии «зелёного» транспорта РЖД."}, {"id": "2.4", "points": 20, "question": "Что такое «план формирования поездов» на сортировочной станции?", "options": ["А) Расписание прибытия и отправления поездов", "Б) Правила техники безопасности при составлении поездов", "В) Документ, определяющий порядок группировки вагонов по поездов", "Г) График движения локомотивов по депо"], "answer": "В) Документ, определяющий порядок группировки вагонов по поездов**", "explanation": "«План формирования поездов» — это ключевой документ, определяющий, каким образом вагоны группируются в поезда на сортировочной станции. План устанавливает правила распределения вагонов по поездам в зависимости от станций назначения и маршрутов следования.\n\nНа сортировочной станции вагоны прибывают в «мешанном» составе — в одном поезде могут быть вагоны, направляющиеся в десятки различных пунктов. Задача станции — рассортировать эти вагоны и сформировать однородные поезда, в которых все вагоны следуют в одном направлении.\n\nПроцесс работы по плану формирования выглядит так: состав прибывает на горку, вагоны разделяются и скатываются по diferentes пути в зависимости от направления. Далее вагоны группируются в «составные части» — группы вагонов, следующие в один пункт. Затем составные части собираются в единый поезд и отправляются дальше.\n\nПлан формирования — это не статичный документ, адинамическая модель, которая адаптируется к изменениям в грузопотоках. Он координируется диспетчерскими службами и учитывает текущую загрузку станции, наличие локомотивов и потребности грузоотправителей. Без чёткого плана формирования невозможна эффективная работа всей сети перевозок."}, {"id": "2.5", "points": 30, "question": "Каков грузооборот ОАО «РЖД» в 2025 году в тонно-километрах?", "options": ["А) 2 540,1 млрд ткм", "Б) 2 813,7 млрд ткм", "В) 3 075,3 млрд ткм", "Г) 3 250,0 млрд ткм"], "answer": "В) 3 075,3 млрд ткм**", "explanation": "Грузооборот ОАО «РЖД» в 2025 году составил рекордные 3 075,3 миллиарда тонно-километров. Это абсолютный рекорд за всю историю компании и свидетельство выдающихся перевозочных достижений. Для сравнения: в 2020 году грузооборот составлял около 2 630 млрд ткм, а в 2015 году — около 2 530 млрд ткм.\n\nРекордный грузооборот обеспечен рядом факторов: ростом объёмов перевозок угля (особенно экспортных), увеличением дальности перевозок, повышением эффективности использования инфраструктуры. Средняя скорость доставки грузов выросла до 494,5 км/сутки, что на 21,9% превышает показатель 2024 года.\n\nВажнейшим достижением стала сохранность грузов: 97,9% грузов было доставлено в срок и без потерь. Это свидетельствует о высоком качестве перевозочного процесса и профессионализме сотрудников. При грузообороте свыше 3 трлн тонно-километров такой показатель сохранности — исключительный результат.\n\nГрузооборот в 3 075,3 млрд ткм — это как если бы 1 тонна груза была перевезена на расстояние более 3 трлн километров. Или — более 3 млрд тонн были перевезены на расстояние 1 километр. Такие цифры подтверждают.position РЖД как одной из крупнейших железнодорожных систем мира и ключевого логистического партнёра российской экономики."}, {"id": "3.1", "points": 10, "question": "Сколько пассажиров перевезло ОАО «РЖД» в 2025 году?", "options": ["А) 987,5 млн пассажиров", "Б) 1 154,3 млн пассажиров", "В) 1 311,1 млн пассажиров", "Г) 1 450,0 млн пассажиров"], "answer": "В) 1 311,1 млн пассажиров**", "explanation": "В 2025 году ОАО «РЖД» перевезло 1 311,1 миллиона пассажиров. Это колоссальная цифра, которая означает, что каждый третий человек на планете (или каждый второй житель России) воспользовался услугами РЖД хотя бы раз за год. Пассажиропоток включает дальние, региональные и пригородные перевозки.\n\nОсновную долю пассажиропотока составляют пригородные перевозки — электрички и пригородные поезда, которые обслуживают ежедневные поездки людей на работу и учёбу. Именно поэтому пригородные перевозки имеют стратегическое значение: они обеспечивают мобильность населения и функционирование городских агломераций.\n\nРост пассажиропотока связан с несколькими факторами: развитием сети МЦД (Московских центральных диаметров), обновлением подвижного состава (электропоезда «Иволга», «Ласточка»), улучшением сервиса и расширением маршруной сети. В 2025 году РЖД продолжило модернизацию вокзалов и платформ.\n\nДля сравнения: 1 311 млн пассажиров — это больше, чем население Японии (125 млн) более чем в 10 раз. Такой масштаб перевозок требует колоссальной инфраструктуры: тысячи станций, десятки тысяч вагонов, тысячи локомотивов и hundreds of thousands сотрудников."}, {"id": "3.2", "points": 10, "question": "Какой электропоезд используется на Московских центральных диаметрах (МЦД)?", "options": ["А) «Сапсан»", "Б) «Ласточка»", "В) «Иволга»", "Г) «Сокол»"], "answer": "В) «Иволга»**", "explanation": "На Московских центральных диаметрах (МЦД) эксплуатируются электропоезда «Иволга» — современные составы, разработанные специально для пригородных перевозок в режиме городского транспорта. Поезда «Иволга» были созданы компанией «Трансмашхолдинг» и предназначены для работы на линиях с высокой частотой движения.\n\n«Иволга» отличается вместительностью (до 1 200 пассажиров в составе из 10 вагонов), удобствами для пассажиров (широкие двери, кондиционеры, информационные экраны) и высокой надёжностью. Поезд может развивать скорость до 120 км/ч и имеет ускоренный режим разгона.\n\nИнтересно, что для МЦК (Московского кольцевого маршрута) была выберена другая модель — «Ласточка» (электропоезд ЭС2Г «Ласточка»). Хотя обе модели являются современными, МЦК и МЦД имеют разные технические требования: МЦК работает как замкнутый кольцевой маршрут, а МЦД — как проходящие через центр линии.\n\nПоезда «Иволга» стали символом модернизации пригородного транспорта в Москве и Подмосковье. Запуск МЦД позволил соединить существующие пригородные линии и создать единую систему городского железнодорожного транспорта, аналогичную S-Bahn в Германии или RER в Париже."}, {"id": "3.3", "points": 20, "question": "Какое направление является самым популярным туристическим железнодорожным маршрутом в России?", "options": ["А) Кавказ", "Б) Камчатка", "В) Карелия", "Г) Алтай"], "answer": "В) Карелия**", "explanation": "Карелия является самым популярным железнодорожным туристическим направлением в России. Туристические поезда следуют из Москвы, Санкт-Петербурга и Петрозаводска, обеспечивая доступ к уникальным природным объектам: Сямозеро, Онежское озеро, водопады, каньоны и лесные массивы.\n\nПопулярность Карелии обусловлена несколькими факторами: близость к крупным городам (от Петрозаводска — менее 200 км), развитая железнодорожная сеть, разнообразие природных ландшафтов и наличие инфраструктуры для туризма. Поезда доходят до Петрозаводска, Костомукши и других населённых пунктов.\n\nЖелезнодорожный туризм в Карелии — это не просто трансфер, а часть путешествия. Маршруты проходят через живописные территории: через реки, озёра, таёжные леса. Многие туристы выбирают поезд именно из-за возможности наслаждаться пейзажами из окна вагона.\n\nРазвитие туристических поездов — стратегическое направление пассажирских перевозок РЖД. Компания инвестирует в обновление подвижного состава, улучшение сервиса и расширение маршрутов, чтобы сделать железнодорожный туризм комфортным и доступным."}, {"id": "3.4", "points": 20, "question": "В каком году в России появился первый пригородный электропоезд?", "options": ["А) 1929", "Б) 1935", "В) 1941", "Г) 1957"], "answer": "А) 1929**", "explanation": "Первый в России пригородный электропоезд начал работу в 1929 году на линии Москва — Мытищи. Экспериментальный электропоезд сократил время в пути вдвое по сравнению с паровым поездом, продемонстрировав преимущества электрической тяги для пригородных перевозок.\n\nЭтот эксперимент стал началом масштабной электрификации пригородных линий вокруг Москвы. В subsequent years электрификация охватила все основные направления Московского железнодорожного узла, превратив пригородные перевозки в один из важнейших элементов транспортной системы столицы.\n\nМытищинский эксперимент 1929 года имел стратегическое значение: он показал, что электропоезда идеально подходят для коротких маршрутов с частыми остановками. Электрическая тяга обеспечивает быстрый разгон, тихую работу и экологичность — именно то, что необходимо для перевозок в черте города.\n\nСегодня сеть пригородных электропоездов вокруг Москвы — одна из крупнейших в мире. Более 100 пригородных линий обслуживают миллионы пассажиров ежедневно. И всё началось с одного экспериментального поезда на линии Москва — Мытищи в 1929 году."}, {"id": "3.5", "points": 30, "question": "Сколько пар поездов ежедневно курсирует по маршруту МЦК (Московское кольцо)?", "options": ["А) 120 пар", "Б) 185 пар", "В) 242 пары", "Г) 310 пар"], "answer": "В) 242 пары**", "explanation": "По маршруту МЦК (Московское кольцо) ежедневно курсируют 242 пары поездов. В час пик поезда следуют с интервалом в 4 минуты, обеспечивая высокую пропускную способность. Полный обход кольца протяжённостью 54 километра занимает 1,5 часа, а ежедневная перевозка составляет около 650 000 пассажиров.\n\nМЦК был открыт в 2016 году и стал частью интегрированной системы пригородного транспорта Москвы. Кольцевой маршрут соединяет 31 станцию и пересекает все 12 радиальных направлений Московской железной дороги, что позволяет пассажирам пересаживаться на поезда дальнего следования, метро и наземный транспорт.\n\n242 пары поездов — это более 480 поездов в сутки. Такая частота движения возможна благодаря современной системе сигнализации и централизации, автоматическим стрелочным переводам и диспетчерскому управлению. Каждые 4 минуты в час пик со станции отправляется поезд, что сопоставимо с метрополитеном.\n\n650 000 пассажиров ежедневно — это больше, чем население целого российского города среднего размера. МЦК стал важнейшим элементом транспортной системы Москвы, разгружая метро и обеспечивая быстрое перемещение между районами города. Развитие сети МЦД и МЦК — один из приоритетов РЖД в области пассажирских перевозок."}, {"id": "4.1", "points": 10, "question": "Что держит в руке кондуктор при отправлении пассажирского поезда со станции?", "options": ["А) Красный фонарь", "Б) Жёлтый флаг", "В) Белую перчатку", "Г) Диспетчерскую палку"], "answer": "Б) Жёлтый флаг**", "explanation": "Кондуктор при отправлении пассажирского поезда держит в руке жёлтый развёрнутый флаг. Если поезд готов к отправке и все формальности соблюдены, кондуктор поднимает жёлтый развёрнутый флаг — это сигнал машинисту: можно отцепляться. Если кондуктор сворачивает флаг в рулон — это значит: «Всё в порядке, поезд готов».\n\nВ случае опасности или нештатной ситуации кондуктор выставляет красный развёрнутый флаг — это сигнал «Стоп!» и запрет на отправление. Машинист, увидев красный флаг, не имеет права трогаться с места до выяснения обстоятельств.\n\nСистема сигналов флагами является одной из старейших на железнодорожном транспорте. Несмотря на развитие радиосвязи и электронных систем, визуальный сигнал флагом остаётся обязательным элементом процедуры отправления поезда. Это обеспечивает дополнительный уровень безопасности: даже при отказе радиостанции кондуктор может передать сигнал машинисту визуально.\n\nСогласование между кондуктором и машинистом — критически важный момент в работе поезда. От правильности этой процедуры зависит безопасность пассажиров: неправильный сигнал может привести к преждевременному отправлению поезда с незакрытыми дверями или, наоборот, к задержке маршрута."}, {"id": "4.2", "points": 10, "question": "Что такое «нитка» в профессиональном жаргоне железнодорожников?", "options": ["А) Вагонная связка", "Б) Поезд на графике движения", "В) Тормозная магистраль", "Г) Электрический кабель"], "answer": "Б) Поезд на графике движения**", "explanation": "«Нитка» — профессиональный термин, обозначающий отдельный поезд на графике движения. График движения поездов представляет собой таблицу, в которой по вертикали указаны станции, а по горизонтали — время. Каждый поезд отображается на этом графике в виде линии («нитки»), соединяющей станцию отправления с станцией назначения.\n\n«Нитка графика» — графическое представление движения поезда, показывающее расписание и маршрут. По нитке графика можно определить время прибытия, отправления и стоянки на каждой станции, а также скорость следования и время оборота локомотива.\n\nДиспетчеры работают с графиком движения как с основным инструментом планирования. Каждое изменение в расписании — задержка, добавление Extra поезда, отмена — отражается на графике в виде новой или изменённой нитки. Умение «читать» график и оперировать нитками — ключевой навык поездного диспетчера.\n\nТермин «нитка» возник от графического способа представления: на бумаге поезд выглядит как тонкая линия — нитка, протянутая от одной станции к другой. Этот наглядный метод планирования используется на железных дороге с XIX века и до сих пор остаётся основным инструментом управления движением."}, {"id": "4.3", "points": 20, "question": "Кто такой «хороший бегун» на горке сортировочной станции?", "options": ["А) Быстрый локомотив", "Б) Тяжело загруженный вагон с хорошим ускорением", "В) Опытный составитель поездов", "Г) Лёгкий порожний вагон"], "answer": "Б) Тяжело загруженный вагон с хорошим ускорением**", "explanation": "На сортировочных станциях вагоны скатываются с горки под действием силы тяжести. «Хороший бегун» — это тяжело загруженный вагон (например, 4-осный полувагон с 70 тоннами груза), который быстро набирает скорость и достигает нужной позиции на пути промежуточной остановки. Масса вагона обеспечивает инерцию, и он уверенно «бежит» по горке.\n\nВагоны-бегуны — ключевой элемент работы сортировочной станции. От правильного расчёта скоростей скатывания зависит точность расстановки вагонов: если вагон скатывается слишком быстро, он может столкнуться с другим вагоном, слишком медленно — не докатится до нужной позиции.\n\n«Плохой бегун» — это лёгкий порожний вагон, который медленно набирает скорость и может остановиться на полпути. Такие вагоны требуют дополнительной подталкивающей тяги или ручного толкания составителем. На современных станциях для решения этой проблемы применяются автоматические тормозные устройства на горке.\n\nРасчёт скоростей скатывания — точная инженерная задача, которая учитывает массу вагона, сопротивление воздуха, трение в узлах, уклон горки и погодные условия. Диспетчер горки постоянно корректирует настройки горки в зависимости от состава вагонов, идущих на сортировку."}, {"id": "4.4", "points": 20, "question": "Какая часть сортировочной станции называется «горбом» и где она располагается?", "options": ["А) Начальная часть горки у локомотива", "Б) Верхняя точка горки, от которой начинается скатывание вагонов", "В) Конечная часть горки у тормозов", "Г) Платформа для наблюдения за вагонами"], "answer": "Б) Верхняя точка горки, от которой начинается скатывание вагонов**", "explanation": "«Горб» — верхняя точка сортировочной горки, с которой вагоны начинают своё скатывание вниз под действием силы тяжести. Это критически важный элемент конструкции горки: именно здесь происходит разделение состава на отдельные вагоны или группы вагонов, которые направляются на разные пути.\n\nСортировочная горка состоит из трёх основных частей: подъёмная (подходная) часть, горб и спускная (скатная) часть. Подъёмная часть поднимает состав на необходимую высоту, горб является точкой разделения, а спускная часть обеспечивает скатывание вагонов на пути сортировочного парка.\n\nПервая сортировочная горка в России была построена в 1899 году на станции Ртищево. С тех пор технология сортировочных горок совершенствовалась, но принцип остался тем же: вагоны разделяются на горбе и скатываются вниз под действием гравитации.\n\nСовременные горки оснащаются автоматическими замедлителями, датчиками скорости и компьютерными системами управления. Диспетчер горки контролирует процесс на мониторах и может вмешаться при необходимости. Однако основная физика — сила тяжести, действующая на горбе — остаётся неизменной."}, {"id": "4.5", "points": 30, "question": "В каких единицах измеряется грузооборот — главный показатель работы грузового транспорта?", "options": ["А) Тонны-часы", "Б) Тонно-километры", "В) Вагоно-кيلометры", "Г) Киловатт-часы"], "answer": "Б) Тонно-километры**", "explanation": "Грузооборот измеряется в тонно-километрах (ткм) — это произведение массы груза в тоннах на расстояние перевозки в километрах. Грузооборот является главным показателем работы грузового транспорта, поскольку учитывает не только объём перевозок, но и дальность, что даёт полное представление о масштабе проделанной работы.\n\nРасчёт прост: если поезд везёт 2 000 тонн угля на расстояние 3 000 км, грузооборот этого рейса составит 6 000 000 тонно-километров (6 млн ткм). При грузообороте РЖД в 3 075,3 млрд ткм за 2025 год это означает колоссальный объём работы, сопоставимый с перевозкой десятков миллиардов тонн на средние расстояния.\n\nГрузооборот — основной показатель для определения потребности в инфраструктуре: количестве локомотивов, вагонов, грузовых путей, пропускной способности станций. По грузообороту РЖД занимает второе место в мире после китайских железных дорог, что подтверждает стратегическую важность российской железнодорожной сети.\n\nДля студентов понимание единицы «тонно-километр» является ключевым для осмысления экономики транспорта. Именно грузооборот связывает три важнейших параметра: вес груза, расстояние и стоимость перевозки, формируя основу для тарифообразования и финансового планирования компании."}]}, {"name": "Масштаб", "categories": ["Безопасность и качество", "Общие вопросы по РЖД", "Электроснабжение и ЖАТ", "Разное"], "questions": [{"id": "1.1", "points": 10, "question": "Какое место в мире занимает ОАО «РЖД» по безопасности движения?", "options": ["А) Третье", "Б) Второе", "В) Первое", "Г) Пятое"], "answer": "В) Первое**", "explanation": "ОАО «РЖД» занимает первое место в мире по безопасности движения. Этот показатель является одним из ключевых в деятельности компании и результатом многолетней работы по внедрению современных систем безопасности, контролю состояния инфраструктуры и подготовке высококвалифицированных кадров.\n\nПомимо безопасности, РЖД является мировым лидером по энергоэффективности грузовых перевозок и точности движения пассажирских поездов. Эти три показателя — безопасность, энергоэффективность и пунктуальность — составляют основу репутации компании на международном рынке.\n\nДостижение первого места стало возможным благодаря комплексному подходу: от внедрения системы ЕВКЦ (Единая автоматизированная система управления перевозками) до модернизации инфраструктуры и обучения персонала. Каждый год компания инвестирует миллиарды рублей в развитие систем безопасности, что позволяет снижать количество происшествий и поддерживать высочайшие стандарты.\n\nДля студентов этот факт важен тем, что показывает: безопасность на железной дороге — это не просто соблюдение правил, а результат системной работы тысяч специалистов по всему миру."}, {"id": "1.2", "points": 10, "question": "Какой процент грузов был доставлен вовремя в 2025 году?", "options": ["А) 92,3%", "Б) 95,1%", "В) 97,9%", "Г) 99,2%"], "answer": "В) 97,9%**", "explanation": "В 2025 году 97,9% грузов было доставлено вовремя — это уровень мирового класса, который подтверждает надёжность железнодорожной системы России. Для сравнения: в авиационных перевозках показатель пунктуальности составляет около 80–85%, а в автомобильных — ещё ниже.\n\nВысокий процент доставки вовремя обеспечивается несколькими факторами: чётким графиком движения поездов, эффективной работой диспетчерских служб, современными системами управления движением и достаточным количеством локомотивов и вагонов. Каждый поезд следует по расписанию, и любая задержка автоматически фиксируется системой.\n\nПоказатель 97,9% означает, что из каждых 100 поездов с грузом только 2–3 прибывают с задержкой. Это критически важно для экономики страны: своевременная доставка сырья, материалов и готовой продукции обеспечивает бесперебойную работу промышленных предприятий.\n\nДля студентов этот факт демонстрирует масштаб и сложность логистической системы, которой управляет РЖД. Достичь такого показателя на территории 11 часовых поясов — это подлинное инженерное достижение."}, {"id": "1.3", "points": 20, "question": "Что делает «автоблокировка» на железнодорожной линии?", "options": ["А) Разрешает движение поездов без остановок", "Б) Делит линию на блок-участки и автоматически обеспечивает безопасные интервалы между поездами", "В) Контролирует скорость поездов через спутник", "Г) Управляет освещением на переездах"], "answer": "Б) Делит линию на блок-участки и автоматически обеспечивает безопасные интервалы между поездами**", "explanation": "Автоблокировка (АБУ) — одна из важнейших систем безопасности на железной дороге. Её принцип работы прост и элегантен: линия делится на блок-участки длиной от 1 до 5 км, и каждый участок автоматически закрывается для следующего поезда, пока предыдущий находится на нём.\n\nКогда поезд входит в блок-участок, система автоматически устанавливает на входном сигнале запрещающий показатель (красный огонь). Светофор показывает красный — это означает, что участок занят, и следующий поезд не может на него войти. Когда поезд покидает участок, светофор автоматически переключается на разрешающий показатель.\n\nАвтоблокировка обеспечивает безопасный интервал между поездами без участия человека. Это принципиально отличает её от ручной блокировки, где безопасность зависела от диспетчера. Автоматизация исключает человеческий фактор — главную причину аварий на транспорте.\n\nСовременная автоблокировка сочетается с системой АЛС (автоматическая локомотивная сигнализация), которая передаёт информацию о сигнале прямо в кабину машиниста. Если машинист проезжает запрещающий сигнал, система автоматически применяет тормоза. Таким образом, автоблокировка и АЛС работают в паре, создавая двухуровневую систему безопасности."}, {"id": "1.4", "points": 20, "question": "Какие цвета используют железнодорожные сигналы и что они означают?", "options": ["А) Красный — свободно, зелёный — стоп, жёлтый — осторожно", "Б) Красный — стоп, жёлтый — осторожно (быть готовым к остановке), зелёный — путь свободен", "В) Красный — осторожно, зелёный — стоп, жёлтый — свободно", "Г) Красный — стоп, зелёный — осторожно, жёлтый — путь свободен"], "answer": "Б) Красный — стоп, жёлтый — осторожно (быть готовым к остановке), зелёный — путь свободен**", "explanation": "Железнодорожные сигналы — это «язык железной дороги», понимание которого жизненно важно для каждого, кто работает на магистрали. Три основных цвета — красный, жёлтый и зелёный — имеют строго определённые значения.\n\nКрасный огонь означает абсолютный запрет на движение. Поезд должен остановиться перед сигналом и ждать разрешающего показателя. Это самый важный сигнал безопасности — его нарушение может привести к катастрофическим последствиям.\n\nЖёлтый огонь предупреждает машиниста: впереди находится участок, который потребует снижения скорости или остановки. Машинист должен быть готов к торможению. Жёлтый сигнал — это не разрешение на проезд, а предупреждение о необходимости быть внимательным.\n\nЗелёный огонь разрешает движение с установленной скоростью. Путь свободен, и машинист может продолжать следование. Однако даже при зелёном сигнале машинист обязан соблюдать скоростной режим и быть готовым к изменению обстановки.\n\nСистема железнодорожных сигналов была разработана более 150 лет назад и с тех пор не претерпела существенных изменений — настолько она совершенна. Этот простой и надёжный «язык» обеспечивает безопасность движения на всей сети РЖД протяжённостью более 85 тыс. км."}, {"id": "1.5", "points": 30, "question": "Какой новый профессиональный праздник появился в России в 2023 году?", "options": ["А) День железнодорожника", "Б) День машиниста", "В) День диспетчера", "Г) День проводника"], "answer": "Б) День машиниста**", "explanation": "31 марта 2023 года в России впервые отметили День машиниста — новый профессиональный праздник, появившийся более чем через 180 лет после появления первой железной дороги. Несмотря на то что профессия машиниста является самой старой на железной дороге, официальный праздник для неё появился только недавно.\n\nИнтересно, что профессиональный праздник машинистов был учреждён на фоне активного развития профессии: впервые в истории на поездах стали работать женщины-машинисты. 31 января 2022 года Алёна Миронова из Башкирии стала первой женщиной-машинистом на грузовых поездах, работающих на переменном токе. Это событие стало символом обновления профессии.\n\nДень машиниста отмечается 31 марта — в день, когда в 1837 году открылось движение по Царскосельской железной дороге — первой в России. Таким образом, праздник связан с самим началом железнодорожной эры в стране.\n\nПрофессия машиниста требует уникальных качеств: высокой концентрации внимания, умения принимать решения в экстренных ситуациях, ответственности за жизни тысяч пассажиров. Машинист управляет составом массой тысячи тонн на скорости до 160 км/ч и более — это одна из самых ответственных профессий на транспорте."}, {"id": "2.1", "points": 10, "question": "Сколько че
